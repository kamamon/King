      if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const ns = pinch.s * d / Math.max(10, pinch.d); const wx = (pinch.cx - this.vw / 2) / pinch.s + pinch.camx, wy = (pinch.cy - this.vh / 2) / pinch.s + pinch.camy; const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2; this.cam.s = ns; this.clamp(); this.cam.x = wx - (cx - this.vw / 2) / this.cam.s; this.cam.y = wy - (cy - this.vh / 2) / this.cam.s; this.clamp(); this.req(); return; }
      if (drag && p.moved) { this.cam.x = drag.camx - (x - drag.x) / this.cam.s; this.cam.y = drag.camy - (y - drag.y) / this.cam.s; this.clamp(); this.req(); }
    };
    const up = (e) => { const p = ptrs.get(e.pointerId); if (!p) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!p.moved && ptrs.size === 0) this.tap(p.x, p.y); if (!ptrs.size) drag = null; };
    cv.onpointerup = up; cv.onpointercancel = up;
    cv.onwheel = (e) => { e.preventDefault(); const [x, y] = pos(e); const [wx, wy] = this.s2w(x, y); this.cam.s *= Math.exp(-e.deltaY * 0.0015); this.clamp(); this.cam.x = wx - (x - this.vw / 2) / this.cam.s; this.cam.y = wy - (y - this.vh / 2) / this.cam.s; this.clamp(); this.req(); };
  },
  tap(x, y) {
    let best = null, bd = 28;
    for (const P of D.PROVINCES) { const [sx, sy] = this.w2s(P.x, P.y); const d = Math.hypot(sx - x, sy - y); if (d < bd) { bd = d; best = P.id; } }
    this.selCounty = null;

    }

  select(pid) {

};

UI.allotBind = (c) => {
  const A2 = G.me.army;
  const redraw = () => UI.tab('army', true);
  for (const b of U.$$('[data-mv]', c)) b.onclick = () => { UI.allotOpen = UI.allotOpen === b.dataset.mv ? null : b.dataset.mv; redraw(); };
  for (const b of U.$$('[data-om]', c)) b.onclick = () => { S.setOrder(b.dataset.om, b.dataset.mode); redraw(); };
  for (const b of U.$$('[data-dep]', c)) b.onclick = () => { A2.dep = b.dataset.dep; UI.toast(`${G.off[A2.dep].n}を副官にした`); redraw(); };
  const mg = U.$('[data-merge]', c); if (mg) mg.onclick = () => { const k = S.mergeSquads(); UI.toast(k ? `${k}隊をまとめた` : 'まとめられる隊はない'); redraw(); };
  const ed = U.$('.mv-ed', c); if (!ed) return;
  const s = A2.sq.find(x => x.id === ed.dataset.for); if (!s) return;
  const inp = U.$('#mv-n', ed), rng = U.$('#mv-r', ed);
  const val = () => U.clamp(Math.floor(Number(inp.value) || 0), 0, s.n);
  inp.oninput = () => { rng.value = val() || 1; };
  inp.onchange = () => { inp.value = Math.max(1, val()); rng.value = inp.value; };
  rng.oninput = () => { inp.value = rng.value; };
  for (const b of U.$$('[data-q]', ed)) b.onclick = () => { inp.value = Math.max(1, Math.round(s.n * Number(b.dataset.q))); rng.value = inp.value; };
  for (const b of U.$$('[data-dst]', ed)) b.onclick = () => { UI.allotDst = b.dataset.dst; for (const x of U.$$('[data-dst]', ed)) { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); } };
  const go = U.$('[data-go]', ed);
  if (go) go.onclick = () => {
    const n = val(); if (n < 1) { UI.toast('人数を入れてください'); return; }
    const dst = UI.allotDst || null, who = dst ? G.off[dst].n : '直属';
    const moved = S.moveTroops(s.id, n, dst);
    if (moved) { UI.toast(`${D.UT[s.t].n}${U.num(moved)}人を${who}${dst ? 'に任せた' : 'に戻した'}`); UI.allotOpen = null; }
    redraw();
  };
  const db = U.$('[data-disband]', ed);
  if (db) db.onclick = () => {
    const n = val(); if (n < 1) { UI.toast('人数を入れてください'); return; }
    if (db.dataset.sure !== '1') { db.dataset.sure = '1'; db.textContent = `${U.num(n)}人を解散する（もう一度押す）`; db.classList.add('warn'); return; }

    if (k) { UI.toast(`私兵${U.num(k)}人を解散した。領地へ帰った`); S.log(`私兵${U.num(k)}人を解散し、領地へ帰した。`); UI.allotOpen = null; }
    redraw();
  };
};

UI.duel = (o) => UI.modal((box, close) => {
  const A0 = o.a, B0 = o.b;
  const isMe = !!A0.player || o.a.id === G?.me?.oid;
  const armor = 0;
  const itemDuel = 1;
  const F = (x, extra = 0) => { const fx = k => S.fx(x, k); const hp = 60 + (x.bu || 40) * 1.4 + extra + fx('duel_hp'); return { n: x.n, bu: x.bu || 40, chi: x.chi || 40, tr: x.tr || [], st: x.st || 'bal', hp0: hp, hp, ki: 20, dm: 1 + fx('duel'), rd: fx('duel_read'), kg: 1 + fx('duel_ki'), fl: fx('duel_flee') }; };
  const a = F(A0, armor), b = F(B0);
  let round = 0, last = null, done = false, hintAct = null;
  const log = [];
  box.innerHTML = `<div class="mseal" aria-hidden="true">一騎<br>打ち</div><h3>${U.esc(o.title || '一騎打ち')}</h3>
    <div class="duel">
      <div class="duel-row">
        <div class="fighter"><b>${U.esc(a.n)}</b><small>武${a.bu}</small><div class="hp"><i id="d-ah"></i></div><div class="ki"><i id="d-ak"></i></div></div>
        <div class="duel-vs">対</div>
        <div class="fighter r"><b>${U.esc(b.n)}</b><small>武${b.bu}</small><div class="hp"><i id="d-bh"></i></div><div class="ki"><i id="d-bk"></i></div></div>
      </div>
      <div class="duel-hint" id="d-hint"></div>
      <div class="duel-acts" id="d-acts"></div>
      <div class="duel-log" id="d-log" aria-live="polite"></div>
      <div style="display:flex;justify-content:flex-end"><button class="btn sm" id="d-auto">おまかせ</button></div>
    </div>`;
  const upd = () => {
    U.$('#d-ah', box).style.width = U.clamp(a.hp / a.hp0 * 100, 0, 100) + '%';
    U.$('#d-bh', box).style.width = U.clamp(b.hp / b.hp0 * 100, 0, 100) + '%';
    U.$('#d-ak', box).style.width = U.clamp(a.ki, 0, 100) + '%';
    U.$('#d-bk', box).style.width = U.clamp(b.ki, 0, 100) + '%';
    U.$('#d-log', box).innerHTML = log.slice(-4).map(s => `<div>${s}</div>`).join('');
    const acts = U.$('#d-acts', box);
    acts.innerHTML = ['atk', 'pow', 'grd', 'sp', 'flee'].map(k => `<button data-k="${k}" ${done || (k === 'sp' && a.ki < 100) || (k === 'flee' && o.noFlee) || (k === 'flee' && o.sport) ? 'disabled' : ''}>${UI.DUEL_ACT[k].n}<small>${UI.DUEL_ACT[k].d}</small></button>`).join('');
    for (const bb of U.$$('button', acts)) bb.onclick = () => turn(bb.dataset.k);
  };
  const aiPick = () => {
    if (b.ki >= 100 && Math.random() < 0.75) return 'sp';
    if (b.hp < b.hp0 * 0.25 && b.st !== 'ins' && !o.sport && Math.random() < 0.18) return 'flee';
    const w = { atk: 3, pow: b.st === 'ins' ? 3 : 2, grd: b.st === 'chi' ? 3 : 2 };
    if (last === 'grd') { w.atk += 2; w.pow -= 1; }
    if (last === 'pow') { w.grd += 2.5; }
    if (last === 'atk') { w.pow += 1.5; }
    return U.wpick(Object.keys(w), k => w[k]);
  };
  const newHint = () => {
    hintAct = aiPick();
    const p = U.clamp(0.35 + (a.chi - b.chi) / 200 + (a.bu - b.bu) / 300 + (a.st === 'ins' ? 0.1 : 0) + a.rd - b.rd * 0.5, 0.15, 0.92);
    const el = U.$('#d-hint', box);
    if (Math.random() < p) {
      const shown = Math.random() < 0.82 ? hintAct : U.pick(['atk', 'pow', 'grd']);
      el.textContent = { atk: `${b.n}は間合いを詰めてくる……`, pow: `${b.n}が大きく振りかぶった！`, grd: `${b.n}は構えを固めた。`, sp: `${b.n}の気が満ちている！`, flee: `${b.n}の目が泳いでいる……` }[shown];
    } else el.textContent = `${b.n}の動きが読めない。`;
  };
  const dmg = (x, y, m) => (8 + x.bu * 0.18) * Math.pow(x.bu / Math.max(1, y.bu), 0.6) * U.rf(0.85, 1.15) * m * x.dm;
  const finish = (res) => { done = true; upd(); setTimeout(() => close(res), 900); };
  const turn = (ka) => {
    if (done) return;
    round++;
    const kb = hintAct || aiPick();
    if (ka === 'flee') {
      const pr = U.clamp(0.35 + (a.bu - b.bu) / 200 + (G && G.me && G.me.eq.horse ? 0.15 : 0) + a.fl, 0.1, 0.92);
      if (Math.random() < pr) { log.push(`${a.n}は馬首を返して退いた。`); return finish({ win: false, fled: true }); }
      const d = dmg(b, a, 1.2); a.hp -= d; log.push(`退き損ねた！ ${a.n}は${Math.round(d)}の手傷を負った。`);
    } else if (kb === 'flee') {
      const pr = U.clamp(0.35 + (b.bu - a.bu) / 200, 0.1, 0.8);
      if (Math.random() < pr) { log.push(`${b.n}は逃げ出した！`); return finish({ win: true, fled: true }); }
      const d = dmg(a, b, 1.3); b.hp -= d; log.push(`${b.n}が逃げようとした背に一撃！（${Math.round(d)}）`);
    } else {
      const [ma, mb] = UI.DUEL_M[ka][kb];
      const da = dmg(a, b, ma) * itemDuel, db = dmg(b, a, mb);
      b.hp -= da; a.hp -= db;
      const desc = { atk: '打ち込んだ', pow: '渾身の強撃を放った', grd: '受けに回った', sp: '必殺の一撃を繰り出した' };
      log.push(`${a.n}は${desc[ka]}。${b.n}は${desc[kb]}。<b>${Math.round(da)}</b> 対 <b>${Math.round(db)}</b>`);
      a.ki = ka === 'sp' ? 0 : Math.min(100, a.ki + (({ atk: 10, pow: 8, grd: 22 }[ka] || 0) + (db > 0 ? 10 : 0)) * a.kg);
      b.ki = kb === 'sp' ? 0 : Math.min(100, b.ki + (({ atk: 10, pow: 8, grd: 22 }[kb] || 0) + (da > 0 ? 10 : 0)) * b.kg);
    }
    last = ka;
    if (a.hp <= 0 || b.hp <= 0) {
      const win = b.hp <= 0 && a.hp > b.hp;
      const kill = !o.sport && Math.random() < 0.65;
      log.push(win ? `${a.n}の勝ちだ！${kill ? `${b.n}を討ち取った！` : ''}` : `${a.n}は打ち負かされた……`);
      return finish({ win, kill });

    if (round >= 12) { log.push('勝負つかず。両者は互いに退いた。'); return finish({ win: false, draw: true }); }
    upd(); newHint();
  };
  U.$('#d-auto', box).onclick = () => {
    // 読みに応じて最善手
    const best = (a.ki >= 100) ? 'sp' : hintAct === 'pow' ? 'grd' : hintAct === 'grd' ? 'atk' : hintAct === 'atk' ? 'pow' : 'atk';
    turn(best);
  };
  upd(); newHint();
});

      U.$('#db-g', box).style.left = `calc(${U.clamp(g, 0, 100)}% - 3px)`;

    const turn = (ka) => {

const SAVE = {
  KEY: 'shichiyu.v1.',
  SLOTS: ['auto', '1', '2', '3'],
  cloud: null, uid: null, cloudTried: false,
  async initCloud() {
    if (SAVE.cloudTried) return; SAVE.cloudTried = true;
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user || typeof user.id !== 'function') return;
      const uid = await user.id();
      if (!uid) return;
      SAVE.cloud = db; SAVE.uid = uid;
    } catch (e) { SAVE.cloud = null; }
  },
  ref(slot) { return SAVE.cloud.collection('data/users/' + SAVE.uid).doc('save-' + slot); },
  async pack(json) {
    try {
      if (typeof CompressionStream === 'function') {
        const cs = new CompressionStream('gzip');
        const buf = await new Response(new Blob([json]).stream().pipeThrough(cs)).arrayBuffer();
        let bin = ''; const bytes = new Uint8Array(buf);
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return 'gz:' + btoa(bin);
      }
    } catch (e) {}
    return 'raw:' + btoa(unescape(encodeURIComponent(json)));
  },
  async unpack(str) {
    str = String(str || '').trim();
    if (str.startsWith('{')) return str;
    if (str.startsWith('gz:')) {
      const bin = atob(str.slice(3)); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const ds = new DecompressionStream('gzip');
      return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    }
    if (str.startsWith('raw:')) return decodeURIComponent(escape(atob(str.slice(4))));
    throw new Error('読み込めない形式です');
  },
  meta() { const o = S.myOff(); return { date: S.dateStr(), name: o.n, rank: D.RANKS[G.me.rank].name, c: S.cname(o.c), ts: Date.now() }; },
  _chain: {},
  async save(slot) {
    if (!G) return false;
    const data = await SAVE.pack(S.serialize());
    const rec = { meta: SAVE.meta(), data };
    let ok = false;
    try { localStorage.setItem(SAVE.KEY + slot, JSON.stringify(rec)); ok = true; } catch (e) {}
    if (SAVE.cloud) {
      // 同じ文書への書き込みは一つずつ
      const p = (SAVE._chain[slot] || Promise.resolve()).then(() => SAVE.ref(slot).set(rec)).then(() => true, () => false);
      SAVE._chain[slot] = p;
      if (!ok) ok = await p;
    }
    return ok;
  },
  async read(slot) {
    let loc = null, cl = null;
    try { const s = localStorage.getItem(SAVE.KEY + slot); if (s) loc = JSON.parse(s); } catch (e) {}
    await Promise.race([SAVE.ready || Promise.resolve(), U.sleep(1500)]);
    if (SAVE.cloud) { try { const snap = await Promise.race([SAVE.ref(slot).get(), U.sleep(4000).then(() => null)]); if (snap && snap.exists) cl = snap.data(); } catch (e) {} }
    if (loc && cl) return (cl.meta?.ts || 0) > (loc.meta?.ts || 0) ? cl : loc;
    return loc || cl;
  },
  async list() {
    const out = [];
    for (const s of SAVE.SLOTS) { const r = await SAVE.read(s); if (r && r.meta) out.push({ slot: s, meta: r.meta }); }
    return out;
  },
  async hasAny() { try { for (const s of SAVE.SLOTS) if (localStorage.getItem(SAVE.KEY + s)) return true; } catch (e) {} const l = await Promise.race([SAVE.list(), U.sleep(2500).then(() => [])]); return l.length > 0; },
  async load(slot) {
    const r = await SAVE.read(slot);
    if (!r) throw new Error('セーブが見つかりません');
    const json = await SAVE.unpack(r.data);
    S.load(json);
    return true;
  },
  auto() { return SAVE.save('auto'); },
};

UI.saveMenu = async () => {
  const list = await SAVE.list();
  const by = Object.fromEntries(list.map(x => [x.slot, x.meta]));
  const ch = ['1', '2', '3'].map(s => ({ v: s, label: `枠${s}に保存`, sub: by[s] ? `${by[s].c}・${by[s].name}（${by[s].rank}）${by[s].date}` : '空き' }));
  ch.push({ v: 'export', label: 'セーブを書き出す', sub: '文字列をコピーして、別の端末で読み込める' });
  ch.push({ v: null, label: 'やめる' });
  const k = await UI.choose({ title: '保存', body: SAVE.cloud ? '保存は端末とアカウントの両方に残る。' : '保存はこの端末のブラウザに残る。念のため書き出しもしておくと安心。', choices: ch });
  if (!k) return;
  if (k === 'export') { const code = await SAVE.pack(S.serialize()); return UI.copyBox({ title: 'セーブの書き出し', body: 'この文字列を保管しておけば、「セーブを読み込む」から再開できる。', text: code, readonly: true }); }
  const ok = await SAVE.save(k);
  UI.toast(ok ? `枠${k}に保存した` : '保存できなかった（書き出しを使って）');
};
UI.loadMenu = async (withImport) => {
  const list = await SAVE.list();
  const ch = list.map(x => ({ v: x.slot, label: `${x.slot === 'auto' ? '自動保存' : '枠' + x.slot}：${x.meta.c}・${x.meta.name}`, sub: `${x.meta.rank}　${x.meta.date}` }));
  if (withImport) ch.push({ v: 'import', label: '書き出した文字列から読み込む' });
  ch.push({ v: null, label: 'やめる' });
  const k = await UI.choose({ title: '読み込み', body: list.length ? '' : '保存されたデータがない。', choices: ch });
  if (!k) return;
  try {
    if (k === 'import') {
      const code = await UI.copyBox({ title: 'セーブを読み込む', body: '書き出した文字列を貼り付ける。', text: '' });
      if (!code) return;
      S.load(await SAVE.unpack(code));
    } else await SAVE.load(k);
    UI.map.cam = null;
    UI.main('map');
    UI.toast(`${S.dateStr()}から再開`);
  } catch (e) { UI.info({ title: '読み込めなかった', body: e.message }); }
};

/* ---------- 合戦との接続 ---------- */
HOOK.battle = async (spec) => {
  const res = await V.run(spec);
  if (G) { UI.show('main'); UI.refresh(); }
  return res;
};
HOOK.choose = (o) => UI.choose(o);
HOOK.info = (o) => UI.info(o);
HOOK.number = (o) => UI.askNumber(o);
HOOK.duel = (o) => UI.duel(o);

/* ---------- 起動 ---------- */
window.addEventListener('error', (e) => { try { UI.toast('エラー：' + (e.message || '')); } catch (x) {} });
window.addEventListener('unhandledrejection', (e) => { try { UI.toast('エラー：' + (e.reason && e.reason.message || '')); } catch (x) {} });
SAVE.ready = SAVE.initCloud();
try { window.claude?.hot?.snapshot?.(() => (G ? { save: S.serialize(), tab: UI.curTab || 'map' } : {})); } catch (e) {}
const boot = (data) => {
  try { MAP.init(); } catch (e) { console.warn(e); }
  try {
    if (data && data.save) { S.load(data.save); UI.main(data.tab || 'map'); return; }
  } catch (e) {}
  UI.title();
};
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
} catch (e) { boot({}); }

</script>
