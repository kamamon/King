<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>七雄覇道</title>
<meta name="theme-color" content="#0e1614">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: 軍議の間 — 青銅の板に囲まれた帛書の地図。命令や報せは竹簡に書かれて届く */
:root{
  --bg:#0e1614;      /* 青銅の緑青に沈んだ黒 */
  --bg2:#15211d;     /* 青銅の板 */
  --bg3:#1d2d28;     /* 浮き彫り */
  --line:#304a42;    /* 刻線 */
  --fg:#ebe3cd;      /* 骨色の文字 */
  --fg2:#a8b3a4;
  --bronze:#c9a14a;  /* 鍍金の青銅 */
  --bronze2:#8a6d2f;
  --jade:#62b39b;    /* 緑青・味方・操作できるもの */
  --seal:#c2452f;    /* 朱印・敵・危険 */
  --silk:#dccfa8;    /* 帛書の地図 */
  --slip:#d8c793;    /* 竹簡 */
  --ink:#231c13;     /* 墨 */
  --good:#8fc77a; --warn:#d9a640; --bad:#e0664a;
  --font-display:"Yuji Boku","Zen Antique","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --font-head:"Zen Antique","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;width:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0;box-sizing:border-box}
input[type=range]{accent-color:var(--bronze)}
h1,h2,h3{font-family:var(--font-head);font-weight:400;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.pad{padding-left:var(--gut-l);padding-right:var(--gut-r)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font-weight:500;letter-spacing:.02em;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--jade)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#d8b45e,#a7812f);color:#1e160a;border-color:#e6c77c;font-weight:700}
.btn.seal{background:var(--seal);color:#fff4e6;border-color:#e27560;font-family:var(--font-head);letter-spacing:.12em}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn.wide{width:100%}

/* ---------- title ---------- */
#scr-title{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1b2a25 0%,var(--bg) 70%)}
.title-map{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;transition:opacity .8s}
.title-map.real{opacity:.38}
.title-wrap{position:relative;display:flex;gap:28px;align-items:center;flex-direction:column;padding-block:24px}
.title-main{display:flex;gap:20px;align-items:flex-start}
.title-v{writing-mode:vertical-rl;font-family:var(--font-display);font-size:min(19vw,104px);line-height:1.05;color:var(--fg);letter-spacing:.06em;text-shadow:0 2px 0 #000;white-space:nowrap;text-wrap:nowrap}
.title-sub{writing-mode:vertical-rl;font-family:var(--font-head);color:var(--bronze);font-size:15px;letter-spacing:.3em;padding-top:12px;white-space:nowrap;text-wrap:nowrap}
.title-seal{width:54px;height:54px;background:var(--seal);color:#fff4e6;font-family:var(--font-display);font-size:22px;display:grid;place-items:center;border-radius:4px;transform:rotate(-4deg);box-shadow:0 2px 0 #6e1d12;line-height:1;text-align:center}
.title-btns{display:flex;flex-direction:column;gap:10px;width:min(300px,78vw)}
.title-note{font-size:12px;color:var(--fg2);text-align:center;max-width:34ch}

/* ---------- setup / edit ---------- */
.flow{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:18px 120px}
.flow-in{max-width:900px;margin:0 auto}
.step-h{display:flex;align-items:baseline;gap:12px;margin:6px 0 14px}
.step-h h2{font-size:24px}
.step-h small{color:var(--fg2)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pick{position:relative;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pick:hover{border-color:var(--jade)}
.pick.on{border-color:var(--bronze);box-shadow:inset 0 0 0 1px var(--bronze)}
.pick b{font-family:var(--font-head);font-size:18px;font-weight:400}
.pick small{color:var(--fg2);font-size:12.5px;line-height:1.5}
.pick .tag{position:absolute;top:10px;right:10px;font-size:11px;color:var(--bronze);letter-spacing:.08em}
.cseal{width:42px;height:42px;border-radius:4px;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;color:#fff6e4;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.pick .row{display:flex;gap:10px;align-items:center}
.sec-h{font-family:var(--font-head);color:var(--bronze);letter-spacing:.1em;font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--fg2)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stat-row{display:grid;grid-template-columns:3.2em 1fr 2.6em auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(48,74,66,.5)}
.stat-row b{font-family:var(--font-head);font-weight:400;font-size:16px}
.stat-row .bar{height:8px}
.stepper{display:flex;gap:6px}
.stepper button{width:38px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg3)}
.pts{font-family:var(--font-head);font-size:20px;color:var(--bronze)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg3);border-radius:999px;padding:6px 14px;min-height:36px}
.seg button.on{background:var(--bronze);color:#1e160a;border-color:var(--bronze);font-weight:700}
.chipgrid{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:8px 10px;text-align:left;max-width:100%;min-width:0}
.tchip b{display:block;font-weight:700;font-size:14px}
.tchip small{display:block;color:var(--fg2);font-size:12px;line-height:1.45}
.tchip.on{border-color:var(--jade);background:#183a31}
.tchip:disabled{opacity:.4}
.tchip .x{font-style:normal;margin-left:8px;padding:0 4px;color:var(--fg2);cursor:pointer;font-weight:400}
.tchip.neg{border-color:#7a3a2c;background:#2c1d18}
.tchip.lv3 b{color:#f3d27a}
.tchip.sm{padding:5px 9px}
.tchip.sm b{font-size:13px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opt-row>span{font-size:14px;min-width:7em}
.seg.sm button{padding:4px 11px;min-height:32px;font-size:13px}
.modal.tall{max-height:min(94%,860px)}
.tp-search{width:100%;margin-top:10px;border:1px solid #9c8350;background:rgba(255,250,232,.85);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:15px}
.tp-cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;-webkit-overflow-scrolling:touch}
.modal .chip{border:1px solid #9c8350;background:rgba(255,250,232,.6);color:var(--ink)}
.modal .chip.on{background:#2e4a3f;color:#f3ead2;border-color:#1f3a30}
.tp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
.tp{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid #9c8350;background:rgba(255,250,232,.62);color:var(--ink);border-radius:8px;padding:7px 9px;min-height:44px;min-width:0}
.tp b{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:4px;width:100%}
.tp b em{font-style:normal;font-weight:400;font-size:10.5px;color:#7a6440;white-space:nowrap}
.tp small{font-size:11.5px;color:#5b4b31;line-height:1.4}
.tp.on{background:#2e4a3f;color:#f3ead2;border-color:#1f3a30}
.tp.on small,.tp.on b em{color:#cfe0d5}
.tp.neg:not(.on){border-color:#a8341f}
.tp:disabled{opacity:.4}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;padding:12px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:linear-gradient(0deg,var(--bg) 60%,rgba(14,22,20,0));display:flex;gap:10px;justify-content:flex-end;align-items:center}
.bottom-bar .grow{flex:1;color:var(--fg2);font-size:13px;min-width:0}
.banner-prev{width:64px;height:84px;position:relative;flex:none}
.banner-prev .pole{position:absolute;left:4px;top:0;bottom:0;width:3px;background:#5a4026}
.banner-prev .flag{position:absolute;left:7px;top:6px;width:50px;height:50px;display:grid;place-items:center;font-family:var(--font-head);font-size:34px;color:#f6efdc;border:2px solid var(--bronze)}

/* ---------- main ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding-block:calc(8px) 8px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:var(--bg2);border-bottom:1px solid var(--line);min-height:56px}
.hdr .cseal{width:36px;height:36px;font-size:20px;flex:none}
.hdr-id{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.3}
.hdr-id b{font-family:var(--font-head);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-id small{color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-res{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;line-height:1.35;flex:none}
.hdr-res .ap{display:flex;gap:3px;margin-top:2px}
.hdr-res .ap i{width:9px;height:13px;border-radius:2px;background:var(--slip);opacity:.9}
.hdr-res .ap i.used{background:transparent;border:1px solid var(--line)}
.hdr .bt-ic{flex:none}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:12px 110px;padding-left:var(--gut-l);padding-right:var(--gut-r);min-height:0}
.content.full{padding:0;overflow:hidden;position:relative}
.nav{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{flex:1;border:0;background:transparent;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--fg2);font-size:11px;min-height:54px}
.nav button i{font-style:normal;font-family:var(--font-head);font-size:20px;line-height:1.15}
.nav button.on{color:var(--bronze)}
.endturn{position:absolute;right:var(--gut-r);bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:5;width:68px;height:68px;border-radius:6px;border:0;background:var(--seal);color:#fff4e6;font-family:var(--font-display);font-size:15px;line-height:1.15;box-shadow:0 3px 0 #6e1d12,0 8px 18px rgba(0,0,0,.45);transform:rotate(-3deg);display:grid;place-items:center;padding:6px}
.endturn:active{transform:rotate(-3deg) translateY(2px);box-shadow:0 1px 0 #6e1d12}
.endturn small{display:block;font-family:var(--font-body);font-size:10px;opacity:.85}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 14px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed rgba(48,74,66,.7);padding:3px 0;font-size:14px;min-width:0}
.kv span{color:var(--fg2)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--jade)}
.bar.br>i{background:var(--bronze)}
.bar.rd>i{background:var(--seal)}
.list{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px 14px;width:100%}
.act:hover:not(:disabled){border-color:var(--jade)}
.act b{font-weight:700;font-size:15px}
.act small{grid-column:1/-1;color:var(--fg2);font-size:12.5px;line-height:1.5}
.act .why{grid-column:1/-1;color:var(--warn);font-size:12px}
.act:disabled{opacity:.55;cursor:default}
.apcost{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--fg2)}
.apcost i{width:8px;height:12px;border-radius:2px;background:var(--slip)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 14px;min-height:34px;font-size:13px}
.tabs button.on{border-color:var(--bronze);color:var(--bronze)}
.sq{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.sq .ty{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-family:var(--font-head);font-size:18px;background:var(--bg3);border:1px solid var(--line)}
.sq .mid{min-width:0}
.sq .mid b{font-weight:700}
.sq .mid small{display:block;color:var(--fg2);font-size:12px}
.sq .bars{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:11px;color:var(--fg2)}
.wucard{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.wucard .face{width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-head);font-size:18px}
.wucard.dead{opacity:.45}
.note{color:var(--fg2);font-size:13px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--fg2);white-space:nowrap}
.pill.good{border-color:#4f7a44;color:var(--good)}.pill.bad{border-color:#7a3a2c;color:var(--bad)}.pill.war{border-color:#7a3a2c;color:#f2a08c;background:rgba(194,69,47,.15)}
.log{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.log div{padding:5px 0;border-bottom:1px dashed rgba(48,74,66,.6);display:grid;grid-template-columns:auto 1fr;gap:10px}
.log div span{color:var(--fg2);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.log .good{color:#cfe8c0}.log .bad{color:#f0b3a5}.log .big{color:#f3d27a}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;font-size:13px;min-width:100%}
table.tbl th,table.tbl td{padding:6px 8px;border-bottom:1px solid rgba(48,74,66,.6);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
table.tbl th{color:var(--fg2);font-weight:500;font-size:12px}
.prof{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}
.empty{color:var(--fg2);font-size:13px;padding:10px 0}

/* ---------- map ---------- */
.mapwrap{position:absolute;inset:0;background:var(--silk);touch-action:none}
.mapwrap canvas{display:block;width:100%;height:100%;touch-action:none}
.map-legend{position:absolute;left:var(--gut-l);top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 96px);pointer-events:none}
.map-legend span{background:rgba(35,28,19,.82);color:#efe3c4;border-radius:999px;padding:2px 9px;font-size:11.5px;display:flex;align-items:center;gap:5px}
.map-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.map-tools{position:absolute;right:var(--gut-r);top:10px;display:flex;flex-direction:column;gap:6px}
.map-tools button{width:40px;height:40px;border-radius:8px;border:1px solid #7d6c4c;background:rgba(244,234,208,.92);color:var(--ink);font-family:var(--font-head);font-size:18px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px var(--gut-r) 86px var(--gut-l);max-height:62%;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet-h h3{font-size:22px}
.sheet-x{margin-left:auto}

/* ---------- modal (竹簡) ---------- */
#modal-root{position:fixed;inset:0;z-index:60;pointer-events:none}
.mwrap{position:absolute;inset:0;background:rgba(5,9,8,.7);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:100%;max-width:560px;max-height:min(88%,760px);overflow-y:auto;-webkit-overflow-scrolling:touch;color:var(--ink);border-radius:12px 12px 0 0;padding:20px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);
  background:repeating-linear-gradient(90deg,rgba(80,60,20,.09) 0 1px,transparent 1px 28px),linear-gradient(180deg,#e2d29f,var(--slip));box-shadow:0 -6px 30px rgba(0,0,0,.5);animation:rise .18s ease}
@keyframes rise{from{transform:translateY(20px)}to{transform:none}}
@media (min-width:700px){.mwrap{align-items:center}.modal{border-radius:12px}}
.modal::before,.modal::after{content:"";position:absolute;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#6b5228 0 10px,transparent 10px 28px);opacity:.35}
.modal::before{top:10px}.modal::after{bottom:10px}
.modal h3{font-size:22px;margin:0 0 8px;padding-right:56px;color:#1d150b}
.modal .mseal{position:absolute;top:16px;right:var(--gut-r);width:48px;height:48px;background:var(--seal);color:#fff4e6;font-family:var(--font-display);font-size:16px;line-height:1.05;display:grid;place-items:center;text-align:center;border-radius:4px;transform:rotate(6deg);box-shadow:0 2px 0 #7a2416}
.modal .body{white-space:pre-wrap;font-size:15px;line-height:1.75}
.modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.modal .ch{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid #9c8350;background:rgba(255,250,232,.62);color:var(--ink);border-radius:8px;padding:10px 14px;min-height:44px}
.modal .ch:hover:not(:disabled){background:rgba(255,250,232,.95);border-color:#6b5228}
.modal .ch b{font-weight:700}
.modal .ch small{color:#5b4b31;font-size:12.5px;line-height:1.5}
.modal .ch:disabled{opacity:.45}
.modal .ch.on{background:#2e4a3f;color:#f3ead2;border-color:#1f3a30}
.modal .ch.dim{opacity:.62}
.modal .ch-g{font-family:var(--font-head);font-size:13px;color:#6b5428;margin:8px 2px 0;letter-spacing:.08em;border-bottom:1px solid rgba(120,90,40,.35);padding-bottom:2px}

<div id="app">

<div id="toast-root" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   七雄覇道 — utilities
   ========================================================= */
function U_MOD() {
  const U = {};
  U.ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  U.rf = (a, b) => a + Math.random() * (b - a);
  U.ch = p => Math.random() < p;
  U.pick = a => a[Math.floor(Math.random() * a.length)];
  U.wpick = (a, w) => {
    let t = 0;
    const ws = a.map(x => { const v = Math.max(0, w(x) || 0); t += v; return v; });
    if (t <= 0) return U.pick(a);
    let r = Math.random() * t;
    for (let i = 0; i < a.length; i++) { r -= ws[i]; if (r <= 0) return a[i]; }
    return a[a.length - 1];
  };
  U.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  U.clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  U.angNorm = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  U.angDiff = (a, b) => U.angNorm(b - a);
  U.sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
  U.avg = (a, f) => a.length ? U.sum(a, f) / a.length : 0;
  U.maxBy = (a, f) => { let best = null, bv = -Infinity; for (const x of a) { const v = f(x); if (v > bv) { bv = v; best = x; } } return best; };
  U.minBy = (a, f) => { let best = null, bv = Infinity; for (const x of a) { const v = f(x); if (v < bv) { bv = v; best = x; } } return best; };
  U.num = n => Math.round(n || 0).toLocaleString('ja-JP');
  U.fmt = n => {
    n = Math.round(n || 0);
    const s = n < 0 ? '-' : ''; n = Math.abs(n);
    if (n >= 1e8) return s + trim((n / 1e8).toFixed(n >= 1e9 ? 1 : 2)) + '億';
    if (n >= 1e4) return s + trim((n / 1e4).toFixed(n >= 1e5 ? 0 : 1)) + '万';
    return s + n.toLocaleString('ja-JP');
    function trim(x) { return x.replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1'); }
  };
  U.pct = v => Math.round(v * 100) + '%';
  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.uid = () => Math.random().toString(36).slice(2, 9);
  U.rng = seed => {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  };
  // value noise (seeded) for terrain
  U.noise2 = seed => {
    const r = U.rng(seed);
    const P = 256, perm = new Uint8Array(P * 2), val = new Float32Array(P);
    for (let i = 0; i < P; i++) { perm[i] = i; val[i] = r(); }
    for (let i = P - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    for (let i = 0; i < P; i++) perm[i + P] = perm[i];
    const v = (x, y) => val[perm[(perm[x & 255] + y) & 511] & 255];
    const sm = t => t * t * (3 - 2 * t);
    const n = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
      const u = sm(xf), w = sm(yf);
      return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
    };
    return (x, y, oct = 4) => { let s = 0, amp = 1, f = 1, tot = 0; for (let o = 0; o < oct; o++) { s += n(x * f, y * f) * amp; tot += amp; amp *= 0.5; f *= 2; } return s / tot; };
  };
  U.$ = (sel, root = document) => root.querySelector(sel);
  U.$$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  // tiny DOM builder
  U.h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
    return el;
  };
  U.sleep = ms => new Promise(r => setTimeout(r, ms));
  U.deep = o => JSON.parse(JSON.stringify(o));
  U.kanjiNum = n => {
    const d = '〇一二三四五六七八九';
    if (n <= 10) return n === 10 ? '十' : d[n];
    if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
    if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
    return String(n);
  };
  return U;
}
const U = U_MOD();

/* =========================================================
   七雄覇道 — static data
   ========================================================= */
const D = {};

D.START_YEAR = -245;

/* ---------- 七雄 ---------- */
D.COUNTRIES = {
  qin:  { id: 'qin',  name: '秦', color: '#26262d', mapc: '#3a3a44', cap: 'xianyang', trait: '軍功爵制・強弩', desc: '西方の大国。法による統治と軍功爵制で兵は精強。弩兵と歩兵に優れる。', bonus: { xbow: 1.12, inf: 1.05 }, aggr: 0.75, laws: ['gunkou', 'renza'] },
  zhao: { id: 'zhao', name: '趙', color: '#b8432d', mapc: '#b8432d', cap: 'handan',   trait: '胡服騎射',     desc: '北方の雄。胡服騎射の改革以来、騎兵が強い。名将が多い。', bonus: { cav: 1.15 }, aggr: 0.55, laws: ['kofuku'] },

  const w = month <= 3 ? { clear: 5, cloud: 3, rain: 2, fog: 2, wind: 1, snow: month <= 2 ? 1 : 0 }
    : month <= 6 ? { clear: 5, cloud: 2, rain: 3, fog: 1, wind: 1 }
    : month <= 9 ? { clear: 6, cloud: 3, rain: 1.5, fog: 1, wind: 2 }
    : { clear: 4, cloud: 3, snow: north ? 4 : 1.5, wind: 2, fog: 1 };
  if (theme === 'marsh' || theme === 'river') { w.fog = (w.fog || 0) + 2; w.rain = (w.rain || 0) + 1; }
  if (theme === 'steppe') w.wind = (w.wind || 0) + 2;
  if (theme === 'mount' || theme === 'pass') w.fog = (w.fog || 0) + 1;
  return U.wpick(Object.keys(w), k => w[k]);
};

D.traitDesc = (id) => {
  const T = D.TRAITS[id]; if (!T) return '';
  if (T._d) return T._d;
  const parts = [];
  for (const k in T.fx) parts.push(D.fxText(k, T.fx[k]));
  if (T.sk && D.SKILLS[T.sk]) parts.push(`戦法「${D.SKILLS[T.sk].n}」`);
  T._d = parts.filter(Boolean).join('・') + (T.side ? '（総大将なら全軍に効く）' : '');
  return T._d;
};

GEO.water = (x, y) => { const cx = Math.floor(x), cy = Math.floor(y); if (cx < 0 || cy < 0 || cx >= GEO.WW || cy >= GEO.WH) return 1; return GEO.Wt[cy * GEO.WW + cx]; };
GEO.moist = (x, y) => GEO.sample(GEO.M, x, y);
GEO.wdist = (x, y) => GEO.sample(GEO.waterDist, x, y);
GEO.sdist = (x, y) => GEO.sample(GEO.seaDist, x, y);
// 森の濃さ（地図の色と合戦の舞台で同じ式を使う）
GEO.fnoise = (x, y) => (GEO.vn(x / 11, y / 11) + 0.5 * GEO.vn(x / 5.5 + 17.3, y / 5.5 + 5.1) + 0.25 * GEO.vn(x / 2.75 + 3.7, y / 2.75 + 11.9)) / 1.75;
GEO.forestOf = (m, e, fn, st, lo, sd) => {
  let f = U.clamp((m - 0.32) * 1.6 + (e - 0.3) * 0.9 + (fn - 0.5) * 0.9, 0, 1);
  if (e > 0.8) f *= Math.max(0, 1 - (e - 0.8) * 4);
  f *= 1 - st * 0.75; f *= 1 - lo * 0.55; f *= 1 - sd;
  return f;
};
GEO.farmOf = (e, pop, f, sd, st) => U.clamp((0.42 - e) * 3 * (0.35 + pop) - f * 0.6 - sd, 0, 1) * (1 - st * 0.7);
// 地表（森・田・砂・草原・雪）
GEO.cover = (x, y, e) => {
  if (e == null) e = GEO.elev(x, y);
  const m = GEO.sample(GEO.M, x, y);
  const st = GEO.sample(GEO.STEP, x, y) / 255, lo = GEO.sample(GEO.LOES, x, y) / 255, sand = GEO.sample(GEO.SAND, x, y) / 255;
  const forest = GEO.forestOf(m, e, GEO.fnoise(x, y), st, lo, sand);
  const pop = GEO.popField ? GEO.sample(GEO.popField, x, y) : 0.3;
  const farm = GEO.farmOf(e, pop, forest, sand, st);
  const snow = U.clamp((e - 0.78) * 5, 0, 1);
  return { forest, farm, sand, steppe: st > 0.5 ? 1 : 0, loess: lo > 0.5 ? 1 : 0, snow, moist: m, marsh: GEO.sample(GEO.MARSHR, x, y) / 255 };
};
GEO.marshAt = (x, y) => GEO.MARSHR ? GEO.sample(GEO.MARSHR, x, y) / 255 : 0;

/* 郡域：多始点の最短路で地形に沿った境界をつくる。-1 は無主の地、-2 は水 */
GEO.RW = 250; GEO.RH = 180; GEO.RCELL = 4;
GEO.buildRegions = () => {
  const RW = GEO.RW, RH = GEO.RH, RC = GEO.RCELL, N = RW * RH;
  const reg = new Int16Array(N).fill(-1);
  const cost = new Float64Array(N).fill(1e9);
  const land = new Uint8Array(N), stepC = new Float32Array(N);
  const OFF = [[0, 0], [-1.6, -1.6], [1.6, -1.6], [-1.6, 1.6], [1.6, 1.6]];
  for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) {
    const x = (c + 0.5) * RC, y = (r + 0.5) * RC, i = r * RW + c;
    let ld = 0;
    for (const [ox, oy] of OFF) { const w = GEO.water(x + ox, y + oy); if (w !== 1 && w !== 2) { ld = 1; break; } }
    land[i] = ld; if (!ld) reg[i] = -2;
    const w = GEO.water(x, y);
    const e = GEO.elev(x, y);
    stepC[i] = 1 + Math.max(0, e - 0.42) * 14 + (w === 3 ? 3 : 0);
  }
  const H = new GEO.Heap(N * 2);
  D.PROVINCES.forEach((p, pi) => {
    const c = U.clamp(Math.floor(p.x / RC), 0, RW - 1), r = U.clamp(Math.floor(p.y / RC), 0, RH - 1), i = r * RW + c;
    const c0 = p.pass ? 9 : -Math.sqrt(p.pop) * 1.4;
    if (c0 < cost[i]) { cost[i] = c0; reg[i] = pi; land[i] = 1; H.push(c0, i); }
  });
  const LIM = 34;
  while (H.n) {
    const i = H.pop(), cc = H.topP;
    if (cc > cost[i]) continue;
    const c = i % RW, r = (i - c) / RW;
    const lim = LIM + (D.PROVINCES[reg[i]].pass ? -8 : 0);
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= RW || nr >= RH) continue;
      const j = nr * RW + nc; if (!land[j]) continue;
      const nc2 = cc + stepC[j] * (dr && dc ? 1.414 : 1);
      if (nc2 < cost[j] && nc2 < lim) { cost[j] = nc2; reg[j] = reg[i]; H.push(nc2, j); }
    }
  }
  GEO.reg = reg;
  // 人口の濃さ（田畑の多さに使う）
  const pf = new Float32Array(GEO.EW * GEO.EH);
  for (let r = 0; r < GEO.EH; r++) for (let c = 0; c < GEO.EW; c++) {
    const x = (c + 0.5) * GEO.EC, y = (r + 0.5) * GEO.EC;
    const ri = Math.min(RH - 1, Math.floor(y / RC)) * RW + Math.min(RW - 1, Math.floor(x / RC));
    const p = reg[ri] >= 0 ? D.PROVINCES[reg[ri]] : null;
    pf[r * GEO.EW + c] = p ? U.clamp(p.pop / 60, 0.1, 1.4) * Math.max(0.25, 1 - cost[ri] / 40) : 0.05;
  }
  GEO.blur(pf, GEO.EW, GEO.EH, 3, 2);
  GEO.popField = pf;
  // 境界線：郡と郡の間の辺をつなぎ、なめらかにする（端点は動かさない）
  const NP = D.PROVINCES.length;
  const segs = new Map();
  const addSeg = (a, b, x0, y0, x1, y1) => { const k = a < b ? (a + 2) * 1000 + (b + 2) : (b + 2) * 1000 + (a + 2); let l = segs.get(k); if (!l) segs.set(k, l = []); l.push(x0, y0, x1, y1); };
  for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) {
    const i = r * RW + c, a = reg[i];
    if (c + 1 < RW) { const b = reg[i + 1]; if (a !== b) addSeg(a, b, (c + 1) * RC, r * RC, (c + 1) * RC, (r + 1) * RC); }
    if (r + 1 < RH) { const b = reg[i + RW]; if (a !== b) addSeg(a, b, c * RC, (r + 1) * RC, (c + 1) * RC, (r + 1) * RC); }
    if (a >= 0) {
      if (c === 0) addSeg(a, -2, 0, r * RC, 0, (r + 1) * RC);
      if (c === RW - 1) addSeg(a, -2, RW * RC, r * RC, RW * RC, (r + 1) * RC);
      if (r === 0) addSeg(a, -2, c * RC, 0, (c + 1) * RC, 0);
      if (r === RH - 1) addSeg(a, -2, c * RC, RH * RC, (c + 1) * RC, RH * RC);
    }
  }
  GEO.borders = [];
  const ek = (x, y) => Math.round(x) * 4096 + Math.round(y);
  for (const [k, L] of segs) {
    const a = Math.floor(k / 1000) - 2, b = k % 1000 - 2;
    if (a < 0 && b < 0) continue;
    const ns = L.length / 4;
    const byEnd = new Map();
    for (let s = 0; s < ns; s++) for (const e of [ek(L[4 * s], L[4 * s + 1]), ek(L[4 * s + 2], L[4 * s + 3])]) { let q = byEnd.get(e); if (!q) byEnd.set(e, q = []); q.push(s); }
    const used = new Uint8Array(ns);
    for (let s0 = 0; s0 < ns; s0++) {
      if (used[s0]) continue;
      used[s0] = 1;
      const pts = [[L[4 * s0], L[4 * s0 + 1]], [L[4 * s0 + 2], L[4 * s0 + 3]]];
      for (const dir of [1, 0]) {
        for (let g = 0; g < 8000; g++) {
          const end = dir ? pts[pts.length - 1] : pts[0];
          const ke = ek(end[0], end[1]);
          const cand = (byEnd.get(ke) || []).find(j => !used[j]);
          if (cand == null) break;
          used[cand] = 1;
          const nxt = ek(L[4 * cand], L[4 * cand + 1]) === ke ? [L[4 * cand + 2], L[4 * cand + 3]] : [L[4 * cand], L[4 * cand + 1]];
          if (dir) pts.push(nxt); else pts.unshift(nxt);
        }
      }
      if (pts.length < 2) continue;
      GEO.borders.push({ a, b, pts: GEO.flat(GEO.smoothChain(pts)) });
    }
  }
  // 郡ごとの輪郭（境界線をつないだ輪。偶奇規則で塗る）
  GEO.provRings = [];
  const byProv = Array.from({ length: NP }, () => []);
  GEO.borders.forEach((bd, bi) => { if (bd.a >= 0) byProv[bd.a].push(bi); if (bd.b >= 0) byProv[bd.b].push(bi); });
  for (let p = 0; p < NP; p++) {
    const list = byProv[p], ends = new Map(), used = new Set();
    const k2 = (x, y) => Math.round(x * 4) * 65536 + Math.round(y * 4);
    for (const bi of list) { const a = GEO.borders[bi].pts, n = a.length; for (const e of [k2(a[0], a[1]), k2(a[n - 2], a[n - 1])]) { let q = ends.get(e); if (!q) ends.set(e, q = []); q.push(bi); } }
    const rings = [];
    for (const b0 of list) {
      if (used.has(b0)) continue;
      used.add(b0);
      const ring = Array.from(GEO.borders[b0].pts);
      const start = k2(ring[0], ring[1]);
      let cur = k2(ring[ring.length - 2], ring[ring.length - 1]);
      for (let g = 0; g < 4000 && cur !== start; g++) {
        const nb = (ends.get(cur) || []).find(j => !used.has(j));
        if (nb == null) break;
        used.add(nb);
        const a = GEO.borders[nb].pts, n = a.length;
        if (k2(a[0], a[1]) === cur) { for (let i = 2; i < n; i++) ring.push(a[i]); cur = k2(a[n - 2], a[n - 1]); }
        else { for (let i = n - 4; i >= 0; i -= 2) ring.push(a[i], a[i + 1]); cur = k2(a[0], a[1]); }
      }
      rings.push(new Float32Array(ring));
    }
    GEO.provRings.push(rings);
  }
};
// 階段状の線をなめらかに（両端は動かさない）
GEO.smoothChain = (pts) => {
  if (pts.length < 3) return pts;
  let p = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) p.push([(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]);
  p.push(pts[pts.length - 1]);
  for (let it = 0; it < 6; it++) {
    const q = [p[0]];
    for (let i = 1; i < p.length - 1; i++) q.push([(p[i - 1][0] + 2 * p[i][0] + p[i + 1][0]) / 4, (p[i - 1][1] + 2 * p[i][1] + p[i + 1][1]) / 4]);
    q.push(p[p.length - 1]); p = q;
  }
  return GEO.chaikin(p, 1);
};
GEO.regionAt = (x, y) => { const c = Math.floor(x / GEO.RCELL), r = Math.floor(y / GEO.RCELL); if (c < 0 || r < 0 || c >= GEO.RW || r >= GEO.RH) return -2; return GEO.reg[r * GEO.RW + c]; };

/* 県と郷 */
GEO.buildCounties = () => {
  const rnd = U.rng(77001);
  GEO.counties = []; GEO.byProv = {};
  const RW = GEO.RW, RC = GEO.RCELL;
  const cells = {};
  for (let i = 0; i < GEO.reg.length; i++) { const p = GEO.reg[i]; if (p >= 0) (cells[p] = cells[p] || []).push(i); }
  const vname = () => GEO.VCHARS1[Math.floor(rnd() * GEO.VCHARS1.length)] + GEO.VCHARS2[Math.floor(rnd() * GEO.VCHARS2.length)] + GEO.VILLAGE_SUFFIX[Math.floor(rnd() * GEO.VILLAGE_SUFFIX.length)];
  D.PROVINCES.forEach((P, pi) => {
    const names = GEO.COUNTY_NAMES[P.id] || [P.name];
    const want = P.pass ? Math.min(names.length, 2) : Math.min(names.length, 3 + Math.floor(P.pop / 14));
    const list = [{ x: P.x, y: P.y }];
    const cand = (cells[pi] || []).map(i => { const c = i % RW, r = (i - c) / RW; const x = (c + 0.2 + rnd() * 0.6) * RC, y = (r + 0.2 + rnd() * 0.6) * RC; return { x, y }; })
      .filter(q => { const w = GEO.water(q.x, q.y); return w === 0 && GEO.elev(q.x, q.y) < 0.62; })
      .map(q => { const e = GEO.elev(q.x, q.y); const wd = GEO.wdist(q.x, q.y); q.s = (0.62 - e) * 2 + Math.max(0, 1 - wd / 10) * 0.8 + rnd() * 0.6; return q; })
      .sort((a, b) => b.s - a.s);
    const area = (cells[pi] || []).length * RC * RC;
    const dmin = U.clamp(Math.sqrt(area / Math.max(1, want)) * 0.62, 7, 40);
    for (const q of cand) {
      if (list.length >= want) break;
      if (list.every(o => Math.hypot(o.x - q.x, o.y - q.y) > dmin)) list.push(q);
    }
    GEO.byProv[P.id] = [];
    list.forEach((q, k) => {
      const ct = { id: P.id + '_' + k, pid: P.id, pi, k, n: names[k] || (names[0] + k), x: q.x, y: q.y, seat: k === 0 ? 1 : 0, pass: P.pass && k === 0 ? 1 : 0, vil: [] };
      // 郷
      const nv = P.pass ? 1 : 5 + Math.floor(rnd() * 7) + (k === 0 ? 4 : 0);
      for (let v = 0; v < nv; v++) {
        for (let tries = 0; tries < 14; tries++) {
          const a = rnd() * Math.PI * 2, d = 2.5 + rnd() * (k === 0 ? 13 : 10);
          const vx = q.x + Math.cos(a) * d, vy = q.y + Math.sin(a) * d;
          if (GEO.water(vx, vy) || GEO.elev(vx, vy) > 0.6 || GEO.regionAt(vx, vy) !== pi) continue;
          if (ct.vil.some(o => Math.hypot(o.x - vx, o.y - vy) < 1.8)) continue;
          ct.vil.push({ x: vx, y: vy, n: vname(), s: 0.6 + rnd() * 0.8 });
          break;
        }
      }
      GEO.counties.push(ct); GEO.byProv[P.id].push(ct);
    });
  });
};
GEO.county = (id) => { if (!id) return null; const j = id.lastIndexOf('_'); return (GEO.byProv[id.slice(0, j)] || [])[+id.slice(j + 1)] || null; };

/* 道（谷沿いに県と県を結ぶ）と、郷から県への小道 */
GEO.buildRoads = () => {
  const RW = GEO.RW, RH = GEO.RH, RC = GEO.RCELL, N = RW * RH;
  const cost = new Float32Array(N);
  for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) {
    const x = (c + 0.5) * RC, y = (r + 0.5) * RC, i = r * RW + c;
    const w = GEO.water(x, y);
    if (w === 1 || w === 2) { cost[i] = 0; continue; }
    const e = GEO.elev(x, y);
    const e2 = GEO.elev(x + RC, y), e3 = GEO.elev(x, y + RC);
    cost[i] = 1 + Math.max(0, e - 0.35) * 9 + Math.hypot(e2 - e, e3 - e) * 60 + (w === 3 ? 6 : 0);
  }
  const g = new Float32Array(N), came = new Int32Array(N), stamp = new Int32Array(N);
  let gen = 0;
  const heap = new GEO.Heap(N * 2);
  const astar = (sx, sy, tx, ty) => {
    const s = U.clamp(Math.floor(sy / RC), 0, RH - 1) * RW + U.clamp(Math.floor(sx / RC), 0, RW - 1);
    const t = U.clamp(Math.floor(ty / RC), 0, RH - 1) * RW + U.clamp(Math.floor(tx / RC), 0, RW - 1);
    gen += 2; heap.n = 0;
    // stamp: gen=開いた, gen+1=閉じた
    const tc = t % RW, tr = (t - tc) / RW;
    const hh = (i) => { const c = i % RW, r = (i - c) / RW, dx = c - tc, dy = r - tr; return Math.sqrt(dx * dx + dy * dy); };
    g[s] = 0; came[s] = -1; stamp[s] = gen; heap.push(hh(s), s);
    let it = 0, found = s === t;
    while (heap.n && it++ < 30000) {
      const i = heap.pop();
      if (stamp[i] === gen + 1) continue; stamp[i] = gen + 1;
      if (i === t) { found = true; break; }
      const c = i % RW, r = (i - c) / RW;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= RW || nr >= RH) continue;
        const j = nr * RW + nc; if (!cost[j] || stamp[j] === gen + 1) continue;
        const ng = g[i] + cost[j] * (dr && dc ? 1.414 : 1);
        if (stamp[j] !== gen || ng < g[j]) { stamp[j] = gen; g[j] = ng; came[j] = i; heap.push(ng + hh(j) * 1.3, j); }
      }
    }
    if (!found) return null;
    const path = []; let c = t, guard = 0;
    while (c >= 0 && guard++ < N) { const cc = c % RW, rr = (c - cc) / RW; path.push([(cc + 0.5) * RC, (rr + 0.5) * RC]); if (c === s) break; c = came[c]; }
    path.reverse();
    path[0] = [sx, sy]; path[path.length - 1] = [tx, ty];
    return path;
  };
  GEO.roads = [];
  const addRoad = (a, b, major) => {
    const p = astar(a.x, a.y, b.x, b.y);
    if (!p || p.length < 2) return;
    let q = GEO.chaikin(p, 2);
    q = GEO.subdivide(q, 1.2); q = GEO.meander(q, 0.35, 0.3, 6000 + GEO.roads.length);
    GEO.roads.push({ major: major ? 1 : 0, pts: GEO.flat(q) });
  };
  const PI = {}; D.PROVINCES.forEach(p => { PI[p.id] = p; });
  // 郡と郡（隣接）
  for (const [a, b] of D.EDGES) addRoad(PI[a], PI[b], true);
  // 郡の中：郡治から各県へ（最小全域木）
  for (const pid in GEO.byProv) {
    const cs = GEO.byProv[pid];
    if (cs.length < 2) continue;
    const inT = [0], rest = cs.map((_, i) => i).slice(1);
    while (rest.length) {
      let best = null, bd = Infinity;
      for (const i of inT) for (const j of rest) { const d = Math.hypot(cs[i].x - cs[j].x, cs[i].y - cs[j].y); if (d < bd) { bd = d; best = [i, j]; } }
      addRoad(cs[best[0]], cs[best[1]], false);
      inT.push(best[1]); rest.splice(rest.indexOf(best[1]), 1);
    }
  }
  // 郷から県へ（あぜ道）
  GEO.paths = [];
  let seed = 0;
  for (const ct of GEO.counties) for (const v of ct.vil) {
    const dx = ct.x - v.x, dy = ct.y - v.y, l = Math.hypot(dx, dy);
    if (l < 1.5 || l > 18) continue;
    const bend = (GEO.hash(Math.round(v.x * 10), Math.round(v.y * 10), 31) - 0.5) * 0.35 * l;
    const mx = (v.x + ct.x) / 2 - dy / l * bend, my = (v.y + ct.y) / 2 + dx / l * bend;
    let p = GEO.smooth([[v.x, v.y], [mx, my], [ct.x, ct.y]], 5);
    p = GEO.subdivide(p, 0.8); p = GEO.meander(p, 0.45, 0.4, 7000 + (seed++ % 97));
    GEO.paths.push(GEO.flat(p));
  }
};

/* 小川：窪地を埋めてから水の流れを集め、集水の多い所を川筋にする */
GEO.buildStreams = () => {
  const EW = GEO.EW, EH = GEO.EH, EC = GEO.EC, N = EW * EH, E = GEO.E, wE = GEO.wE;
  const dir = new Int32Array(N).fill(-1), seen = new Uint8Array(N), order = new Int32Array(N);
  const fill = new Float32Array(N);
  const H = new GEO.Heap(N);
  for (let r = 0; r < EH; r++) for (let c = 0; c < EW; c++) {
    const i = r * EW + c;
    if (wE[i] || r === 0 || c === 0 || r === EH - 1 || c === EW - 1) { seen[i] = 1; fill[i] = E[i]; H.push(E[i], i); }
  }
  let on = 0;
  while (H.n) {
    const i = H.pop(); order[on++] = i;
    const c = i % EW, r = (i - c) / EW, fi = fill[i];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= EW || nr >= EH) continue;
      const j = nr * EW + nc; if (seen[j]) continue;
      seen[j] = 1; dir[j] = i; const fj = E[j] > fi + 1e-5 ? E[j] : fi + 1e-5; fill[j] = fj; H.push(fj, j);
    }
  }
  // 集水量（雨の多い所ほど多い）
  const acc = new Float32Array(N);
  for (let i = 0; i < N; i++) acc[i] = 0.35 + GEO.M[i] * 1.3 - GEO.SAND[i] / 255 * 0.3;
  for (let k = on - 1; k >= 0; k--) { const i = order[k]; if (dir[i] >= 0 && !wE[i]) acc[dir[i]] += acc[i]; }
  const thr = (i) => (GEO.loess[i] ? 9 : 20) * (GEO.steppe[i] ? 2.2 : 1);
  const isS = new Uint8Array(N), up = new Uint8Array(N);
  for (let i = 0; i < N; i++) if (!wE[i] && acc[i] >= thr(i)) isS[i] = 1;
  for (let k = on - 1; k >= 0; k--) { const i = order[k]; if (isS[i] && dir[i] >= 0 && !wE[dir[i]]) isS[dir[i]] = 1; }
  for (let i = 0; i < N; i++) if (isS[i] && dir[i] >= 0 && isS[dir[i]]) up[dir[i]]++;
  // 揺らした点（同じ格子は同じ点になるので、つなぎ目がずれない）

/* ---------- 合戦の舞台（全体マップの地形から） ---------- */
// pid の郡のどこか（県の近く、または国境寄り）で戦う。地形の特徴を返す
GEO.site = (pid, opt = {}) => {
  if (!GEO.built) GEO.build();
  const P = D.PROVINCES.find(p => p.id === pid);
  if (!P) return null;
  const cs = GEO.byProv[pid] || [];

  const rnd = opt.rng || Math.random;

    if (F) { const t = 0.35 + rnd() * 0.25; x = P.x + (F.x - P.x) * t; y = P.y + (F.y - P.y) * t; town = U.minBy(cs, c => Math.hypot(c.x - x, c.y - y)); }

// 舞台から地勢の名を決める
GEO.siteTheme = (s) => {
  if (!s) return 'plain';

  if (s.marsh > 0.3) return 'marsh';

  if (s.steppe > 0.5 || s.sand > 0.3) return 'steppe';
  if (s.forest > 0.45) return 'forest';
  if (s.elev > 0.4 || s.rough > 0.07) return 'hill';

(function initStatic() {
  for (const p of D.PROVINCES) { S.P[p.id] = p; S.ADJ[p.id] = []; }
  for (const [a, b] of D.EDGES) { S.ADJ[a].push(b); S.ADJ[b].push(a); }
})();

/* ---------- accessors ---------- */
S.me = () => G.me;
S.off = id => G.off[id];
S.myOff = () => G.off[G.me.oid];
S.cty = id => G.cty[id];
S.myCty = () => G.cty[G.off[G.me.oid].c];
S.prov = id => G.prov[id];
S.rank = () => D.RANKS[G.me.rank];
S.tier = () => D.RANKS[G.me.rank].tier;
S.adj = pid => S.ADJ[pid] || [];
S.cname = c => (D.COUNTRIES[c] || (c === 'bandit' ? D.BANDIT : D.NOMAD)).name;
S.ccolor = c => (D.COUNTRIES[c] || (c === 'bandit' ? D.BANDIT : D.NOMAD)).color;
S.dateStr = (y = G.year, m = G.month) => `前${-y}年 ${m}月`;
S.isTop = () => ['kuns', 'josh'].includes(G.me.rank);
S.isMil = () => D.RANKS[G.me.rank].track === 'mil';
S.isCiv = () => D.RANKS[G.me.rank].track === 'civ';

S.dipKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
S.dip = (a, b) => {
  const k = S.dipKey(a, b);
  if (!G.dip[k]) G.dip[k] = { rel: 0, st: 'peace', t: 0 };
  return G.dip[k];
};
S.atWar = (a, b) => a !== b && S.dip(a, b).st === 'war';
S.allied = (a, b) => a === b || S.dip(a, b).st === 'ally';
S.ownedProvs = c => Object.values(G.prov).filter(p => p.o === c);
S.countryTroops = c => U.sum(S.ownedProvs(c), p => p.troops);
S.countryPop = c => U.sum(S.ownedProvs(c), p => p.pop);
S.countryPower = c => {
  const ps = S.ownedProvs(c); if (!ps.length) return 0;
  const tr = U.sum(ps, p => p.troops);
  const gens = Object.values(G.off).filter(o => o.c === c && o.alive && !o.ret && ['dais', 'shog'].includes(o.r));
  const gq = gens.length ? U.avg(gens.slice(0, 6), o => o.tou) : 50;
  return tr * (0.6 + gq / 200);
};
S.border = (c, other) => S.ownedProvs(c).filter(p => S.adj(p.id).some(q => G.prov[q].o === (other || G.prov[q].o) && G.prov[q].o !== c));
S.enemyNeighbors = (pid) => S.adj(pid).filter(q => G.prov[q].o !== G.prov[pid].o && S.atWar(G.prov[q].o, G.prov[pid].o));

/* 実効ステータス（特性・名品・負傷） */
S.STATK = ['bu', 'tou', 'chi', 'pol', 'mi'];
S.stat = (o, k) => {
  let v = o[k] || 0;
  if (o.tr) for (const t of o.tr) { const tr = D.TRAITS[t]; if (tr && tr.fx[k]) v += tr.fx[k]; }
  if (o.id === G?.me?.oid) {
    for (const slot in G.me.eq) { const it = D.ITEMS[G.me.eq[slot]]; if (it && it.eff && it.eff[k]) v += it.eff[k]; if (it && it.fx && it.fx[k]) v += it.fx[k]; }
    if (G.me.inj > 0 && (k === 'bu' || k === 'tou')) v -= 8;
    if (G.me.spouseBonus && G.me.spouseBonus[k]) v += G.me.spouseBonus[k];
  }
  return U.clamp(Math.round(v), 1, 150);
};
/* 特性の効果（効果キーの合計） */
S.fx = (o, k) => {
  if (!o) return 0;
  let v = 0;
  if (o.tr) for (const t of o.tr) { const T = D.TRAITS[t]; if (T && T.fx[k]) v += T.fx[k]; }
  if (o.xfx) { if (o.xfx[k]) v += o.xfx[k]; }
  else if (typeof G !== 'undefined' && G && G.me && o.id === G.me.oid) { const ix = S.itemFx(); if (ix[k]) v += ix[k]; }
  return v;
};
S.fxm = (o, k) => 1 + S.fx(o, k);
S.myFx = (k) => S.fx(S.myOff(), k);
// 装備の効果を効果キーに
S.itemFx = () => {
  const out = {};
  if (!G || !G.me) return out;
  for (const slot in G.me.eq) {
    const it = D.ITEMS[G.me.eq[slot]]; if (!it) continue;
    const e = it.eff || {};
    if (e.hp) out.duel_hp = (out.duel_hp || 0) + e.hp;
    if (e.duel) out.duel = (out.duel || 0) + (e.duel - 1);
    if (it.fx) for (const k in it.fx) if (!S.STATK.includes(k)) out[k] = (out[k] || 0) + it.fx[k];
  }
  return out;
};
S.traitSkills = (o) => { const out = []; for (const t of (o && o.tr) || []) { const sk = D.TRAITS[t]?.sk; if (sk && !out.includes(sk)) out.push(sk); } return out; };
S.hasTrait = (o, t) => !!(o && o.tr && o.tr.includes(t));
S.lawOn = (c, l) => (G.cty[c]?.laws || []).includes(l);
S.lawMul = (c, key) => {
  const cc = G.cty[c]; if (!cc) return 1;
  let v = 1;
  for (const l of cc.laws) { const e = D.LAWS[l]?.eff; if (e && e[key] != null) v *= e[key]; }
  return v;
};
S.lawAdd = (c, key) => { let v = 0; const cc = G.cty[c]; if (!cc) return 0; for (const l of cc.laws) { const e = D.LAWS[l]?.eff; if (e && e[key] != null) v += e[key]; } return v; };

/* ---------- logging ---------- */
S.log = (s, k = 'info') => { G.log.unshift({ t: G.turn, d: S.dateStr(), s, k }); if (G.log.length > 160) G.log.length = 160; };
S.chron = (s) => { G.hist.unshift({ d: S.dateStr(), s }); if (G.hist.length > 120) G.hist.length = 120; };

/* ---------- officers ---------- */
S.genName = (sur) => {
  const sei = sur || U.pick(D.SURN);
  const mei = U.ch(0.12) ? U.pick(D.GIVN2) + U.pick(D.GIVN) : U.pick(D.GIVN);
  return { sei, mei, n: sei + mei };
};
S.newId = () => 'o' + (G.nid++);
/* 特性の抽選 */
S._tpool = {};
S.traitPool = (role) => {
  if (S._tpool[role]) return S._tpool[role];
  const ok = (T) => {
    if (T.uniq) return false;
    if (T.role === 'any') return true;
    if (role === 'top') return T.role === 'top' || T.role === 'civ';
    if (role === 'staff') return T.role === 'mil' || T.cat === 'pol' || T.cat === 'school';
    return T.role === role;
  };
  return (S._tpool[role] = D.TRAIT_ORDER.filter(id => ok(D.TRAITS[id])));
};
S.traitFam = id => id.replace(/\d+$/, '');
S.genTraits = (role, tier, n, have = []) => {
  const pool = S.traitPool(role);
  const out = have.slice();
  const fams = new Set(out.map(S.traitFam));
  let guard = 0;
  while (out.length < have.length + n && guard++ < 80) {
    const t = U.wpick(pool, id => {
      const T = D.TRAITS[id];
      let w = T.w != null ? T.w * 10 : (T.lv === 1 ? 10 : T.lv === 2 ? 4 : 1.1);
      if (T.lv === 3) w *= 0.5 + tier * 0.1;
      if (T.neg) w *= 0.55;
      if (T.cat === 'pers' || T.cat === 'orig') w *= 0.5;
      if (T.cat === 'king' && role !== 'top') w = 0;
      return w;
    });
    if (!t || out.includes(t) || fams.has(S.traitFam(t))) continue;
    const cat = D.TRAITS[t].cat;
    if ((cat === 'pers' || cat === 'orig' || cat === 'school') && out.some(x => D.TRAITS[x]?.cat === cat)) continue;
    out.push(t); fams.add(S.traitFam(t));
  }
  return out;
};
/* 戦術の抽選（武将・軍師は戦術を知っている） */
S.genTactics = (o, n) => {
  const pool = D.TACTIC_ORDER.filter(t => D.tacticReqOk(t, o));
  if (n == null) n = U.clamp(Math.floor((o.chi - 22) / 13) + (o.st === 'chi' ? 1 : 0) + (D.RANKS[o.r]?.tier >= 7 ? 1 : 0), 0, 9);
  const out = [];
  for (const t of U.shuffle(pool.slice())) { if (out.length >= n) break; const T = D.TACTICS[t]; if ((T.cat === 'siegeA' || T.cat === 'siegeD') && out.filter(x => D.TACTICS[x].cat === T.cat).length >= 2) continue; out.push(t); }
  return out;
};
S.roleOf = (r) => { const rk = D.RANKS[r]; if (!rk) return 'mil'; if (rk.track === 'top') return 'top'; if (r === 'gunshi') return 'staff'; return rk.track; };
// 官職ティアに応じた能力の目安
S.genOfficer = (c, r, opt = {}) => {
  const rk = D.RANKS[r] || D.RANKS.hyak;
  const tier = rk.tier;
  const civ = rk.track === 'civ';
  const base = 34 + tier * 4.5;
  const roll = () => U.clamp(Math.round(base + U.rf(-16, 18)), 15, 92);
  const nm = S.genName(opt.sur);
  const o = {
    id: S.newId(), n: nm.n, sei: nm.sei, mei: nm.mei, c, r,
    bu: roll(), tou: roll(), chi: roll(), pol: roll(), mi: roll(),
    tr: [], tac: [], st: U.pick(['ins', 'chi', 'bal', 'bal']), age: U.ri(22, 48), alive: true,
    loy: U.ri(60, 90), bond: 0, merit: D.MERIT_TIER[tier] || 0, jue: Math.min(19, Math.max(1, tier + 1)),
    loc: opt.loc || G.cty[c]?.cap || null, gen: true,
  };
  if (civ) { o.pol = U.clamp(o.pol + 12, 1, 95); o.bu = U.clamp(o.bu - 14, 5, 90); }
  else if (rk.track === 'mil') { o.bu = U.clamp(o.bu + 6, 1, 95); o.tou = U.clamp(o.tou + 6, 1, 95); o.pol = U.clamp(o.pol - 10, 5, 90); }
  if (opt.stats) Object.assign(o, opt.stats);
  const nTr = U.clamp(U.ri(1, 2) + (tier >= 4 ? 1 : 0) + (tier >= 7 && U.ch(0.5) ? 1 : 0), 1, 4);
  o.tr = S.genTraits(S.roleOf(r), tier, nTr);
  if (rk.track !== 'civ' || o.chi >= 60) o.tac = S.genTactics(o);
  G.off[o.id] = o;
  return o;
};
S.officersOf = (c, filt) => Object.values(G.off).filter(o => o.c === c && o.alive && !o.ret && (!filt || filt(o)));
S.bestGeneral = (c, exclude = []) => {
  const gs = S.officersOf(c, o => ['dais', 'shog', 'goz', 'gunshi'].includes(o.r) && !exclude.includes(o.id) && o.id !== G.me.oid);
  return U.maxBy(gs, o => o.tou * 1.2 + o.bu * 0.4 + o.chi * 0.6 + (o.r === 'dais' ? 25 : o.r === 'shog' ? 12 : 0));
};

/* ---------- player helpers ---------- */
S.armyTotal = (inclPv = true) => U.sum(G.me.army.sq.filter(s => inclPv || !s.pv), s => s.n);
S.armyCap = () => D.RANKS[G.me.rank].troops;
S.pvCap = () => { const L = G.me.land; return Math.round((L.fac.barracks || 0) * 60 + L.hh * 0.05 + (L.ha >= 20 ? 20 : 0)); };
S.avgTraining = () => { const sq = G.me.army.sq; const n = U.sum(sq, s => s.n); return n ? U.sum(sq, s => s.tr * s.n) / n : 0; };
S.squadName = s => {
  const ut = D.UT[s.t];
  const ld = s.ld && G.off[s.ld] ? G.off[s.ld].n + '隊' : (s.pv ? '私兵' : '直属');
  return `${ut.n}（${ld}）`;
};
// 初期の兵糧（立場が上がるほど多い）
S.startFood = (tier) => 1000 + 1000 * tier * tier;

/* ---------- 軍の割り振り（任務状は使わない） ---------- */
// 合戦での任せ方：self は主人公が自分で動かす。ほかは開戦と同時に隊長が判断して動かす
S.ORDER_MODES = { self: '自ら指揮', attack: '攻勢', defend: '守勢', flank: '遊撃', follow: '追従' };
S.ORDER_DESC = { self: '主人公が自分で動かす', attack: '敵を求めて攻める', defend: '持ち場を守る', flank: '敵の側背を突く（騎兵向き）', follow: '主人公の隊を守ってついて来る' };
// 任せられる将か（統率60以上か知力65以上なら自ら判断して戦う）
S.canLead = (x) => !!x && (S.stat(x, 'tou') >= 60 || S.stat(x, 'chi') >= 65);
// 空の私兵の隊を消し、いなくなった部下の隊を直属に戻す
S.tidyArmy = () => {
  const A = G.me.army;
  A.subs = (A.subs || []).filter(id => G.off[id] && G.off[id].alive);
  for (const s of A.sq) {
    if (s.pv) s.max = s.n;
    if (s.ld && !A.subs.includes(s.ld)) s.ld = null;
  }
  A.sq = A.sq.filter(s => s.n > 0 || (!s.pv && s.max > 0));
  if (A.dep && !A.subs.includes(A.dep)) A.dep = null;
  if (A.orders) for (const id of Object.keys(A.orders)) if (!A.subs.includes(id)) delete A.orders[id];
};
// 隊 b を隊 a にまとめる（練度・装備は人数で平均）
S.mergeInto = (a, b, n = b.n, share = b.max) => {
  const tot = a.n + n;
  if (tot > 0) {
    a.tr = Math.round((a.tr * a.n + b.tr * n) / tot);
    a.wl = Math.round((a.wl * a.n + b.wl * n) / tot);
    a.al = Math.round((a.al * a.n + b.al * n) / tot);
    a.xp = Math.round(((a.xp || 0) * a.n + (b.xp || 0) * n) / tot);
  }
  a.n = tot; a.max += share;
};
// 隊 sqId から n 人を ld（null は主人公の直属）へ移す。同じ兵種の隊があればまとめる
S.moveTroops = (sqId, n, ld) => {
  const A = G.me.army, s = A.sq.find(x => x.id === sqId);
  ld = ld || null;
  if (!s || (s.ld || null) === ld) return 0;
  if (ld && !A.subs.includes(ld)) return 0;
  n = Math.min(s.n, Math.max(0, Math.floor(n)));
  if (!n) return 0;
  const share = s.pv ? n : Math.min(s.max, Math.round(s.max * n / Math.max(1, s.n)));
  let t = A.sq.find(x => x !== s && x.t === s.t && !!x.pv === !!s.pv && (x.ld || null) === ld);
  if (!t) { t = S.newSquad(s.t, 0, { pv: s.pv, tr: s.tr, wl: s.wl, al: s.al, ld }); t.max = 0; t.xp = s.xp || 0; A.sq.push(t); }
  S.mergeInto(t, s, n, share);
  s.n -= n; s.max = Math.max(s.n, s.max - share);
  S.tidyArmy();
  return n;
};
// 同じ隊長・同じ兵種・国軍／私兵の別が同じ隊をまとめる
S.mergeSquads = () => {
  const A = G.me.army, seen = new Map(); let k = 0;
  for (const s of A.sq) {
    const key = [s.t, s.pv ? 1 : 0, s.ld || ''].join('|');
    const a = seen.get(key);
    if (!a) { seen.set(key, s); continue; }
    S.mergeInto(a, s); s.n = 0; s.max = 0; k++;
  }
  S.tidyArmy();
  return k;
};
// 私兵を解散する（領地へ帰農し、戸が少し増える）
S.disband = (sqId, n) => {
  const A = G.me.army, s = A.sq.find(x => x.id === sqId);
  if (!s || !s.pv) return 0;
  n = Math.min(s.n, Math.max(0, Math.floor(n)));
  if (!n) return 0;
  s.n -= n;
  G.me.land.hh += Math.round(n / 5);
  S.tidyArmy();
  return n;
};
S.setOrder = (ld, mode) => {
  const A = G.me.army;
  if (!ld || !A.subs.includes(ld)) return;
  A.orders = A.orders || {};
  if (!mode || mode === 'self') delete A.orders[ld]; else A.orders[ld] = mode;
};
S.juePromote = () => {
  const me = G.me; let up = false;
  while (me.jue < 20 && me.merit >= D.JUE[me.jue + 1].m) { me.jue++; up = true; }
  if (up) S.applyJueLand();
  return up;
};
S.applyJueLand = () => {
  const me = G.me, J = D.JUE[me.jue];
  me.land.ha = Math.max(me.land.ha, J.ha);
  me.land.hh = Math.max(me.land.hh, J.hh);
};

/* ---------- new game ---------- */
// 史実の人物を作る（late: 後から登場する時）
S.histOfficer = (h, late) => {
  const [n, c, role, bu, tou, chi, pol, mi, age, tr, st, death, special] = h;
  let [r, min] = role.split(':');
  const cc = G.cty[c];
  if (late && min && cc.mins[min] && G.off[cc.mins[min]]?.alive) min = null;
  if (late && (r === 'kuns' || r === 'josh')) r = 'daij';
  const o = { id: S.newId(), n, sei: n.slice(0, 1), mei: n.slice(1), c, r, min: min || null, bu, tou, chi, pol, mi, tr: [...tr], st, age: late ? age + (G.year + 245) : age, alive: true, loy: 85, bond: 0, merit: D.MERIT_TIER[D.RANKS[r].tier] || 0, jue: Math.min(20, D.RANKS[r].tier * 2), loc: W.capital ? (W.capital(c) || D.COUNTRIES[c].cap) : D.COUNTRIES[c].cap, hist: true, death };
  if (special === 'mount') o.mount = true;
  if (o.tr.length < 2) o.tr = S.genTraits(S.roleOf(r), D.RANKS[r].tier, 2 - o.tr.length, o.tr);
  o.tac = h[13] ? h[13].filter(t => D.TACTICS[t]) : S.genTactics(o);
  if (!o.tac.length) o.tac = S.genTactics(o);
  G.off[o.id] = o;
  if (r === 'kuns') cc.ruler = o.id; else if (r === 'josh') cc.josh = o.id; else if (r === 'gyos') cc.gyos = o.id; else if (r === 'daij' && min) cc.mins[min] = o.id;
  return o;
};
S.newGame = (cfg) => {
  G = {
    v: 5, mode: cfg.mode || 'normal', custom: cfg.custom || null, year: D.START_YEAR, month: 1, turn: 0, diff: cfg.diff ?? 1,
    cty: {}, prov: {}, off: {}, nid: 1, dip: {}, log: [], hist: [], flags: {},
    offers: [], pend: [], reports: [], over: null, seed: Math.floor(Math.random() * 1e9),
  };
  // countries
  for (const id of D.CORDER) {
    const C = D.COUNTRIES[id];
    G.cty[id] = { id, alive: true, gold: 0, food: 0, tax: 0.15, laws: [...C.laws], ruler: null, josh: null, gyos: null, mins: {}, policy: 'balance', ptarget: null, aggr: C.aggr, fame: 50, coalition: null };
  }
  // provinces
  for (const p of D.PROVINCES) {
    const cap = !!p.cap;
    const pv = { id: p.id, o: p.o, pop: p.pop, agri: U.ri(35, 60) + (cap ? 15 : 0), comm: U.ri(25, 50) + (cap ? 20 : 0), order: U.ri(50, 70), loyal: U.ri(55, 75), wall: p.pass ? 95 : (cap ? 80 : U.ri(30, 60)), troops: 0, gov: null };
    if (p.o === 'qi') pv.comm += 12;
    if (p.id === 'shu') pv.agri += 20;
    const mob = 0.055 * (p.o === 'qin' ? 1.15 : 1);
    pv.troops = Math.round(p.pop * 10000 * mob * (cap ? 1.4 : 1) / 100) * 100;
    if (p.pass) pv.troops = 25000;
    G.prov[p.id] = pv;
  }
  // economy
  for (const id of D.CORDER) {
    const pop = S.countryPop(id);
    G.cty[id].gold = Math.round(pop * 10000 * 40);
    G.cty[id].food = Math.round(pop * 10000 * 6);
  }
  // diplomacy at 前245
  const wars = [['qin', 'wei'], ['qin', 'han'], ['qin', 'zhao'], ['zhao', 'yan']];
  for (const a of D.CORDER) for (const b of D.CORDER) if (a < b) G.dip[S.dipKey(a, b)] = { rel: U.ri(-15, 15), st: 'peace', t: 0 };
  for (const [a, b] of wars) { const d = S.dip(a, b); d.st = 'war'; d.rel = U.ri(-70, -45); }
  S.dip('qin', 'chu').rel = -30; S.dip('qin', 'qi').rel = 20; S.dip('zhao', 'wei').rel = 25; S.dip('han', 'wei').rel = 35; S.dip('chu', 'wei').rel = 15;
  // historical officers
  for (const h of D.HIST) {
    if (h[14] && h[14] > G.year) continue;   // まだ世に出ていない人物
    S.histOfficer(h);
  }
  // fill posts with generated officers
  for (const c of D.CORDER) {
    const cc = G.cty[c];
    if (!cc.ruler) { const o = S.genOfficer(c, 'kuns'); o.age = U.ri(30, 55); cc.ruler = o.id; }
    if (!cc.josh) cc.josh = S.genOfficer(c, 'josh').id;
    if (!cc.gyos) cc.gyos = S.genOfficer(c, 'gyos').id;
    for (const m of D.MIN_ORDER) if (!cc.mins[m]) { const o = S.genOfficer(c, 'daij'); o.min = m; cc.mins[m] = o.id; }
    const gens = S.officersOf(c, o => o.r === 'dais' || o.r === 'shog');
    let need = 5 - gens.length; while (need-- > 0) S.genOfficer(c, U.ch(0.25) ? 'dais' : 'shog');
    const goz = S.officersOf(c, o => o.r === 'goz');
    for (let i = goz.length; i < 4; i++) S.genOfficer(c, 'goz');
    for (let i = 0; i < 3; i++) S.genOfficer(c, U.pick(['senn', 'sanz']));
    // governors
    for (const p of S.ownedProvs(c)) {
      if (p.id === D.COUNTRIES[c].cap) { p.gov = cc.ruler; continue; }
      const g = S.genOfficer(c, 'guns', { loc: p.id }); p.gov = g.id;
    }
    // station generals at borders
    const border = S.ownedProvs(c).filter(p => S.adj(p.id).some(q => G.prov[q].o !== c));
    for (const o of S.officersOf(c, o => ['dais', 'shog', 'goz', 'sanz', 'senn'].includes(o.r))) {
      o.loc = border.length && U.ch(0.75) ? U.pick(border).id : D.COUNTRIES[c].cap;
    }
  }
  // 斉は周辺と穏やか
  for (const c of D.CORDER) if (c !== 'qi') S.dip('qi', c).rel += 10;
  // カスタム：他国の好戦性
  if (cfg.custom && cfg.custom.aggr != null) for (const c of D.CORDER) if (c !== cfg.country) G.cty[c].aggr *= cfg.custom.aggr;

  S.createPlayer(cfg);
  S.log(`${S.cname(cfg.country)}の${D.RANKS[cfg.rank].name}${cfg.rank === 'daij' ? '（' + D.MINISTRIES[cfg.min].n + '）' : ''}として、${S.myOff().n}の物語が始まる。`, 'big');
  S.chron(`${S.myOff().n}、${S.cname(cfg.country)}の${D.RANKS[cfg.rank].name}となる。`);
  return G;
};

S.createPlayer = (cfg) => {
  const c = cfg.country, r = cfg.rank, rk = D.RANKS[r], tier = rk.tier;
  const cc = G.cty[c];
  const o = {
    id: S.newId(), n: cfg.sei + cfg.mei, sei: cfg.sei, mei: cfg.mei, c, r, min: r === 'daij' ? cfg.min : null,
    bu: cfg.stats.bu, tou: cfg.stats.tou, chi: cfg.stats.chi, pol: cfg.stats.pol, mi: cfg.stats.mi,
    tr: [...cfg.traits], st: cfg.style, age: cfg.age, alive: true, loy: 100, bond: 0, merit: 0, jue: 1, loc: null, player: true,
  };
  G.off[o.id] = o;
  // replace unique post holders
  const retire = id => { if (id && G.off[id]) { G.off[id].ret = true; } };
  if (r === 'kuns') { retire(cc.ruler); cc.ruler = o.id; for (const p of S.ownedProvs(c)) if (p.gov && G.off[p.gov]?.ret) p.gov = o.id; }
  if (r === 'josh') { retire(cc.josh); cc.josh = o.id; }
  if (r === 'gyos') { retire(cc.gyos); cc.gyos = o.id; }
  if (r === 'daij') { retire(cc.mins[cfg.min]); cc.mins[cfg.min] = o.id; }

  const startMerit = r === 'kuns' ? 0 : (D.MERIT_TIER[tier] || 0);
  let jue = 1; while (jue < 20 && startMerit >= D.JUE[jue + 1].m) jue++;
  if (r === 'kuns') jue = 20;
  o.jue = jue; o.merit = startMerit;

  // location
  let loc = cfg.loc;
  if (!loc || G.prov[loc]?.o !== c) {
    if (tier >= 7 && rk.track !== 'mil') loc = D.COUNTRIES[c].cap;
    else if (rk.track === 'civ') { const ps = S.ownedProvs(c).filter(p => !S.P[p.id].pass && p.id !== D.COUNTRIES[c].cap); loc = (U.pick(ps) || S.ownedProvs(c)[0]).id; }
    else loc = S.frontProv(c).id;
  }
  if (['kuns', 'josh', 'daij', 'gyos'].includes(r)) loc = D.COUNTRIES[c].cap;
  o.loc = loc;
  if (r === 'guns') { const p = G.prov[loc]; if (p.gov && G.off[p.gov] && G.off[p.gov].id !== cc.ruler) G.off[p.gov].ret = true; p.gov = o.id; }

  const startGold = [0, 600, 1800, 4500, 10000, 22000, 45000, 100000, 220000, 450000, 2000000][tier];
  const me = G.me = {
    oid: o.id, rank: r, min: o.min, loc, boss: null, gen: null,
    gold: startGold, food: S.startFood(tier), ap: 0, merit: startMerit, jue, fame: 10 + tier * 8,
    exp: { bu: 0, tou: 0, chi: 0, pol: 0, mi: 0 },
    army: { sq: [], wu: [], subs: [], dep: null, stg: null, orders: {} },
    land: { ha: 0, hh: 0, fac: {}, build: [], order: 60, loyal: 65, tax: 1, name: '' },
    jur: null, tac: [], tasks: [], items: [], eq: {},
    inj: 0, rec: { battles: 0, wins: 0, kills: 0, slain: [], duels: 0, prom: [] }, flags: {}, banner: cfg.banner || 0,
    lastCouncil: -1, tx: {},
  };
  for (const f of D.FAC_ORDER) me.land.fac[f] = 0;
  S.applyJueLand();
  const facPts = Math.floor(jue / 3);
  const facOrder = ['farm', 'market', 'barracks', 'drill', 'smithy', 'stable', 'school', 'workshop', 'wall'];
  for (let i = 0; i < facPts; i++) { const f = facOrder[i % facOrder.length]; me.land.fac[f] = Math.min(5, me.land.fac[f] + 1); }
  me.land.name = S.placeName(loc) + (jue >= 19 ? '侯国' : '');

  // chain of command
  S.setupChain();
  // starting army
  S.setupArmy(cfg);
  // jurisdiction
  if (D.JUR[r]) S.setupJur(r, loc);
  // tactics
  if (cfg.tactics && cfg.tactics.length) me.tac = cfg.tactics.filter(t => D.TACTICS[t]);
  else {
    const chi = S.stat(o, 'chi');
    const st = { bu: S.stat(o, 'bu'), tou: S.stat(o, 'tou'), chi, pol: S.stat(o, 'pol'), mi: S.stat(o, 'mi') };
    const n = r === 'gunshi' ? 6 : tier >= 7 ? 4 : tier >= 4 ? 2 : 1;
    me.tac = S.genTactics(Object.assign({ st: o.st, r }, st), n);
  }
  if (!me.tac.includes('shazone')) me.tac.push('shazone');
  o.tac = me.tac;
  // starting items
  if (tier >= 3) me.eq.weapon = 'bronze_sword';
  if (tier >= 5) me.eq.armor = 'leather';
  if (tier >= 6) me.eq.horse = 'horse';
  me.items = Object.values(me.eq);
  // カスタム設定
  const cu = cfg.custom;
  if (cu) {
    me.gold = Math.round(me.gold * (cu.gold || 1)) + (cu.gold > 1 ? 5000 * cu.gold : 0);
    if (cu.food > 1) me.food = Math.round(me.food * cu.food);
    if (cu.troops > 1) for (const sq of me.army.sq) { if (me.army.wu.length && !sq.pv && !sq.ld) continue; sq.n = Math.round(sq.n * cu.troops); sq.max = Math.max(sq.max, sq.n); }
    if (cu.train) for (const sq of me.army.sq) sq.tr = Math.max(sq.tr, cu.train);
    if (cu.jue) { me.jue = Math.max(me.jue, cu.jue); o.jue = me.jue; S.applyJueLand(); }
  }
  me.ap = S.apMax();
};

S.frontProv = (c) => {
  const ps = S.ownedProvs(c).filter(p => !S.P[p.id].pass);
  return U.maxBy(ps, p => S.adj(p.id).filter(q => G.prov[q].o !== c && S.atWar(c, G.prov[q].o)).length * 10 + S.adj(p.id).filter(q => G.prov[q].o !== c).length * 2 + Math.random()) || ps[0];
};

S.setupChain = () => {
  const me = G.me, o = S.myOff(), c = o.c, cc = G.cty[c], r = me.rank;
  const loc = me.loc;
  const find = (rr) => U.pick(S.officersOf(c, x => x.r === rr && x.id !== o.id));
  const gen = (rr) => S.genOfficer(c, rr, { loc });
  const stationGeneral = () => {
    let g = U.maxBy(S.officersOf(c, x => ['shog', 'dais'].includes(x.r) && x.loc === loc && x.id !== o.id), x => x.tou);
    if (!g) { g = find('shog') || gen('shog'); g.loc = loc; }
    return g;
  };
  switch (r) {
    case 'goch': me.boss = gen('hyak').id; me.gen = stationGeneral().id; break;
    case 'hyak': me.boss = gen('senn').id; me.gen = stationGeneral().id; break;
    case 'gohy': me.boss = gen('senn').id; me.gen = stationGeneral().id; break;
    case 'senn': me.boss = (find('goz') || gen('goz')).id; G.off[me.boss].loc = loc; me.gen = stationGeneral().id; break;
    case 'sanz': case 'goz': { const g = stationGeneral(); me.boss = g.id; me.gen = g.id; break; }
    case 'shog': { let g = find('dais') || gen('dais'); me.boss = g.id; me.gen = o.id; break; }
    case 'gunshi': { let g = U.maxBy(S.officersOf(c, x => x.r === 'dais'), x => x.tou) || gen('dais'); g.loc = loc; me.boss = g.id; me.gen = g.id; break; }
    case 'dais': me.boss = cc.ruler; me.gen = o.id; break;
    case 'ritei': me.boss = gen('teic').id; break;
    case 'teic': me.boss = gen('kyos').id; break;
    case 'kyos': me.boss = gen('kenr').id; break;
    case 'kenj': me.boss = gen('kenr').id; break;
    case 'kenr': me.boss = G.prov[loc].gov && G.prov[loc].gov !== o.id ? G.prov[loc].gov : cc.josh; break;
    case 'guns': case 'daij': case 'gyos': me.boss = cc.josh && cc.josh !== o.id ? cc.josh : cc.ruler; break;
    case 'josh': me.boss = cc.ruler; break;
    case 'kuns': me.boss = null; break;
  }
  if (me.boss && G.off[me.boss]) G.off[me.boss].bond = 10;
};

S.compSplit = (c, total, opt = {}) => {
  // 国の編成比で兵種ごとに分ける
  const comp = { ...(D.COMP[c] || D.COMP.qin) };
  if (opt.noSiege !== false) { delete comp.ladder; }
  const keys = Object.keys(comp); const sum = U.sum(keys, k => comp[k]);
  const out = {}; let left = total;
  for (const k of keys) { const n = Math.floor(total * comp[k] / sum / 10) * 10; out[k] = n; left -= n; }
  out[keys[0]] = (out[keys[0]] || 0) + left;
  for (const k of keys) if (out[k] <= 0) delete out[k];
  return out;
};

S.newSquad = (t, n, opt = {}) => ({ id: U.uid(), t, n, max: opt.max || n, tr: opt.tr ?? 35, wl: opt.wl ?? 1, al: opt.al ?? 1, ld: opt.ld || null, xp: 0, pv: !!opt.pv });

S.setupArmy = (cfg) => {
  const me = G.me, o = S.myOff(), c = o.c, r = me.rank;
  const A = me.army;
  const tr = 35 + Math.round(S.stat(o, 'tou') / 6);
  const add = (t, n, opt) => { if (n > 0) A.sq.push(S.newSquad(t, n, Object.assign({ tr }, opt))); };
  if (r === 'goch' || r === 'ritei') {
    add(r === 'goch' ? 'inf' : 'militia', 5);
    const names = cfg.squadNames && cfg.squadNames.length === 4 ? cfg.squadNames : null;
    for (let i = 0; i < 4; i++) {
      const nm = names ? names[i] : S.genName().n;
      A.wu.push({ id: U.uid(), n: nm, bu: U.ri(25, 62), hp: 100, xp: 0, bond: U.ri(10, 30), alive: true, tr: U.ch(0.2) ? U.pick(['moushou', 'kobu', 'sogeki', 'tenun', 'fukuhei']) : null });
    }
    return;
  }
  if (r === 'teic') { add('militia', 8); add('arch', 4); }
  else if (r === 'kyos') { add('militia', 30); add('arch', 10); add('inf', 10); }
  else if (r === 'kenj') { add('inf', 140); add('arch', 60); }
  else if (r === 'hyak') { add('inf', 100); }
  else if (r === 'gohy') { add('inf', 300); add('spear', 100); add(c === 'qin' || c === 'han' ? 'xbow' : 'arch', 100); }
  else if (r === 'daij' && me.min === 'eii') { add('guard', 2000); add('inf', 1500); add('xbow', 1000); add('lcav', 500); }
  else {
    let total = D.RANKS[r].troops;
    if (r === 'gunshi') total = 1000;
    const sp = S.compSplit(c, total);
    // 大部隊は兵種ごとに複数の隊へ
    const unitSize = total >= 100000 ? 20000 : total >= 20000 ? 5000 : total >= 3000 ? 1000 : 100000;
    for (const t in sp) {
      let n = sp[t];
      while (n > 0) { const k = Math.min(n, unitSize); add(t, k); n -= k; }
    }
  }
  // 副官・隊長
  const tier = D.RANKS[r].tier;
  if (tier >= 2) {
    const dep = cfg.deputy ? cfg.deputy : S.makeDeputyCandidates(1)[0];
    const d = S.genOfficer(c, D.RANK_ORDER_MIL[Math.max(0, Math.min(6, tier - 2))], { stats: dep.stats, sur: dep.sei });
    d.n = dep.n || d.n; d.sei = dep.sei || d.sei; d.mei = dep.mei || d.mei; d.tr = dep.tr || d.tr; d.st = dep.st || d.st;
    d.loc = me.loc; d.bond = 30; d.lord = o.id;
    A.dep = d.id; A.subs.push(d.id);
    // 主要な隊に隊長を付ける
    const nLead = Math.min(A.sq.length - 1, tier >= 7 ? 6 : tier >= 4 ? 3 : tier >= 3 ? 2 : 0);
    const sorted = [...A.sq].sort((a, b) => b.n - a.n);
    for (let i = 0; i < nLead; i++) {
      const s = sorted[i + 1]; if (!s) break;
      const lr = D.RANK_ORDER_MIL[Math.max(0, tier - 3)];
      const l = S.genOfficer(c, lr, { loc: me.loc }); l.lord = o.id; l.bond = 15;
      s.ld = l.id; A.subs.push(l.id);
    }
    if (sorted[0]) sorted[0].ld = null; // 主人公の直属
  }
  if (r === 'gunshi') me.army.stg = null;
};

S.makeDeputyCandidates = (n = 3) => {
  const out = [];
  const types = [
    { k: '武闘派', b: { bu: 20, tou: 6, chi: -10 }, tr: ['moushou', 'totsu', 'ikkigake', 'tb_hero1', 'td_spear1', 'tb_chg1', 'tx_brave'] },
    { k: '智将', b: { chi: 22, tou: 10, bu: -12 }, tr: ['gunryaku', 'fukuhei', 'seisha', 'tb_det1', 'tc_plan1', 'tb_amb1', 'tx_calm'] },
    { k: '堅実', b: { tou: 18, bu: 4, pol: 6 }, tr: ['teppeki', 'renpei', 'heitan', 'kobu', 'tb_def1', 'tc_disc1', 'tb_rg1'] },
    { k: '騎兵', b: { bu: 12, tou: 10 }, tr: ['shinsoku', 'kiba', 'kisha', 'tu_lcav1', 'tu_hcav1', 'tb_pursuit1', 'td_ride1'] },
    { k: '弓の名手', b: { bu: 8, chi: 8 }, tr: ['seisha', 'sogeki', 'tu_arch1', 'tu_xbow1', 'tb_shoot1', 'tb_range1', 'td_bow1'] },
  ];
  for (let i = 0; i < n; i++) {
    const ty = types[(i + U.ri(0, types.length - 1)) % types.length];
    const nm = S.genName();
    const st = { bu: U.ri(42, 62), tou: U.ri(42, 62), chi: U.ri(38, 62), pol: U.ri(30, 55), mi: U.ri(35, 60) };
    for (const k in ty.b) st[k] = U.clamp(st[k] + ty.b[k], 15, 88);
    const tr = U.shuffle(ty.tr.slice()).slice(0, 2);
    const more = S.genTraits('mil', 3, 1, tr);
    out.push({ n: nm.n, sei: nm.sei, mei: nm.mei, kind: ty.k, stats: st, tr: more, st: ty.k === '智将' ? 'chi' : ty.k === '武闘派' ? 'ins' : 'bal' });
  }
  return out;
};
// 郡の中の県（地図の県）から地名を選ぶ。地図がまだなら昔の名簿から
S.placeName = (pid) => {
  if (typeof GEO !== 'undefined' && GEO.built && (GEO.byProv[pid] || []).length) { const cs = GEO.byProv[pid]; return U.pick(cs.length > 1 ? cs.slice(1) : cs).n; }
  return U.pick(D.XIANG_NAMES);
};
S.setupJur = (r, pid, prev) => {
  const J = D.JUR[r], p = G.prov[pid];
  let nm, county = null, vil = null;
  const cs = typeof GEO !== 'undefined' && GEO.built ? (GEO.byProv[pid] || []) : [];
  if (J.lv === 'jun') nm = S.P[pid].name + '郡';
  else if (cs.length) {
    // 同じ郡の中で移るなら、なるべく同じ県のまま
    let ct = prev && prev.county ? GEO.county(prev.county) : null;
    if (!ct || ct.pid !== pid) ct = J.lv === 'xian' ? U.pick(cs) : U.pick(cs.length > 1 ? cs.slice(1).concat(cs) : cs);
    county = ct.id;
    if (J.lv === 'xian') nm = ct.n + '県';
    else {
      const vi = ct.vil.length ? U.ri(0, ct.vil.length - 1) : -1;
      if (vi >= 0) { vil = vi; nm = `${ct.n}県・${ct.vil[vi].n.replace(/[郷里亭聚]$/, '')}${J.n}`; }
      else nm = ct.n + '県・' + J.n;
    }
  } else nm = J.lv === 'xian' ? (U.pick(D.XIANG_NAMES)) + '県' : (U.pick(D.XIANG_NAMES)) + J.n;
  const j = {
    lv: J.lv, r, name: nm, prov: pid, county, vil,
    hh: J.lv === 'jun' ? Math.round(p.pop * 10000 / 5) : Math.round(J.hh * U.rf(0.8, 1.25)),
    agri: U.clamp(p.agri + U.ri(-12, 6), 10, 95), comm: U.clamp(p.comm + U.ri(-12, 6), 5, 95),
    order: U.clamp(p.order + U.ri(-15, 5), 10, 95), loyal: U.clamp(p.loyal + U.ri(-10, 6), 10, 95),
    cult: U.ri(20, 45), def: U.clamp(p.wall - 20 + U.ri(-10, 10), 5, 90), bandits: U.ri(0, 2),
  };
  if (prev) { j.agri = Math.max(j.agri, prev.agri - 5); j.order = Math.max(j.order, prev.order - 8); }
  j.base = { agri: j.agri, comm: j.comm, order: j.order, loyal: j.loyal, cult: j.cult, hh: j.hh, def: j.def };
  G.me.jur = j;
  return j;
};

S.apMax = () => {
  const me = G.me, o = S.myOff();
  let ap = D.RANKS[me.rank].ap + (G.custom && G.custom.ap || 0) + Math.round(S.fx(o, 'ap'));
  if (S.stat(o, 'pol') >= 80 || S.stat(o, 'chi') >= 85) ap += 1;
  if (me.inj > 0) ap -= 1;
  return Math.max(1, ap);
};

/* ---------- serialization ---------- */
S.serialize = () => JSON.stringify(G);
S.load = (json) => {
  const g = typeof json === 'string' ? JSON.parse(json) : json;
  if (!g || !g.me || !g.prov || !g.off) throw new Error('セーブデータの形式が違います');
  G = g;
  S.migrate();
  return G;
};
S.migrate = () => {
  if ((G.v || 0) < 4) {
    for (const o of Object.values(G.off)) {
      if (!o.tr) o.tr = [];
      o.tr = o.tr.filter(t => D.TRAITS[t]);
      if (!o.tac) o.tac = o.player ? (G.me.tac || []) : (D.RANKS[o.r]?.track !== 'civ' ? S.genTactics(o) : []);
    }
    G.me.tac = (G.me.tac || []).filter(t => D.TACTICS[t]);
    G.me.tx = G.me.tx || {};
    G.mode = G.mode || 'normal';
    G.v = 4;
  }
  if (G.v < 5) {
    // 軍の割り振り・私兵の枠の整理、初期兵糧の見直し
    G.me.army.orders = G.me.army.orders || {};
    S.tidyArmy();
    const tier = D.RANKS[G.me.rank]?.tier || 1;
    const bonus = Math.max(0, S.startFood(tier) - 200 * tier * tier);
    if (bonus > 0) { G.me.food = (G.me.food || 0) + bonus; S.log(`兵糧の見直しで、蔵に兵糧${U.num(bonus)}石が届いた。`, 'good'); }
    G.v = 5;
  }
};

const W = {};
// UI hooks (filled by UI; stubbed in tests)

  choose: async (o) => (o.choices.find(c => !c.disabled) || o.choices[0]).v,
  info: async (o) => {},
  event: async (ev) => 0,
