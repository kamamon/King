};
B.routUnit = (bt, u) => {
  u.state = 'rout'; u.routT = bt.time; u.order = null; u.attach = null; u.hidden = false;
  if (u.onwall != null && bt.walls) { const w = bt.walls[u.onwall]; if (w) w.def = null; u.onwall = null; }
  for (const c of u.cells) c.mor = Math.min(c.mor, 12);
  bt.sides[u.side].mo -= u.hq ? 10 : 1.5;
  B.text(bt, u.x, u.y, '潰走！', u.side === 0 ? 'bad' : 'good');
  B.logMsg(bt, `${B.unitName(bt, u)}が潰走した。`, u.side === 0 ? 'bad' : 'good');
  for (const v of bt.units) if (v.side === u.side && v !== u && B.active(v) && B.dist(u, v) < 90 * bt.p) for (const c of v.cells) c.mor -= 4;
};
B.rally = (bt, u) => {
  u.state = 'idle'; u.order = null;
  for (const c of u.cells) c.mor = Math.max(c.mor, 40);
  B.text(bt, u.x, u.y, '立て直した！', u.side === 0 ? 'good' : 'bad');
};

/* ---------------- 射撃 ---------------- */
B.range = (bt, u) => {
  let r = (u.ut.range || (u.horseArch ? 110 : 0)) * bt.p * (1 + B.F(u, 'rng_range'));
  if (bt.weather === 'rain') r *= 0.85; else if (bt.weather === 'fog') r *= 0.8;
  const t = B.groundT(bt, u.x, u.y);
  if (t === D.T.HILL) r *= 1.15;
  if (bt.points.some(p => p.type === 'hill' && p.owner === u.side && U.dist(p.x, p.y, u.x, u.y) < 90 * bt.p)) r *= 1.08;
  if (u.onwall != null) r *= 1.25;
  if (u.form === 'goose') r *= 1.1;
  return r;
};
B.shoot = (bt, u, dt) => {
  if (u.state === 'rout' || u.ammo <= 0 || u.state === 'climb') return;
  if (u.eng.length && u.t !== 'tower') return;
  const moving = u.spd > 0.4 * bt.p;
  if (moving && !u.ut.moveFire && !u.horseArch) return;
  u.reload -= dt;
  if (u.reload > 0) return;
  const R = B.range(bt, u);
  let tgt = null;
  const o = u.order;
  const inRange = e => B.edgeDist(u, e) <= R;
  if (o && (o.type === 'attack' || o.type === 'fire') && bt.units[o.target]) { const e = bt.units[o.target]; if (B.alive(e) && e.vis[u.side] && inRange(e)) tgt = e; }
  if (!tgt) {
    let best = null, bs = -1;
    for (const e of bt.units) {
      if (e.side === u.side || !B.alive(e) || !e.vis[u.side]) continue;
      if (u.zone && U.dist(e.x, e.y, u.zone.x, u.zone.y) > u.zone.r + e.diag * 0.4) continue;
      if (!inRange(e)) continue;
      const friendsIn = e.eng.length;
      const d = B.dist(u, e);
      let s = 1000 / (d + 30) * (friendsIn ? 0.25 : 1) * (e.state === 'rout' ? 0.3 : 1) * (e.cls === 'rng' ? 1.2 : 1) * (e.onwall != null ? 1.2 : 1);
      if (s > bs) { bs = s; best = e; }
    }
    tgt = best;
  }
  if (!tgt) { u.reload = 0.5; return; }
  // 射撃
  const d = B.edgeDist(u, tgt);
  const ttile = B.groundT(bt, tgt.x, tgt.y);
  const dens = tgt.ut.dens * (D.FORM[tgt.form].densMul || 1);
  let acc = 0.4 * (1 - 0.45 * d / R) * (0.7 + B.trOf(u) / 200) * U.clamp(1.6 / dens, 0.45, 1.15) * (1 - D.TILE[ttile].cov) * (tgt.spd > 1.2 * bt.p ? 0.85 : 1);
  if (bt.weather === 'rain') acc *= 0.75; else if (bt.weather === 'wind') acc *= 0.85;
  if (tgt.onwall != null) acc *= 0.35;
  const shooters = u.n * (u.onwall != null ? 1 : 0.9) * (moving ? 0.6 : 1);
  let mult = (1 + 0.06 * (u.wl - 1)) * B.countryMul(bt, u) * (D.FORM[u.form].ranged || 1) * Math.max(0.3, 1 + B.F(u, 'rng_dmg') + B.F(u, 'c_' + u.cls) + B.F(u, 'u_' + u.t) + B.F(u, 'vs_' + tgt.cls) + B.weatherMul(bt, u) + (bt.sides[tgt.side].nomad ? B.F(u, 'vs_nomad') : 0) + (bt.sides[tgt.side].bandit ? B.F(u, 'vs_bandit') : 0));
  let tag = null;
  if (u.zone && !u.zoneFired[tgt.id]) { u.zoneFired[tgt.id] = 1; mult *= (bt.sides[u.side].tactics.includes('shazone') ? 2 : 1.4) * (bt.sides[u.side].cmd?.st === 'chi' ? 1.2 : 1) * (1 + B.F(u, 'ambush') * 0.3); tag = '斉射！'; }
  if (u.hidden) { mult *= 2.5; B.reveal(bt, u); tag = '伏兵の斉射！'; for (const c of tgt.cells) c.mor -= 12; }
  if (u.seisha) { mult *= 3; u.seisha = false; tag = '斉射！'; }
  let kills = shooters * acc * (u.ut.mdmg || 0.025) * mult;
  const res = (tgt.ut.arrowRes || 0) + (tgt.al - 1) * 0.06 - (u.ut.pierce || 0) * 0.5;
  kills *= U.clamp(1 - res, 0.2, 1.2) * (D.FORM[tgt.form].arrowTaken || 1) * Math.max(0.25, 1 - B.F(tgt, 'arrow_res'));
  if (tgt.buffs.teppeki > bt.time) kills *= 0.7;
  if (tgt.buffs.bouheki > bt.time) kills *= 0.4;
  const flight = d / (75 * bt.p) + 0.25;
  bt.proj.push({ from: u.id, to: tgt.id, x0: u.x, y0: u.y, x1: tgt.x, y1: tgt.y, t: 0, dur: flight, kills, side: u.side, n: Math.min(28, 4 + Math.round(Math.sqrt(shooters) * 0.8)), xbow: u.t === 'xbow', big: !!tag, mor: 1 + B.F(u, 'arrow_mor'), ff: Math.max(0, 1 - B.F(u, 'ff_res')), fire: bt.sides[u.side].acts.has('hiya') && bt.weather !== 'rain' });
  if (tag) B.text(bt, tgt.x, tgt.y, tag, u.side === 0 ? 'good' : 'bad');
  u.reload = (u.ut.rof || 6) * U.rf(0.9, 1.1) / Math.max(0.3, 1 + B.F(u, 'rng_rate')) / (u.buffs.renya > bt.time ? 2 : 1);
  u.ammo--;
};
B.projectiles = (bt, dt) => {
  const keep = [];
  for (const p of bt.proj) {
    p.t += dt;
    if (p.t >= p.dur) {
      const tgt = bt.units[p.to];
      if (tgt && B.alive(tgt)) {
        // 交戦中の敵を射ると味方にも当たる
        if (tgt.eng.length && Math.random() < 0.3 * (p.ff ?? 1)) {
          const fr = bt.units[U.pick(tgt.eng)];
          if (fr && fr.side === p.side) { B.applyHits(bt, fr, p.kills * 0.4, null, 0, 0, bt.units[p.from], 0.6, true); p.kills *= 0.6; }
        }
        B.applyHits(bt, tgt, p.kills, null, 0, 0, bt.units[p.from], 0.75 * (p.mor || 1), true);
        const harass = B.morDmg(bt, tgt, (0.6 + Math.min(4, p.kills * 0.6)) * (p.mor || 1));
        for (const c of tgt.cells) if (Math.random() < 0.5) c.mor -= harass * 0.5;
        if (p.side === 0) { const src = bt.units[p.from]; if (src && (src.mine || bt.sides[0].cmdAll)) B.tx(bt, 'shoot', p.kills); }
        if (p.fire && Math.random() < 0.08) { const ti = B.ti(bt, tgt.x, tgt.y); if (D.TILE[bt.terr[ti]].burn >= 0.6 || tgt.cls === 'sie') { if (B.ignite(bt, ti, 40)) { tgt._lastFireBy = p.from; B.text(bt, tgt.x, tgt.y, '火矢！', p.side === 0 ? 'good' : 'bad'); } } }
        B.fx(bt, { k: 'arrows', x: tgt.x, y: tgt.y, r: Math.max(3, tgt.w * 0.35), n: p.n });
      }
    } else keep.push(p);
  }
  bt.proj = keep;
};

/* ---------------- 攻城 ---------------- */
B.siegeStep = (bt, dt) => {
  const p = bt.p;
  for (const w of bt.walls) w.tower = false;
  // 投石機
  for (const u of bt.units) {
    if (u.t !== 'cata' || !B.alive(u) || u.state === 'rout') continue;
    u.reload -= dt;
    if (u.reload > 0 || u.spd > 0.3 * p) continue;
    const R = B.range(bt, u);
    const w = U.minBy(bt.walls.filter(w => w.side !== u.side && !w.broken && w.captured < 0 && U.dist(w.x, w.y, u.x, u.y) < R), w => (w.kind === 'gate' ? 0 : 60 * p) + U.dist(w.x, w.y, u.x, u.y));
    if (!w) { u.reload = 1; continue; }
    const dmg = (55 + u.n * 0.8) * (1 + B.F(u, 'siege_atk') + B.F(u, 'c_sie'));
    w.hp -= dmg * (w.kind === 'gate' ? 1 : 0.6);
    B.fx(bt, { k: 'rocks', x: w.x, y: w.y, r: bt.T0 * 0.8 });
    const d = bt.units.find(x => x.onwall === w.id && B.alive(x));
    if (d) B.applyHits(bt, d, 1.5 + d.n * 0.01, null, 0, 0, u, 1.2, true);
    if (w.hp <= 0) { if (w.kind === 'gate') B.breakGate(bt, w); else B.collapseWall(bt, w, '投石で城壁が崩れた！'); }
    u.reload = (u.ut.rof || 10) * U.rf(0.9, 1.15);
  }
  // 地道
  if (bt.tunnel && !bt.tunnel.done && bt.started) {
    bt.tunnel.t += dt;
    if (bt.tunnel.t >= bt.tunnel.need) {
      bt.tunnel.done = true;
      const cand = bt.walls.filter(w => w.kind === 'wall' && w.side !== bt.tunnel.s && !w.broken && w.captured < 0);
      const w = U.minBy(cand, w => Math.abs(w.x - bt.city.x) + (w.nx ? 200 * p : 0));
      if (w) B.collapseWall(bt, w, '地道が通じ、城壁が崩れ落ちた！');
    }
  }
  // 内応
  if (bt.naiou && !bt.naiou.done && bt.started && bt.time >= bt.naiou.t) {
    bt.naiou.done = true;
    const atk = bt.sides[bt.naiou.s], dfs = bt.sides[1 - bt.naiou.s];
    const pr = U.clamp(0.55 + ((atk.cmd?.chi || 50) - (dfs.cmd?.chi || 50)) / 120, 0.15, 0.9);
    const g = U.pick(bt.walls.filter(w => w.kind === 'gate' && !w.broken && w.side !== bt.naiou.s));
    if (g && Math.random() < pr) { B.breakGate(bt, g, true); B.logMsg(bt, '内通者が城門を開け放った！', bt.naiou.s === 0 ? 'good' : 'bad'); }
    else B.logMsg(bt, bt.naiou.s === 0 ? '内応は露見し、内通者は斬られた……' : '城内の裏切り者を捕らえた。', bt.naiou.s === 0 ? 'bad' : 'good');
  }
  for (const u of bt.units) {
    if (!B.alive(u)) continue;
    if (u.t === 'tower' && u.state !== 'rout') {
      const w = U.minBy(bt.walls.filter(w => w.kind === 'wall' && w.side !== u.side), w => U.dist(w.x, w.y, u.x, u.y));
      if (w && U.dist(w.x, w.y, u.x, u.y) < u.diag * 0.5 + bt.T0 * 1.4) w.tower = true;
    }
  }
  for (const u of bt.units) {
    if (!B.alive(u)) continue;
    if (u.state === 'ram') {
      const w = bt.walls[u.ramWall];
      if (!w || w.broken) { u.state = 'idle'; u.order = null; continue; }
      if (U.dist(u.x, u.y, w.x, w.y) > u.diag + bt.T0 * 2) { u.state = 'idle'; continue; }
      w.hp -= dt * 7 * (u.n / 30) * (1 + 0.1 * (u.tr / 50)) * (1 + B.F(u, 'ram') + B.F(u, 'siege_atk'));
      if (Math.random() < 0.3 * dt) B.fx(bt, { k: 'dust', x: w.x, y: w.y, r: bt.T0 });
      // 城壁の守備兵は衝車を狙う（熱湯・落石）
      const def = bt.units.filter(d => d.side === w.side && d.onwall != null && B.alive(d) && U.dist(d.x, d.y, w.x, w.y) < bt.T0 * 6);
      if (def.length) B.applyHits(bt, u, dt * 0.35 * def.length * (bt.sides[w.side].acts.has('nettou') ? 1.5 : 1), null, 0, 0, def[0], 0.5, true);
      if (w.hp <= 0) B.breakGate(bt, w);
    }
    if (u.state === 'climb') {
      const w = bt.walls[u.climb];
      if (!w || w.captured === u.side) { u.state = 'idle'; u.climb = null; continue; }
      const def = w.def != null ? bt.units[w.def] : null;
      const len = Math.max(bt.tile, w.len);
      const ladders = (u.t === 'ladder' ? 1.6 : 0.6) * (1 + B.F(u, 'climb') + B.F(u, 'siege_atk'));
      const tw = w.tower ? (bt.sides[u.side].acts.has('tower') ? 4.5 : 3) : 1;
      const hot = bt.sides[w.side].acts.has('nettou') ? 1.5 : 1;
      if (def && B.alive(def) && def.onwall === w.id) {
        const nA = Math.min(u.n, len / B.spacing(u) * 1.2 * ladders * (w.tower ? 2 : 1));
        const nD = Math.min(def.n, len / B.spacing(def) * 2);
        const kA = nA * B.K * B.atk(bt, u, def, 'F') / B.def(bt, def) * 0.6 * dt;
        const kD = nD * B.K * B.atk(bt, def, u, 'F') / B.def(bt, u) * 2.0 * dt * (1 + (def.cls === 'rng' ? 0.4 : 0)) * hot;
        B.applyHits(bt, def, kA, 'F', -1e9, 1e9, u, 0.8);
        B.applyHits(bt, u, kD, 'F', -1e9, 1e9, def, 1.1);
        w.prog += dt * (nA / (nD + 3)) * 0.022 * tw * ladders;
      } else {
        // 守り手のいない城壁は登りやすい（隣の壁から矢）
        w.prog += dt * 0.05 * tw * ladders;
        if (Math.random() < 0.5 * dt) B.applyHits(bt, u, u.n * 0.002 * hot, null, 0, 0, null, 0.5, true);
      }
      if (Math.random() < 0.4 * dt) B.fx(bt, { k: 'clash', x: w.x, y: w.y });
      if (w.prog >= 1) B.breachWall(bt, w, u);
    }
  }
  // 城内から門を開ける
  for (const w of bt.walls) {
    if (w.kind !== 'gate' || w.broken) continue;
    const inside = bt.units.filter(u => u.side !== w.side && B.active(u) && U.dist(u.x, u.y, w.x - w.nx * bt.T0 * 2, w.y - w.ny * bt.T0 * 2) < bt.T0 * 2.6);
    if (inside.length) { w.openT += dt; if (w.openT > 4) { B.breakGate(bt, w, true); } } else w.openT = 0;
  }
  // 本丸
  const ct = bt.city;
  if (ct) {
    const att = 1 - ct.side;
    let a = 0, d = 0;
    for (const u of bt.units) if (B.active(u) && U.dist(u.x, u.y, ct.x, ct.y) < ct.r + u.diag * 0.4) { if (u.side === att) a += u.n; else d += u.n; }
    if (a > 0 && d === 0) { ct.hold += dt; if (ct.hold > 15 && !bt.cityTaken) { bt.cityTaken = true; B.text(bt, ct.x, ct.y, ct.pass ? '関を制圧！' : '本丸を制圧！', att === 0 ? 'good' : 'bad'); B.logMsg(bt, ct.pass ? '関が落ちた！' : '城が落ちた！', att === 0 ? 'good' : 'bad'); bt.sides[ct.side].mo -= 40; } }
    else ct.hold = Math.max(0, ct.hold - dt * 2);
  }
};
B.breakGate = (bt, w, opened) => {
  if (w.broken) return;
  w.broken = true; w.hp = 0;
  for (const i of w.tiles) bt.terr[i] = D.T.BROKEN;
  B.text(bt, w.x, w.y, opened ? '城門が開いた！' : '城門を破った！', w.side === 0 ? 'bad' : 'good');
  B.logMsg(bt, opened ? '内側から城門が開け放たれた！' : '衝車が城門を打ち破った！', w.side === 0 ? 'bad' : 'good');
  bt.sides[w.side].mo -= 12; bt.sides[1 - w.side].mo += 8;
  for (const u of bt.units) if (u.side === w.side && B.alive(u)) for (const c of u.cells) c.mor -= 6;
};
B.breachWall = (bt, w, u) => {
  w.captured = u.side; w.prog = 0;
  const def = w.def != null ? bt.units[w.def] : null;
  if (def && B.alive(def)) { def.onwall = null; def.state = 'idle'; for (const c of def.cells) c.mor -= 25; const back = bt.T0 * 1.5 + def.h / 2; def.x = w.x - w.nx * back; def.y = w.y - w.ny * back; }
  w.def = null;
  u.state = 'idle'; u.climb = null; u.order = null;
  const inside = bt.T0 * 1.2 + u.h / 2;
  u.x = w.x - w.nx * inside; u.y = w.y - w.ny * inside;
  u.a = B.angTo(-w.nx, -w.ny);
  B.unstick(bt, u);
  B.text(bt, w.x, w.y, '城壁を突破！', u.side === 0 ? 'good' : 'bad');
  B.logMsg(bt, `${B.unitName(bt, u)}が城壁を乗り越えた！`, u.side === 0 ? 'good' : 'bad');
  bt.sides[w.side].mo -= 6;
  if (u.side === 0 && u.ctrl === 'player') bt.stat.points++;
};

B.collapseWall = (bt, w, msg) => {
  if (w.broken) return;
  w.broken = true; w.hp = 0; w.captured = 1 - w.side;
  const d = w.def != null ? bt.units[w.def] : null;
  if (d && B.alive(d)) { d.onwall = null; d.state = 'idle'; B.applyHits(bt, d, d.n * 0.1, null, 0, 0, null, 1.5, true); const back = bt.T0 * 1.5 + d.h / 2; d.x = w.x - w.nx * back; d.y = w.y - w.ny * back; }
  w.def = null;
  for (const i of w.tiles) bt.terr[i] = D.T.BROKEN;
  B.text(bt, w.x, w.y, msg || '城壁が崩れた！', w.side === 0 ? 'bad' : 'good');
  B.logMsg(bt, msg || '城壁が崩れた！', w.side === 0 ? 'bad' : 'good');
  bt.sides[w.side].mo -= 8;
};

/* ---------------- 火・水 ---------------- */
B.ignite = (bt, i, t = 55) => {
  const tt = bt.terr[i];
  if (!D.TILE[tt].burn || bt.fire[i] > 0 || bt.burnt[i]) return false;
  bt.fire[i] = t;
  return true;
};
B.hazards = (bt, dt) => {
  bt.hz = (bt.hz || 0) + dt;
  const tick = bt.hz >= 1;
  if (tick) bt.hz -= 1;
  const N = bt.cols * bt.rows;
  let anyFire = false, anyFlood = false;
  if (tick) {
    const wx = Math.cos(bt.wind), wy = Math.sin(bt.wind);
    const ignite = [];
    for (let i = 0; i < N; i++) {
      if (bt.fire[i] > 0) {
        anyFire = true;
        bt.fire[i] -= bt.weather === 'rain' ? 3 : 1;
        const c = i % bt.cols, r = Math.floor(i / bt.cols);
        for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= bt.cols || nr >= bt.rows) continue;
          const j = nr * bt.cols + nc;
          const align = 1 + (dc * wx + dr * wy) * 0.8;
          if (Math.random() < D.TILE[bt.terr[j]].burn * 0.16 * B.TS * align * (bt.weather === 'rain' ? 0.25 : bt.weather === 'wind' ? 1.7 : bt.weather === 'snow' ? 0.5 : 1)) ignite.push(j);
        }
        if (bt.fire[i] <= 0) { bt.fire[i] = 0; bt.burnt[i] = 1; if ([D.T.FOREST, D.T.MARSH, D.T.PLAIN, D.T.GROVE, D.T.FIELD, D.T.GRASS, D.T.VILLAGE].includes(bt.terr[i])) bt.terr[i] = D.T.BURNT; }
      }
      if (bt.flood[i] > 0) { anyFlood = true; bt.flood[i] = Math.max(0, bt.flood[i] - 1); }
    }
    for (const j of ignite) B.ignite(bt, j, U.rf(35, 60));
  }
  if (!tick) return;
  for (const u of bt.units) {
    if (!B.alive(u)) continue;
    const i = B.ti(bt, u.x, u.y);
    if (bt.fire[i] > 0) {
      const src = u._lastFireBy != null ? bt.units[u._lastFireBy] : null;
      const fm = (1 + (src ? B.F(src, 'fire') : 0)) * Math.max(0.2, 1 - B.F(u, 'fire_res'));
      B.applyHits(bt, u, (u.n * 0.006 + 0.2) * fm, null, 0, 0, src, 0.4, true);
      B.morHit(bt, u, 2.2 * fm);
      if (u.hidden) B.reveal(bt, u);
      if (Math.random() < 0.3) B.fx(bt, { k: 'smoke', x: u.x, y: u.y });
    }
    if (bt.flood[i] > 0) { B.applyHits(bt, u, u.n * 0.015, null, 0, 0, null, 0.5, true); for (const c of u.cells) c.mor -= 3; }
  }
};

/* ---------------- 戦法 ---------------- */
B.traitSk = (u) => { const out = []; for (const t of (u.ld && u.ld.tr) || []) { const sk = D.TRAITS[t]?.sk; if (sk && !out.includes(sk)) out.push(sk); } return out; };
B.skillFits = (u, k) => { const t = D.SKILLS[k]?.t; if (!t) return true; if (t === 'rng') return !!(u.ut.range || u.horseArch); if (t === 'cav') return u.cls === 'cav'; if (t === 'sie') return u.cls === 'sie'; if (t === 'inf') return u.cls === 'inf'; return true; };
B.skillsOf = (bt, u) => {
  const out = [];
  if (!u.ld || u.ldFate !== 'ok') return out;
  for (const sk of B.traitSk(u)) if (!out.includes(sk) && B.skillFits(u, sk)) out.push(sk);
  const tac = bt.sides[u.side].tactics;
  if (tac.includes('gitai') && !out.includes('gitai')) out.push('gitai');
  if (tac.includes('chohatsu') && !out.includes('chohatsu')) out.push('chohatsu');
  if (tac.includes('kakei') && !out.includes('kakei')) out.push('kakei_t');
  if (u.cls === 'rng' && !out.includes('seisha') && tac.includes('shazone')) out.push('seisha');
  for (const t of tac) { const T = D.TACTICS[t]; if (T && T.skill && !out.includes(T.skill) && B.skillFits(u, T.skill) && (!T.skillCls || T.skillCls === u.cls)) out.push(T.skill); }
  return out;
};
B.cpPool = (bt, u) => (bt.sides[u.side].player && !bt.sides[u.side].cmdAll) ? 'my' : 'side';
B.cpOf = (bt, u) => B.cpPool(bt, u) === 'my' ? (bt.myCp ?? 0) : bt.sides[u.side].cp;
B.canSkill = (bt, u, k) => {
  const sk = D.SKILLS[k]; if (!sk) return false;
  if ((u.cd[k] || 0) > bt.time) return false;
  if (B.cpOf(bt, u) < sk.cost) return false;
  if (u.state === 'rout' && k !== 'kobu') return false;
  return true;
};
B.useSkill = (bt, u, k, arg) => {
  if (!B.canSkill(bt, u, k)) return false;
  const sk = D.SKILLS[k], now = bt.time, p = bt.p;
  let ok = true;
  switch (k) {
    case 'kobu': {
      for (const c of u.cells) c.mor = Math.min(100, c.mor + 25);
      for (const v of bt.units) if (v !== u && v.side === u.side && B.alive(v) && B.dist(v, u) < 130 * p) for (const c of v.cells) c.mor = Math.min(100, c.mor + 12);
      if (u.state === 'rout') B.rally(bt, u);
      break;
    }
    case 'totsu': u.buffs.totsu = now + sk.dur; u.impact = {}; break;
    case 'shinsoku': u.buffs.shinsoku = now + sk.dur; break;
    case 'teppeki': u.buffs.teppeki = now + sk.dur; break;
    case 'seisha': if (!(u.ut.range || u.horseArch)) return false; u.seisha = true; u.reload = 0; break;
    case 'kakei': case 'kakei_t': {
      let tx = arg?.x, ty = arg?.y;
      if (tx == null) { const e = U.minBy(B.foes(bt, u.side), e => B.dist(e, u)); if (!e) return false; tx = e.x; ty = e.y; }
      if (U.dist(tx, ty, u.x, u.y) > 60 * p) return false;
      let lit = 0;
      const c0 = Math.floor(tx / bt.tile), r0 = Math.floor(ty / bt.tile);
      const fr = Math.round(B.TS * (1 + Math.min(1, B.F(u, 'fire'))));
      if (bt.weather === 'rain') { B.text(bt, tx, ty, '雨で火がつかない', u.side === 0 ? 'bad' : 'good'); return false; }
      for (let dr = -fr; dr <= fr; dr++) for (let dc = -fr; dc <= fr; dc++) { const c = c0 + dc, r = r0 + dr; if (c < 0 || r < 0 || c >= bt.cols || r >= bt.rows) continue; if (B.ignite(bt, r * bt.cols + c, U.rf(45, 70) * (1 + B.F(u, 'fire') * 0.5))) lit++; }
      if (!lit) return false;
      for (const e of bt.units) if (e.side !== u.side && B.dist(e, { x: tx, y: ty }) < 80 * p) e._lastFireBy = u.id;
      B.text(bt, tx, ty, '火計！', u.side === 0 ? 'good' : 'bad');
      break;
    }
    case 'ikki': {
      const e = arg?.target != null ? bt.units[arg.target] : U.minBy(B.foes(bt, u.side), e => B.dist(e, u));
      if (!e || B.edgeDist(u, e) > 60 * p) return false;
      const bu = (u.ld.bu || 50);
      B.applyHits(bt, e, bu / 8, 'F', -1e9, 1e9, u, 1.2);
      for (const c of e.cells) c.mor -= 18 * bu / 90;
      B.text(bt, e.x, e.y, `${u.ld.n} 一騎駆け！`, u.side === 0 ? 'good' : 'bad');
      if (e.ld && e.ldFate === 'ok') { bt.pendingChallenge = { a: u.id, b: e.id, by: u.side }; }
      break;
    }
    case 'sogeki': {
      const R = Math.max(B.range(bt, u), 120 * p) * 1.1;
      const e = arg?.target != null ? bt.units[arg.target] : U.minBy(B.foes(bt, u.side).filter(e => e.ld && e.ldFate === 'ok' && B.edgeDist(u, e) < R), e => B.dist(e, u));
      if (!e || !e.ld) return false;
      const pr = U.clamp(0.18 + ((u.ld.bu || 50) - (e.ld.bu || 50)) / 250, 0.05, 0.45);
      if (Math.random() < pr) { if (e.ld.player) B.playerHit(bt, e, u, false); else B.leaderLost(bt, e, u, Math.random() < 0.5); }
      else { B.text(bt, e.x, e.y, '狙撃は外れた', u.side === 0 ? 'bad' : 'good'); for (const c of e.cells) c.mor -= 6; }
      break;
    }
    case 'rakuseki': {
      const pt = arg?.point != null ? bt.points[arg.point] : bt.points.find(p => p.type === 'hill' && p.owner === u.side && !p.used);
      if (!pt || pt.owner !== u.side || pt.used) return false;
      pt.used = true;
      let hit = 0;
      for (const e of bt.units) if (e.side !== u.side && B.alive(e) && U.dist(e.x, e.y, pt.x, pt.y) < 110 * p + e.diag * 0.3) { B.applyHits(bt, e, e.n * 0.07 + 2, null, 0, 0, u, 1.4, true); for (const c of e.cells) c.mor -= 22; hit++; B.fx(bt, { k: 'rocks', x: e.x, y: e.y, r: e.w * 0.4 }); }
      B.text(bt, pt.x, pt.y, '落石！', u.side === 0 ? 'good' : 'bad');
      if (!hit) B.logMsg(bt, '落石の下には誰もいなかった。');
      break;
    }
    case 'suikei': {
      const pt = bt.points.find(p => p.type === 'dam' && p.owner === u.side && !p.used);
      if (!pt || !bt.river) return false;
      pt.used = true;
      for (const i of bt.river) { const c = i % bt.cols, r = Math.floor(i / bt.cols); for (let dr = -3 * B.TS; dr <= 3 * B.TS; dr++) for (let dc = -B.TS; dc <= B.TS; dc++) { const rr = r + dr, cc = c + dc; if (rr < 0 || cc < 0 || rr >= bt.rows || cc >= bt.cols) continue; const j = rr * bt.cols + cc; if (bt.elev[j] < 0.58) bt.flood[j] = 40; } }
      for (const e of bt.units) if (e.side !== u.side && B.alive(e) && bt.flood[B.ti(bt, e.x, e.y)] > 0) for (const c of e.cells) c.mor -= 28;
      B.text(bt, pt.x, pt.y, '水計！', u.side === 0 ? 'good' : 'bad');
      break;
    }
    case 'gitai': B.setOrder(bt, u, { type: 'feint' }); break;
    case 'renya': if (!(u.ut.range || u.horseArch)) return false; u.buffs.renya = now + sk.dur; u.reload = Math.min(u.reload, 0.5); break;
    case 'kongou': u.buffs.kongou = now + sk.dur; break;
    case 'gekirin': u.buffs.gekirin = now + sk.dur; break;
    case 'kyouhei': for (const v of bt.units) if (v.side === u.side && B.alive(v) && B.dist(v, u) < 120 * p) v.buffs.kyouhei = now + sk.dur; break;
    case 'shippu': for (const v of bt.units) if (v.side === u.side && B.alive(v) && B.dist(v, u) < 120 * p) v.buffs.shippu = now + sk.dur; break;
    case 'bouheki': u.buffs.bouheki = now + sk.dur; break;
    case 'sally': u.buffs.sally = now + sk.dur; break;
    case 'senpu': {
      if (u.cls !== 'cav') return false;
      let hit = 0;
      for (const e of bt.units) if (e.side !== u.side && B.alive(e) && B.edgeDist(u, e) < 30 * p) { B.applyHits(bt, e, 2 + u.n * 0.025 * (1 + B.F(u, 'chg')), null, 0, 0, u, 1.3, true); B.morHit(bt, e, 12); hit++; }
      if (!hit) return false;
      u.fat = Math.min(1, u.fat + 0.2);
      B.text(bt, u.x, u.y, '旋風！', u.side === 0 ? 'good' : 'bad');
      break;
    }
    case 'kaiten': {
      let n = 0;
      for (const v of bt.units) if (v.side === u.side && B.alive(v) && B.dist(v, u) < 170 * p) { if (v.state === 'rout') { B.rally(bt, v); n++; } for (const c of v.cells) c.mor = Math.min(100, c.mor + 15); }
      for (const c of u.cells) c.mor = Math.min(100, c.mor + 20);
      break;
    }
    case 'konran': {
      const e = arg?.target != null ? bt.units[arg.target] : U.minBy(B.foes(bt, u.side).filter(e => B.dist(e, u) < 160 * p), e => B.dist(e, u));
      if (!e || B.dist(e, u) > 200 * p) return false;
      if (e.ld && Math.random() < ((e.ld.chi || 40) - (u.ld.chi || 40) + 30) / 160) { B.text(bt, e.x, e.y, '攪乱を見破った', u.side === 0 ? 'bad' : 'good'); break; }
      e.confused = now + 12; e.order = null; e.attach = null;
      B.text(bt, e.x, e.y, '混乱！', u.side === 0 ? 'good' : 'bad');
      break;
    }
    case 'youdou': {
      const es = B.foes(bt, u.side).filter(e => !e.eng.length && !e.hq && e.cls !== 'sie' && B.dist(e, u) < 280 * p && e.state !== 'rout').slice(0, 3);
      if (!es.length) return false;
      const side = u.x < bt.W / 2 ? 1 : -1;
      const tx = U.clamp(u.x + side * 140 * p, 20, bt.W - 20), ty = u.y;
      let n = 0;
      for (const e of es) { if (e.ld && Math.random() < (e.ld.chi || 40) / 220) continue; e.forced = { x: tx + (Math.random() - 0.5) * 40 * p, y: ty + (Math.random() - 0.5) * 40 * p, until: now + 15 }; B.setOrder(bt, e, { type: 'move', x: e.forced.x, y: e.forced.y }); n++; }
      B.text(bt, u.x, u.y, n ? '陽動！' : '陽動は見破られた', u.side === 0 ? (n ? 'good' : 'bad') : (n ? 'bad' : 'good'));
      break;
    }
    case 'kyuuen': {
      const k = Math.min(Math.round(u.dead * 0.12), Math.max(0, u.n0 - u.n));
      if (k <= 0 || !u.cells.length) return false;
      u.dead -= k; u.n += k; const c = u.cells[u.cells.length - 1]; c.n += k; c.max += k; B.layoutCells(u);
      B.text(bt, u.x, u.y, `救護（+${k}）`, u.side === 0 ? 'good' : 'bad');
      break;
    }
    case 'ransha': {
      if (!(u.ut.range || u.horseArch) || u.ammo <= 0) return false;
      const R = B.range(bt, u);
      const ts = B.foes(bt, u.side).filter(e => B.edgeDist(u, e) <= R).slice(0, 3);
      if (!ts.length) return false;
      for (const e of ts) { const k = u.n * 0.12 * (u.ut.mdmg || 0.03) * (1 + B.F(u, 'rng_dmg')); bt.proj.push({ from: u.id, to: e.id, x0: u.x, y0: u.y, x1: e.x, y1: e.y, t: 0, dur: B.edgeDist(u, e) / (75 * p) + 0.25, kills: k, side: u.side, n: 12, big: true, mor: 1.6 }); }
      u.ammo = Math.max(0, u.ammo - 2);
      break;
    }
    case 'tettai': {
      let n = 0;
      for (const v of bt.units) if (v.side === u.side && B.alive(v) && v.eng.length && B.dist(v, u) < 110 * p && v.state !== 'rout') { B.setOrder(bt, v, { type: 'disengage' }); v.buffs.tettai = now + 8; n++; }
      if (!n) return false;
      break;
    }
    case 'tsuki': {
      const e = u.eng.length ? bt.units[u.eng[0]] : null;
      if (!e) return false;
      B.morHit(bt, e, 20); e.chaos = true; e.engT = Math.max(e.engT, 7);
      B.text(bt, e.x, e.y, '突き崩した！', u.side === 0 ? 'good' : 'bad');
      break;
    }
    case 'hien': {
      if (u.cls !== 'cav') return false;
      const e = arg?.target != null ? bt.units[arg.target] : U.minBy(B.foes(bt, u.side).filter(e => B.dist(e, u) < 200 * p), e => B.dist(e, u));
      if (!e) return false;
      u.hien = true; u.impact = {}; B.setOrder(bt, u, { type: 'charge', target: e.id });
      break;
    }
    case 'hekireki': {
      if (u.cls !== 'sie') return false;
      if (!bt.walls) return false;
      const R = Math.max(B.range(bt, u), 140 * p);
      const w = U.minBy(bt.walls.filter(w => w.side !== u.side && !w.broken && w.captured < 0 && U.dist(w.x, w.y, u.x, u.y) < R), w => U.dist(w.x, w.y, u.x, u.y));
      if (!w) return false;
      w.hp -= 450 * (1 + B.F(u, 'siege_atk'));
      B.fx(bt, { k: 'rocks', x: w.x, y: w.y, r: bt.T0 * 1.4 });
      if (w.hp <= 0) { if (w.kind === 'gate') B.breakGate(bt, w); else B.collapseWall(bt, w); }
      break;
    }
    case 'chohatsu': {
      const e = U.minBy(B.foes(bt, u.side).filter(e => !e.hq && B.dist(e, u) < 200 * p), e => B.dist(e, u));
      if (!e) return false;
      if (e.ld && Math.random() < (e.ld.chi || 40) / 180) { B.text(bt, e.x, e.y, '挑発に乗らない', u.side === 0 ? 'bad' : 'good'); }
      else { e.forced = { target: u.id, until: now + 20 }; B.setOrder(bt, e, { type: 'attack', target: u.id }); B.text(bt, e.x, e.y, '挑発に乗った！', u.side === 0 ? 'good' : 'bad'); }
      break;
    }
    default: ok = false;
  }
  if (!ok) return false;
  if (B.cpPool(bt, u) === 'my') bt.myCp -= sk.cost; else bt.sides[u.side].cp -= sk.cost;
  u.cd[k] = now + sk.cd;
  if (!['kakei', 'kakei_t', 'ikki', 'rakuseki', 'suikei', 'chohatsu', 'senpu', 'konran', 'youdou', 'kyuuen', 'tsuki'].includes(k)) B.text(bt, u.x, u.y, sk.n + '！', u.side === 0 ? 'good' : 'bad');
  if (u.side === 0 && (k === 'kakei' || k === 'kakei_t') && (u.mine || bt.sides[0].cmdAll)) B.tx(bt, 'fire');
  B.logMsg(bt, `${B.ldName(u)}：戦法「${sk.n}」`, u.side === 0 ? 'good' : 'bad');
  return true;
};

/* ---------------- 一騎打ち ---------------- */
B.duelKey = (a, b) => a.id < b.id ? a.id + ':' + b.id : b.id + ':' + a.id;
B.canDuel = (bt, a, b) => !!(a && b && a.ld && b.ld && a.ldFate === 'ok' && b.ldFate === 'ok' && B.alive(a) && B.alive(b) && a.side !== b.side && !bt.duelPairs[B.duelKey(a, b)] && B.edgeDist(a, b) < 35 * bt.p && !a.escort && !b.escort && !(a.ld.wounded || b.ld.wounded));
B.challenge = (bt, a, b) => {
  // a が b に挑む（a は主人公側）
  if (!B.canDuel(bt, a, b)) return 'no';
  bt.duelPairs[B.duelKey(a, b)] = 1;
  const ldb = b.ld;
  const pride = ldb.st === 'ins' ? 0.3 : 0;
  const pAcc = U.clamp(0.45 + pride + ((ldb.bu || 40) - (a.ld.bu || 40)) / 90, 0.08, 0.95);
  if (Math.random() < pAcc) { bt.duel = { a: a.id, b: b.id }; bt.paused = 'duel'; return 'accept'; }
  for (const c of b.cells) c.mor -= 14;
  for (const c of a.cells) c.mor = Math.min(100, c.mor + 8);
  B.text(bt, b.x, b.y, `${ldb.n}は逃げた！`, b.side === 0 ? 'bad' : 'good');
  return 'refuse';
};
B.aiDuels = (bt) => {
  if (bt.duel || bt.duelOffer) return;
  for (const e of bt.units) {
    if (!B.active(e) || !e.ld || e.ldFate !== 'ok' || (e.ld.bu || 0) < 72) continue;
    for (const id of e.eng) {
      const u = bt.units[id];
      if (!u || !u.ld || u.ldFate !== 'ok') continue;
      if (!B.canDuel(bt, e, u)) continue;
      const pl = u.me || e.me;
      const pr = 0.025 * ((e.ld.bu - 60) / 30) * (e.ld.st === 'ins' ? 1.6 : 1) * (D.FORM[e.form].duel || 1);
      if (Math.random() > pr) continue;
      bt.duelPairs[B.duelKey(e, u)] = 1;
      if (pl) {
        const mine = u.me ? u : e, foe = u.me ? e : u;
        bt.duelOffer = { a: mine.id, b: foe.id }; bt.paused = 'duelOffer';
        return;
      }
      B.autoDuel(bt, e, u);
      return;
    }
  }
};
B.duelSim = (A, Bf) => {
  // A,B: 将のスナップショット（武力と特性）
  const fa = B.ldFx(A), fb = B.ldFx(Bf);
  let ha = 60 + A.bu * 1.4 + (fa.duel_hp || 0), hb = 60 + Bf.bu * 1.4 + (fb.duel_hp || 0);
  for (let r = 0; r < 14 && ha > 0 && hb > 0; r++) {
    const da = (8 + A.bu * 0.18) * Math.pow(A.bu / Math.max(1, Bf.bu), 0.8) * U.rf(0.6, 1.4) * (1 + (fa.duel || 0) + (fa.duel_read || 0) * 0.3);
    const db = (8 + Bf.bu * 0.18) * Math.pow(Bf.bu / Math.max(1, A.bu), 0.8) * U.rf(0.6, 1.4) * (1 + (fb.duel || 0) + (fb.duel_read || 0) * 0.3);
    hb -= da; ha -= db;
  }
  if (ha > 0 && hb > 0) return { winner: 'draw' };
  return { winner: ha > hb ? 'a' : 'b', kill: Math.random() < 0.7 };
};
B.autoDuel = (bt, a, b) => {
  const r = B.duelSim(a.ld, b.ld);
  B.text(bt, (a.x + b.x) / 2, (a.y + b.y) / 2, `一騎打ち：${a.ld.n} vs ${b.ld.n}`, 'info');
  B.duelEnd(bt, { a: a.id, b: b.id }, r);
};
B.duelEnd = (bt, d, r) => {
  const a = bt.units[d.a], b = bt.units[d.b];
  bt.duel = null; bt.duelOffer = null; bt.paused = null;
  if (!a || !b) return;
  if (r.winner === 'draw') { B.logMsg(bt, `${a.ld.n}と${b.ld.n}の一騎打ちは引き分けに終わった。`); return; }
  const win = r.winner === 'a' ? a : b, lose = r.winner === 'a' ? b : a;
  for (const c of win.cells) c.mor = Math.min(100, c.mor + 22);
  bt.sides[win.side].mo += 6;
  B.logMsg(bt, `一騎打ち！ ${win.ld.n}が${lose.ld.n}を${r.fled ? '退けた' : r.kill ? '討ち取った' : '打ち負かした'}！`, win.side === 0 ? 'good' : 'bad');
  if (win.side === 0 && win.me) { bt.stat.duelWins++; B.tx(bt, 'duel'); if (r.kill) B.tx(bt, 'duelSlay'); }
  if (r.fled) { for (const c of lose.cells) c.mor -= 15; bt.sides[lose.side].mo -= 3; return; }
  if (lose.ld.player) { if (r.kill) B.playerHit(bt, lose, win, false); else { bt.meFate = bt.meFate === 'ok' ? 'wounded' : bt.meFate; for (const c of lose.cells) c.mor -= 25; } return; }
  if (r.kill) B.leaderLost(bt, lose, win, true);
  else { for (const c of lose.cells) c.mor -= 25; bt.sides[lose.side].mo -= 5; B.logMsg(bt, `${lose.ld.n}は傷を負って退いた。`); lose.ld = Object.assign({}, lose.ld, { wounded: true, bu: Math.round((lose.ld.bu || 40) * 0.6) }); }
  if (win.side === 0 && win.me) bt.stat.duelMerit = (bt.stat.duelMerit || 0) + 40 + Math.pow((lose.ld.bu || 40) / 10, 2) * 4;
};

/* ---------------- 命令遵守（下級） ---------------- */
B.obedience = (bt) => {
  if (bt.spec.role !== 'unit') return;
  const me = bt.units.find(u => u.me && B.alive(u));
  const par = bt.units.find(u => u.parentOfMe && B.alive(u));
  if (!me || !par || me.state === 'rout') return;
  const d = B.dist(me, par);
  if (me.attach === par.id || d < 60 * bt.p) bt.stat.order += 1;
  else if (!me.eng.length) bt.stat.disobey += 1;
  // 上官の命令（表示用）
  const o = par.order;
  const msg = !o ? '持ち場を守れ' : o.type === 'attack' || o.type === 'charge' ? `前の敵を叩け！` : o.type === 'hold' ? '持ち場を守れ' : o.type === 'retreat' ? '退け！' : o.type === 'disengage' ? '一旦退け！' : '進め！';
  if (msg !== bt.bossMsg) { bt.bossMsg = msg; bt.bossMsgT = bt.time; }
};

/* ---------------- 夜・日の終わり ---------------- */
B.dayEnd = (bt) => {
  if (bt.day >= bt.maxDays) {
    // 時間切れ
    const r0 = B.strength(bt, 0) / Math.max(1, bt.sides[0].start), r1 = B.strength(bt, 1) / Math.max(1, bt.sides[1].start);
    const s0 = B.strength(bt, 0), s1 = B.strength(bt, 1);
    if (bt.city) B.end(bt, bt.city.side, bt.city.pass ? '関は持ちこたえた' : '城は持ちこたえた');
    else if (s0 > s1 * 1.6 && r0 > r1) B.end(bt, 0, '敵は戦場から退いた');
    else if (s1 > s0 * 1.6 && r1 > r0) B.end(bt, 1, '戦場から退いた');
    else B.end(bt, -1, '日没。両軍兵を引いた（引き分け）');
    return;
  }
  bt.paused = 'night';
  B.logMsg(bt, `${bt.day}日目が暮れた。両軍は陣へ戻る。`);
};
B.strength = (bt, s) => U.sum(bt.units.filter(u => u.side === s && B.active(u)), u => u.n);
B.night = (bt, choice) => {
  const res = [];
  const p = bt.p;
  // AIの夜襲
  const ai = bt.sides[1];
  if (ai.tactics.includes('yashuu') && Math.random() < 0.35) {
    const tgt = U.pick(B.friends(bt, 0).filter(u => u.state !== 'rout'));
    if (tgt) {
      const raider = U.maxBy(B.friends(bt, 1), u => B.F(u, 'night')) || null;
      const ok = Math.random() < (0.45 + (raider ? B.F(raider, 'night') : 0)) * Math.max(0.2, 1 - B.F(tgt, 'night_def'));
      const loss = Math.round(tgt.n * (ok ? 0.1 : 0.03)); B.applyHits(bt, tgt, loss, null, 0, 0, null, 0.8, true); res.push(ok ? `夜半、敵の夜襲を受けた！ ${B.unitName(bt, tgt)}が${loss}人を失った。` : `敵の夜襲を見破り、撃退した。（損害${loss}）`);
    }
  }
  if (choice && choice.k === 'raid') {
    const u = bt.units[choice.unit];
    const foe = U.pick(B.friends(bt, 1).filter(x => x.state !== 'rout'));
    if (u && foe) {
      const chi = (u.ld?.chi || 40) - (foe.ld?.chi || 40);
      const pr = U.clamp(0.4 + chi / 200 + (u.cls === 'cav' ? 0.08 : 0) + (bt.sides[0].tactics.includes('yashuu') ? 0.15 : 0) + B.F(u, 'night') - B.F(foe, 'night_def') * 0.5, 0.1, 0.92);
      if (Math.random() < pr) {
        let tot = 0;
        for (const e of B.friends(bt, 1).filter(x => x.state !== 'rout').slice(0, 3)) { const k = Math.round(e.n * U.rf(0.05, 0.11)); B.applyHits(bt, e, k, null, 0, 0, u, 1.2, true); for (const c of e.cells) c.mor -= 18; tot += k; }
        B.applyHits(bt, u, Math.round(u.n * 0.03), null, 0, 0, null, 0.3, true);
        res.push(`夜襲は成功！ 敵陣は混乱し、約${tot}人を討った。`); B.tx(bt, 'night');
        bt.sides[1].mo -= 8;
      } else {
        B.applyHits(bt, u, Math.round(u.n * U.rf(0.12, 0.22)), null, 0, 0, null, 1, true);
        for (const c of u.cells) c.mor -= 18;
        res.push('夜襲は読まれていた……。手痛い反撃を受けた。');
      }
    }
  }
  const rest = choice && choice.k === 'rest';
  for (const u of bt.units) {
    if (!B.alive(u)) continue;
    // 交戦を解いて少し下がる
    if (u.eng.length || u.state === 'melee' || u.state === 'disengage') { const dir = u.side === 0 ? 1 : -1; u.y += dir * 25 * p; B.unstick(bt, u); }
    u.eng = []; u.engT = 0; u.chaos = false; u.fat = 0; u.order = u.onwall != null ? null : u.order;
    if (u.state === 'rout') { if (u.n > u.n0 * 0.2 && u.ldFate === 'ok') B.rally(bt, u); }
    else if (u.state !== 'onwall' && u.state !== 'climb') u.state = 'idle';
    const heal = Math.round(Math.max(0, u.n0 - u.n - u.routed - (u.surr || 0)) * (rest && u.side === 0 ? 0.06 : 0.03) * (1 + B.F(u, 'camp_heal')));
    const back = Math.round(u.routed * (u.side === 0 && rest ? 0.25 : 0.15));
    const add = Math.max(0, heal + back);
    if (add > 0 && u.cells.length) { u.routed -= back; u.n += add; u.cells[u.cells.length - 1].n += add; u.cells[u.cells.length - 1].max += add; B.layoutCells(u); }
    for (const c of u.cells) c.mor = Math.min(100, Math.max(c.mor, u.morBase * 0.6) + (rest && u.side === 0 ? 20 : 12));
  }
  if (bt.city) {
    const ds = bt.city.side, starve = bt.sides[1 - ds].acts.has('starve');
    bt.siegeFood = (bt.siegeFood ?? (bt.spec.food ?? 6)) - (starve ? 2 : 1);
    if (starve) { bt.sides[ds].mo -= 4; res.push(ds === 0 ? '兵糧攻めで城内の蓄えが減っていく……' : '兵糧攻めが効いている。城内は飢え始めた。'); }
    if (bt.siegeFood <= 0) { bt.sides[ds].mo -= 12; res.push('城内の兵糧が尽きかけている。守兵の士気が落ちた。'); }
    const rep = bt.sides[ds].acts.has('roujou') ? 0.1 : 0.05;
    for (const w of bt.walls) if (!w.broken && w.kind === 'wall') w.hp = Math.min(w.maxhp, w.hp + w.maxhp * rep);
  }
  bt.day++;
  bt.time = bt.dayLen * (bt.day - 1);
  bt.paused = null;
  B.plan(bt, 0); B.plan(bt, 1);
  B.logMsg(bt, `${bt.day}日目の夜が明けた。`);
  return res;
};

/* ---------------- 決着 ---------------- */
B.retreat = (bt, s) => {
  bt.sides[s].retreat = true; bt.sides[s].retreatT = bt.time;
  for (const u of bt.units) if (u.side === s && B.alive(u)) { u.attach = null; B.setOrder(bt, u, { type: 'retreat' }); }
  B.logMsg(bt, `${bt.sides[s].name}は撤退を始めた。`, s === 0 ? 'bad' : 'good');
};
B.checkEnd = (bt) => {
  if (bt.ended) return;
  const lost = [false, false], why = ['', ''];
  for (let s = 0; s < 2; s++) {
    const sd = bt.sides[s];
    const act = B.strength(bt, s);
    const ratio = act / Math.max(1, sd.start);
    if (sd.retreat && bt.time - sd.retreatT > 8) { lost[s] = true; why[s] = '撤退'; }
    else if (ratio < 0.2) { lost[s] = true; why[s] = '総崩れ'; }
    else if (sd.cmdDead && bt.time - sd.cmdDeadT > 10) { lost[s] = true; why[s] = '総大将を失った'; }
    else if (!bt.units.some(u => u.side === s && B.active(u))) { lost[s] = true; why[s] = '全軍潰走'; }
    if (bt.city && bt.city.side !== s && ratio < 0.33) { lost[s] = true; why[s] = '攻めあぐねて退いた'; }
  }
  if (bt.cityTaken) { lost[bt.city.side] = true; why[bt.city.side] = bt.city.pass ? '関が落ちた' : '城が落ちた'; }
  if (bt.meFate === 'dead' && bt.sides[0].cmdAll) { lost[0] = true; why[0] = '総大将（主人公）討死'; }
  if (lost[0] && lost[1]) { const r0 = B.strength(bt, 0) / bt.sides[0].start, r1 = B.strength(bt, 1) / bt.sides[1].start; if (r0 >= r1) lost[0] = false; else lost[1] = false; }
  if (lost[0]) B.end(bt, 1, why[0]);
  else if (lost[1]) B.end(bt, 0, why[1]);
  // 敗色濃厚なAIは撤退
  for (let s = 0; s < 2; s++) {
    const sd = bt.sides[s];
    if (sd.player && sd.cmdAll) continue;
    if (sd.retreat) continue;
    if (bt.city && bt.city.side === s) continue;
    if (sd.noRetreat) continue;
    const act = B.strength(bt, s), en = B.strength(bt, 1 - s);
    if (act < sd.start * 0.4 && en > act * 1.8 && bt.time > 30) B.retreat(bt, s);
  }
};
B.end = (bt, winner, reason) => {
  if (bt.ended) return;
  bt.ended = true; bt.winner = winner; bt.reason = reason;
  B.logMsg(bt, winner === 0 ? `勝利！（${reason}）` : winner === 1 ? `敗北……（${reason}）` : reason, winner === 0 ? 'good' : 'bad');
};

/* ---------------- AI ---------------- */
B.power = u => u.n * (u.ut.atk + u.ut.def) / 20 * (0.6 + u.mor / 200) * (0.7 + u.tr / 250);
B.plan = (bt, s) => {
  const sd = bt.sides[s];
  sd.planT = bt.time;
  const mine = bt.units.filter(u => u.side === s && B.active(u));
  const foes = bt.units.filter(u => u.side !== s && B.active(u) && u.vis[s]);
  const myPow = U.sum(mine, B.power), enPow = Math.max(1, U.sum(foes.length ? foes : bt.units.filter(u => u.side !== s && B.active(u)), B.power)) * (sd.misjudge || 1);
  const ratio = myPow / enPow;
  const st = sd.cmd?.st || 'bal';
  const defending = bt.city && bt.city.side === s;
  let plan = sd.plan;
  if (!plan || bt.time - (sd.planSet || 0) > 60) {
    if (defending) plan = 'hold';
    else if (bt.city) plan = 'siege';
    else if (ratio < 0.65 && st !== 'ins') plan = sd.tactics.includes('fukuhei') ? 'lure' : 'hold';
    else if (ratio > 1.5) plan = st === 'chi' ? 'envelop' : 'advance';
    else plan = st === 'ins' ? (Math.random() < 0.5 ? 'advance' : 'breakthrough') : st === 'chi' ? (Math.random() < 0.5 ? 'envelop' : (sd.tactics.includes('fukuhei') && bt.points.some(p => p.type === 'forest') ? 'lure' : 'seize')) : (Math.random() < 0.5 ? 'advance' : 'envelop');
    sd.plan = plan; sd.planSet = bt.time;
  }
  // 時間経過で守勢から攻勢へ
  if (plan === 'hold' && !defending && bt.time > bt.dayLen * 0.35 && ratio > 0.8) plan = sd.plan = 'advance';
  if (plan === 'lure' && bt.time > 120) plan = sd.plan = 'advance';
  if (plan === 'seize' && bt.time > 100) plan = sd.plan = 'advance';
  const cx = U.avg(mine, u => u.x) || bt.W / 2;

        else if (x < a + 3 || x > b - 3) { if (GEO.hash(c >> 1, r >> 1, 91) < 0.55) ft[i] = T.ROCK; FE[i] = Math.max(FE[i], 0.7); }
        else if (ft[i] === T.MOUNT) ft[i] = T.HILL;
      }
    }
    // 抜け道
    const startR = cs === 1 ? FR - 8 * B.TS * F : 7 * B.TS * F, endR = cs === 1 ? Math.round(FR * 0.18) : Math.round(FR * 0.82);
    const dir = startR < endR ? 1 : -1;
    let pc = FC * 0.12; const pts = [];
    for (let r = startR; dir > 0 ? r <= endR : r >= endR; r += dir * F) { pc = U.clamp(pc + (rnd() - 0.5) * F * 1.6, 3 * F, vL(r) - 3 * F); pts.push([(pc + 0.5) * fc, (r + 0.5) * fc]); }
    const ex = vL(endR) + 2;
    for (let k = 1; k <= 4; k++) pts.push([(pc + (ex - pc) * k / 4 + 0.5) * fc, (endR + 0.5 + Math.sin(k) * 2) * fc]);
    B.fieldLine(f, pts, fc * 3, (i) => { const t = ft[i]; if (t === T.MOUNT || t === T.ROCK || t === T.HILL || t === T.FOREST || t === T.GROVE) ft[i] = T.PATH; });
    bt.feat.passPath = pts;
    bt.secretPath = { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
  }
  // 3. 田畑（区画ごと。向きは戦場ごと）
  if (mix.farm > 0.02) {
    const fa = bt.feat.fieldAng, fca = Math.cos(fa), fsa = Math.sin(fa);
    const pw = fc * (4 + rnd() * 3), ph = fc * (6 + rnd() * 4);
    for (let r = 0; r < FR; r++) for (let c = 0; c < FC; c++) {
      const i = r * FC + c, t = ft[i];
      if (t !== T.PLAIN && t !== T.DIRT && t !== T.GRASS && !(t === T.HILL && FE[i] < th.hill + 0.05)) continue;
      const x = (c + 0.5) * fc, y = (r + 0.5) * fc;
      const iu = Math.floor((x * fca + y * fsa) / pw), iv = Math.floor((-x * fsa + y * fca) / ph);
      const pr = mix.farm * (0.55 + (FM[i] - 0.5) * 0.9 + (1 - Math.abs(FE[i] - 0.45) * 2) * 0.3);
      if (GEO.hash(iu, iv, sd & 1023) < pr) ft[i] = paddy && FE[i] < 0.5 ? T.PADDY : T.FIELD;
    }
    bt.feat.parcel = { pw, ph };
  }
  // 4. 大河
  const hasRiver = spec.kind !== 'pass' && ((site && site.river && site.river.d < R) || theme === 'river' || (theme === 'marsh' && rnd() < 0.5));
  if (hasRiver) {
    const rw = site && site.river ? site.river.w : 1.2;
    const wR = U.clamp(W * (0.018 + 0.011 * rw), Math.max(fc * 4, bt.tile * 2.2), W * 0.075);
    let py = H * (0.44 + rnd() * 0.12), px = W / 2, a = (rnd() - 0.5) * 0.3;
    if (site && site.river && site.river.d < R) { const [mx, my] = mapP(site.river.dx, site.river.dy); px = U.clamp(mx, W * 0.2, W * 0.8); py = U.clamp(my, H * 0.38, H * 0.62); a = dirB(site.river.ang); a = U.clamp(a, -0.45, 0.45); }
    const amp = W * (0.02 + rnd() * 0.025), ph = rnd() * 6.28, fq = 1 + rnd() * 1.5;
    const pts = [];
    for (let k = -2; k <= 42; k++) {
      const x = W * k / 40;
      const y = py + Math.tan(a) * (x - px) + Math.sin(x / W * 6.28 * fq + ph) * amp + (n5(x / W * 5, 0.37, 2) - 0.5) * amp * 1.2;
      pts.push([x, U.clamp(y, H * 0.3, H * 0.7)]);
    }
    const bank = wR / 2 + fc * 2.5;
    B.fieldLine(f, pts, bank * 2, (i, d) => {
      if (d <= wR / 2) { ft[i] = T.RIVER; FE[i] = Math.min(FE[i], 0.3); }
      else { const t = ft[i]; if (t === T.MOUNT || t === T.HILL || t === T.ROCK || t === T.FOREST) ft[i] = T.PLAIN; if (FS[i] > 0.6 && ft[i] !== T.VILLAGE) ft[i] = T.SAND; FE[i] = Math.min(FE[i], 0.42); }
    });
    // 浅瀬
    const fords = [];
    const nF = wR > W * 0.05 ? 2 : 3;
    for (let k = 0; k < nF; k++) {
      const fx = W * (0.15 + (k + rnd() * 0.6) * 0.7 / nF);
      fords.push(fx);
      const len = Math.max(bt.tile * 2.2, W * 0.035);
      for (let r = 0; r < FR; r++) for (let c = Math.floor((fx - len / 2) / fc); c <= Math.floor((fx + len / 2) / fc); c++) { if (c < 0 || c >= FC) continue; const i = r * FC + c; if (ft[i] === T.RIVER) ft[i] = T.FORD; }
    }
    bt.feat.river = { pts, w: wR, n: site && site.river ? site.river.n : null, fords };
  }
  // 5. 小川
  let nS = (site && site.stream && site.stream.d < R ? 1 : 0) + (theme === 'river' || theme === 'marsh' ? 1 : 0) + (rnd() < 0.45 ? 1 : 0);
  if (steppe || spec.kind === 'pass' || (site && site.sand > 0.4)) nS = Math.min(nS, 1);
  for (let s = 0; s < Math.min(3, nS); s++) {
    // 端から川（なければ反対の端）へ
    const fromLeft = rnd() < 0.5;
    let x0 = fromLeft ? -W * 0.02 : W * 1.02, y0 = H * (0.2 + rnd() * 0.6);
    let x1, y1;
    if (bt.feat.river) { const rp = bt.feat.river.pts; const q = rp[Math.floor(rp.length * (0.25 + rnd() * 0.5))]; x1 = q[0]; y1 = q[1]; if (rnd() < 0.5) { x0 = W * (0.15 + rnd() * 0.7); y0 = rnd() < 0.5 ? -H * 0.02 : H * 1.02; } }
    else { x1 = fromLeft ? W * 1.02 : -W * 0.02; y1 = H * (0.2 + rnd() * 0.6); }
    const pts = B.wobbly(x0, y0, x1, y1, W * 0.06, 40, rnd);
    const w = Math.max(fc * 1.7, W * 0.006);
    B.fieldLine(f, pts, w, (i) => { const t = ft[i]; if (t !== T.RIVER && t !== T.FORD && t !== T.MOUNT) { ft[i] = T.STREAM; FE[i] = Math.min(FE[i], 0.5); } });
    bt.feat.streams.push({ pts, w });
  }
  // 6. 池・湖
  const nP = (site && site.lake && site.lake.d < R ? 1 : 0) + (mix.farm > 0.2 && rnd() < 0.5 ? 1 : 0) + (theme === 'marsh' ? 1 : 0);
  for (let k = 0; k < nP; k++) {
    const big = k === 0 && site && site.lake;
    const rp = (big ? 0.07 : 0.025 + rnd() * 0.02) * W;
    const cx = rnd() < 0.5 ? W * (0.08 + rnd() * 0.14) : W * (0.78 + rnd() * 0.14), cy = H * (0.3 + rnd() * 0.4);
    const ph = rnd() * 6.28;
    for (let r = Math.max(0, Math.floor((cy - rp * 1.4) / fc)); r <= Math.min(FR - 1, Math.ceil((cy + rp * 1.4) / fc)); r++) for (let c = Math.max(0, Math.floor((cx - rp * 1.4) / fc)); c <= Math.min(FC - 1, Math.ceil((cx + rp * 1.4) / fc)); c++) {
      const x = (c + 0.5) * fc, y = (r + 0.5) * fc, a = Math.atan2(y - cy, x - cx), d = Math.hypot(x - cx, y - cy);
      const rr = rp * (1 + 0.25 * Math.sin(a * 3 + ph) + 0.12 * Math.sin(a * 5 + ph * 2));
      const i = r * FC + c;
      if (d < rr && ft[i] !== T.RIVER && ft[i] !== T.MOUNT) { ft[i] = T.POND; FE[i] = Math.min(FE[i], 0.3); }
      else if (d < rr + fc * 2 && (ft[i] === T.PLAIN || ft[i] === T.FIELD || ft[i] === T.GRASS || ft[i] === T.DIRT)) ft[i] = T.MARSH;
    }
    bt.feat.ponds.push({ x: cx, y: cy, r: rp, n: big ? site.lake.n : null });
  }
  // 7. 大道（川は橋で渡る）
  const roadAt = (pts, w, major) => {
    B.fieldLine(f, pts, w, (i) => {
      const t = ft[i];
      if (t === T.RIVER || t === T.POND) ft[i] = T.BRIDGE;
      else if (t === T.MOUNT || t === T.ROCK) ft[i] = T.PATH;
      else if (t !== T.FORD && t !== T.BRIDGE) ft[i] = T.ROAD;
    });
    bt.feat.roads.push({ pts, w, major });
  };
  if (spec.kind !== 'pass') {
    let a = Math.PI / 2 + (rnd() - 0.5) * 0.5, cx = W * (0.4 + rnd() * 0.2), cy = H / 2;
    if (site && site.road && site.road.d < R) { a = dirB(site.road.ang); const [mx, my] = mapP(site.road.dx, site.road.dy); cx = U.clamp(mx, W * 0.15, W * 0.85); cy = U.clamp(my, H * 0.2, H * 0.8); }
    // 端から端へ
    const dx = Math.cos(a), dy = Math.sin(a), L = Math.hypot(W, H);
    const p0 = [cx - dx * L, cy - dy * L], p1 = [cx + dx * L, cy + dy * L];
    const pts = B.wobbly(p0[0], p0[1], p1[0], p1[1], W * 0.025, 50, rnd).filter(([x, y]) => x > -W * 0.1 && x < W * 1.1 && y > -H * 0.1 && y < H * 1.1);
    if (pts.length > 2) roadAt(pts, Math.max(fc * 2.6, W * 0.013), true);
  }
  // 8. 郷（村）と、村から大道への小道
  const vlist = [];
  if (site && site.vlist) for (const v of site.vlist) { const [x, y] = mapP(v.dx, v.dy); if (x > W * 0.06 && x < W * 0.94 && y > H * 0.08 && y < H * 0.92) vlist.push({ n: v.n, x, y, s: 1 }); }
  if (site && site.town && site.townD < R * 0.9 && spec.kind !== 'siege' && spec.kind !== 'pass') { const [x, y] = mapP(site.townDx, site.townDy); if (x > W * 0.08 && x < W * 0.92 && y > H * 0.1 && y < H * 0.9) vlist.unshift({ n: site.town, x, y, s: 1.6, town: true }); }
  if (!site) for (let k = 0; k < (mix.village || 0); k++) if (rnd() < 0.7) vlist.push({ n: null, x: W * (0.12 + rnd() * 0.76), y: H * (0.2 + rnd() * 0.6), s: 1 });
  const roadPts = bt.feat.roads.length ? bt.feat.roads[0].pts : null;
  for (const v of vlist.slice(0, 7)) {
    if (spec.kind === 'pass') break;
    const rv = U.clamp(W * 0.02 * v.s, fc * 3.5, W * 0.055 * v.s);
    const ph = rnd() * 6.28;
    let ok = 0;
    for (let r = Math.max(0, Math.floor((v.y - rv * 2.6) / fc)); r <= Math.min(FR - 1, Math.ceil((v.y + rv * 2.6) / fc)); r++) for (let c = Math.max(0, Math.floor((v.x - rv * 2.6) / fc)); c <= Math.min(FC - 1, Math.ceil((v.x + rv * 2.6) / fc)); c++) {
      const x = (c + 0.5) * fc, y = (r + 0.5) * fc, a = Math.atan2(y - v.y, x - v.x), d = Math.hypot(x - v.x, y - v.y);
      const i = r * FC + c, t = ft[i];
      if (t === T.RIVER || t === T.POND || t === T.MOUNT || t === T.ROAD || t === T.BRIDGE || t === T.FORD || t === T.STREAM) continue;
      const rr = rv * (1 + 0.22 * Math.sin(a * 3 + ph) + 0.1 * Math.sin(a * 7 + ph));
      if (d < rr) { ft[i] = T.VILLAGE; ok++; }
      else if (d < rr * 2.4 && (t === T.PLAIN || t === T.DIRT || t === T.GRASS || t === T.GROVE) && GEO.hash(c >> 2, r >> 2, 77) < 0.75) ft[i] = paddy ? T.PADDY : T.FIELD;
    }
    if (!ok) continue;
    bt.feat.villages.push({ n: v.n, x: v.x, y: v.y, r: rv, town: !!v.town });
    // 大道への小道
    if (roadPts) {
      let best = null, bd = Infinity; for (const p of roadPts) { const d = Math.hypot(p[0] - v.x, p[1] - v.y); if (d < bd) { bd = d; best = p; } }
      if (best && bd > rv && bd < W * 0.5) { const pts = B.wobbly(v.x, v.y, best[0], best[1], bd * 0.08, 14, rnd); B.fieldLine(f, pts, Math.max(fc * 1.4, W * 0.006), (i) => { const t = ft[i]; if (t === T.RIVER || t === T.POND) ft[i] = T.BRIDGE; else if (t !== T.FORD && t !== T.BRIDGE && t !== T.VILLAGE && t !== T.MOUNT) ft[i] = T.ROAD; }); bt.feat.roads.push({ pts, w: Math.max(fc * 1.4, W * 0.006), major: false }); }
    }
  }
  // 9. 高さの仕上げ（山は高く、水辺は低く）
  for (let i = 0; i < FN; i++) { const t = ft[i]; if (t === T.MOUNT) FE[i] = Math.max(FE[i], th.mount || 0.75); else if (t === T.RIVER || t === T.POND || t === T.FORD) FE[i] = Math.min(FE[i], 0.3); }
  bt.feat.mix = mix; bt.feat.paddy = paddy; bt.feat.steppe = steppe;
};

/* =========================================================
   七雄覇道 — battle view（描画・操作・HUD）
   ========================================================= */
const V = {};
V.TP = 24; // 地形画像の1タイルのピクセル数

V.css = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
V.hexA = (hex, a) => { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
V._shadeC = new Map();
V.shade = (hex, f) => {
  const key = hex + '|' + f; let v = V._shadeC.get(key); if (v) return v;
  const h = hex.replace('#', ''); const n = parseInt(h, 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  v = `rgb(${r | 0},${g | 0},${b | 0})`; if (V._shadeC.size > 4000) V._shadeC.clear(); V._shadeC.set(key, v); return v;
};
V.morColor = (m) => { m = U.clamp(m, 0, 100); if (m > 60) { const t = (m - 60) / 40; return `rgb(${Math.round(220 - 120 * t)},${Math.round(190 + 20 * t)},${Math.round(70 + 20 * t)})`; } if (m > 30) { const t = (m - 30) / 30; return `rgb(${Math.round(220)},${Math.round(90 + 100 * t)},${Math.round(50 + 20 * t)})`; } const t = m / 30; return `rgb(${Math.round(150 + 70 * t)},${Math.round(40 + 50 * t)},${Math.round(40 + 10 * t)})`; };

/* ---------------- 起動 ---------------- */
V.run = (spec) => new Promise((resolve) => {
  const bt = B.create(spec);
  V.bt = bt; V.resolve = resolve;
  V.ui = { sel: new Set(), mode: null, skill: null, speed: bt.W > 1200 ? 2 : 1, morView: false, follow: false, deploy: true, last: performance.now(), acc: 0, hudT: 0, lastTap: 0, lastTapId: -1, ended: false, logShown: -1, multi: false };
  V.mount();
  V.buildTerrain();
  V.fitCamera(true);
  const me = bt.units.find(u => u.me);
  if (me && (bt.spec.role === 'unit' || bt.W > 900)) V.centerOn(me, bt.spec.role === 'unit' ? 0.55 : 0.85);
  const canDeploy = bt.sides[0].player && bt.spec.role !== 'watch';
  V.ui.deploy = canDeploy;
  V.ui.paused = true;
  V.showDeploy(canDeploy);
  if (me && canDeploy) V.select([me.id]);
  V.loop();
});

V.mount = () => {
  const root = U.$('#scr-battle');
  root.innerHTML = `
    <canvas id="bt-cv"></canvas>
    <div class="bt-top">
      <div class="bt-row">
        <button class="bt-ic" id="bt-menu" aria-label="メニュー">≡</button>

        <div class="bt-speed" role="group" aria-label="速度">
          <button data-sp="0" aria-label="一時停止">❚❚</button><button data-sp="1">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
        </div>
      </div>
      <div class="bt-bars">
        <div class="bt-side s0"><span id="bt-n0"></span><i><b id="bt-m0"></b></i></div>
        <div class="bt-vs">対</div>

      </div>

  UI.show('battle');

  V.resize();
  if (!V._bound) {
    V._bound = true;
    window.addEventListener('resize', () => { if (V.bt) V.resize(); });

  }
  V.bindInput();
  U.$('#bt-name').textContent = V.bt.spec.title || '合戦';
  for (const b of U.$$('.bt-speed button')) b.onclick = () => V.setSpeed(+b.dataset.sp);
  U.$('#bt-menu').onclick = V.menu;
  V.mini.onclick = (e) => { const r = V.mini.getBoundingClientRect(); const bt = V.bt; V.cam.x = (e.clientX - r.left) / r.width * bt.W; V.cam.y = (e.clientY - r.top) / r.height * bt.H; V.ui.follow = false; };

};
V.resize = () => {

};
V.setSpeed = (sp, silent) => {
  if (!V.ui) return;

  if (sp > 0) V.ui.speed = sp;
  for (const b of U.$$('.bt-speed button')) b.classList.toggle('on', (+b.dataset.sp === 0 && V.ui.paused) || (+b.dataset.sp === V.ui.speed && !V.ui.paused));

/* ---------------- カメラ ---------------- */
V.fitCamera = (init) => {
  const bt = V.bt;
  const availH = V.vh * 0.72, availW = V.vw;
  const z = Math.min(availW / bt.W, availH / bt.H) * 0.98;
  V.cam = { x: bt.W / 2, y: bt.H / 2 + (bt.H * 0.06), z };
  V.zMin = z * 0.8;
  V.zMax = Math.max(z * 40, 30);
};
V.centerOn = (u, zf) => {
  const bt = V.bt;
  V.cam.x = u.x; V.cam.y = u.y - (V.vh * 0.08) / V.cam.z;
  if (zf) { const target = Math.min(V.zMax, Math.max(V.cam.z, Math.min(V.vw, V.vh) * zf / Math.max(30, u.diag * 6))); V.cam.z = target; V.cam.y = u.y; }
  V.clampCam();
};
V.clampCam = () => { const bt = V.bt; V.cam.z = U.clamp(V.cam.z, V.zMin, V.zMax); V.cam.x = U.clamp(V.cam.x, 0, bt.W); V.cam.y = U.clamp(V.cam.y, -bt.H * 0.05, bt.H * 1.05); };
V.w2s = (x, y) => [(x - V.cam.x) * V.cam.z + V.vw / 2, (y - V.cam.y) * V.cam.z + V.vh / 2];
V.s2w = (sx, sy) => [(sx - V.vw / 2) / V.cam.z + V.cam.x, (sy - V.vh / 2) / V.cam.z + V.cam.y];

/* ---------------- 地形画像 ---------------- */
V.buildTerrain = () => {
  const bt = V.bt, TP = V.TP;
  const c = document.createElement('canvas');
  c.width = bt.cols * TP; c.height = bt.rows * TP;
  V.tcv = c; V.tctx = c.getContext('2d');
  V.trng = U.rng((bt.spec.seed || 1) + 5);
  for (let i = 0; i < bt.cols * bt.rows; i++) V.drawTile(i, true);
  V.drawTileDetails();
  bt._terrSnap = bt.terr.slice();
  // ミニマップ用
  const m = document.createElement('canvas'); m.width = bt.cols; m.height = bt.rows;

V.bindInput = () => {
  const cv = V.cv;

  let pinch = null, drag = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

    cv.setPointerCapture(e.pointerId);
    const [x, y] = pos(e);

    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, z: V.cam.z, camx: V.cam.x, camy: V.cam.y };
      drag = null;
    } else if (ptrs.size === 1) {
      drag = { x, y, camx: V.cam.x, camy: V.cam.y, unit: null };

      if (V.ui.deploy) { const u = V.hit(x, y); if (u && u.side === 0 && V.canDeployMove(u)) { drag.unit = u; drag.offx = u.x; drag.offy = u.y; V.select([u.id]); } }

      clearTimeout(V._lp);
      V._lp = setTimeout(() => { const p = ptrs.get(e.pointerId); if (p && !p.moved && ptrs.size === 1) { p.long = true; V.longPress(p.x, p.y); } }, 480);
    }
  };
  cv.onpointermove = (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const [x, y] = pos(e); p.x = x; p.y = y;
    if (Math.hypot(x - p.sx, y - p.sy) > 8) p.moved = true;
    if (pinch && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;

V.hit = (sx, sy) => {

    if (!B.alive(u)) continue;
    if (u.side !== 0 && !u.vis[0] && bt.spec.role !== 'watch') continue;
    const [lx, ly] = B.toLocal(u, wx, wy);
    const inside = Math.abs(lx) <= u.w / 2 + pad && Math.abs(ly) <= u.h / 2 + pad;
    // 旗も当たり
    const [fx, fy] = B.toWorld(u, 0, -u.h / 2);

    const onFlag = Math.abs(sx - bx - 6) < 14 && sy < by && sy > by - 44;
    if (inside || onFlag) { const d = Math.hypot(lx, ly) / Math.max(1, Math.min(u.w, u.h)) + (onFlag ? -1 : 0) + (u.side === 0 ? 0 : 0.2); if (d < bd) { bd = d; best = u; } }

V.tap = (sx, sy) => {

  if (mode === 'attack') { if (u && u.side !== 0) { V.orderAttack(u); V.setMode(null); } else V.toast('敵の部隊をタップ'); return; }
  if (mode === 'move') { V.orderMove(wx, wy); V.setMode(null); return; }
  if (V.ui.deploy) { if (u && u.side === 0) V.select([u.id]); else V.select([]); return; }

    const now = performance.now();
    if (now - V.ui.lastTap < 320 && V.ui.lastTapId === u.id && B.canCommand(bt, u)) { V.selectSimilar(u); V.ui.lastTap = 0; return; }

V.longPress = (sx, sy) => {

};
V.orderAt = (sx, sy) => { const u = V.hit(sx, sy); const [wx, wy] = V.s2w(sx, sy); if (u && u.side !== 0) V.orderAttack(u); else V.orderMove(wx, wy); };
V.selUnits = () => [...V.ui.sel].map(id => V.bt.units[id]).filter(u => u && B.alive(u));

V.orderMove = (wx, wy) => {
  const bt = V.bt, us = V.cmdUnits();

  if (one && B.skillsOf(bt, one).length) add('skill', '戦法', { cls: 'em' });

    if (can.some(x => x.t === 'ram')) add('ram', '破城');

  if (one && bt.spec.role === 'unit') { const par = bt.units.find(x => x.parentOfMe); if (par && B.alive(par) && one.attach == null) add('rejoin', '隊に戻る'); }
  cmds.innerHTML = btns.join('');

V.drawCellGrid = (cv, u) => {
  const g = cv.getContext('2d'); const W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  const cols = u.cols, rows = u.rows;
  const cw = Math.min(W / cols, 18), ch = Math.min(H / rows, 14);
  const ox = (W - cw * cols) / 2, oy = (H - ch * rows) / 2;
  for (const c of u.cells) {
    if (c.n <= 0) continue;
    g.fillStyle = V.morColor(c.mor);
    g.fillRect(ox + c.c * cw + 0.5, oy + c.r * ch + 0.5, cw - 1, ch - 1);
    if (c.wi === -1) { g.strokeStyle = '#f3d27a'; g.lineWidth = 1.5; g.strokeRect(ox + c.c * cw + 1, oy + c.r * ch + 1, cw - 2, ch - 2); }
  }
  g.fillStyle = 'rgba(235,227,205,0.65)'; g.fillRect(ox, oy - 2, cw * cols, 1.5);
};
V.cmd = async (k) => {
  const bt = V.bt, us = V.cmdUnits();
  if (!us.length) return;
  const p = bt.p;
  switch (k) {
    case 'attack': V.setMode('attack'); break;
    case 'charge': {
      for (const u of us) {
        const e = U.minBy(B.foes(bt, 0), e => B.dist(u, e));
        if (e && B.edgeDist(u, e) < 160 * p) B.command(bt, u, { type: 'charge', target: e.id });
        else { const [fx, fy] = B.fwd(u.a); B.command(bt, u, { type: 'move', x: u.x + fx * 80 * p, y: u.y + fy * 80 * p, run: true }); }
      }
      break;
    }
    case 'hold': for (const u of us) B.command(bt, u, { type: 'hold' }); break;
    case 'form': {
      const ld = us[0].ld || { tou: 40 };
      const tou = Math.max(...us.map(u => u.ld ? u.ld.tou : 40));
      const f = await UI.choose({ title: '陣形', body: `率いる将の統率で使える陣形が決まる（統率${tou}）。`, choices: D.FORM_ORDER.map(f => ({ v: f, label: D.FORM[f].n + (us.every(u => u.form === f) ? '（現在）' : ''), sub: `${D.FORM[f].desc}${D.FORM[f].req ? `　要統率${D.FORM[f].req}` : ''}`, disabled: D.FORM[f].req > tou })).concat([{ v: null, label: 'やめる' }]) });
      if (f) for (const u of us) if (!u.ut.fixed && D.FORM[f].req <= (u.ld ? u.ld.tou : 40) + 5) B.command(bt, u, { type: 'form', f });
      break;
    }
    case 'dis': for (const u of us) if (u.eng.length) B.command(bt, u, { type: 'disengage' }); break;
    case 'rg': for (const u of us) { B.command(bt, u, { type: 'rearguard' }); } V.toast('殿を務める'); break;
    case 'zone': if (us.some(u => u.zone)) { for (const u of us) u.zone = null; V.toast('射撃区域を解除'); } else V.setMode('zone'); break;
    case 'hide': { let n = 0; for (const u of us) if (B.canHide(bt, u)) { B.setOrder(bt, u, { type: 'ambush' }); n++; } V.toast(n ? '伏兵として潜ませた' : '隠れられる地形にいない'); break; }
    case 'skill': {
      const u = us[0];
      const sk = B.skillsOf(bt, u);
      const pick = await UI.choose({ title: `戦法（采配 ${Math.floor(B.cpOf(bt, u))}）`, choices: sk.map(k2 => ({ v: k2, label: `${D.SKILLS[k2].n}（${D.SKILLS[k2].cost}）`, sub: D.SKILLS[k2].d + ((u.cd[k2] || 0) > bt.time ? `　再使用まで${Math.ceil(u.cd[k2] - bt.time)}秒` : ''), disabled: !B.canSkill(bt, u, k2) })).concat([{ v: null, label: 'やめる' }]) });
      if (!pick) break;
      if (['kakei', 'kakei_t'].includes(pick)) { V.ui.skill = { u: u.id, k: pick }; V.setMode('skillpt', '火を放つ場所をタップ（森・草地）'); break; }
      if (pick === 'rakuseki') { const pts = bt.points.filter(pt => pt.type === 'hill' && pt.owner === 0 && !pt.used); if (!pts.length) { V.toast('確保した丘がない'); break; } B.useSkill(bt, u, pick, { point: pts[0].id }) || V.toast('使えない'); break; }
      if (pick === 'ikki' || pick === 'sogeki' || pick === 'konran' || pick === 'hien') { V.ui.skill = { u: u.id, k: pick }; V.setMode('skillpt', '狙う敵部隊をタップ'); break; }
      if (!B.useSkill(bt, u, pick)) V.toast('今は使えない');
      break;
    }
    case 'duel': {
      const u = us[0];
      const near = bt.units.filter(e => e.side === 1 && B.alive(e) && B.canDuel(bt, u, e));
      if (!near.length) break;
      const e = near.length === 1 ? near[0] : bt.units[await UI.choose({ title: '一騎打ちの相手', choices: near.map(e => ({ v: e.id, label: e.ld.n, sub: `武${e.ld.bu}` })) })];
      if (!e) break;
      const r = B.challenge(bt, u, e);
      if (r === 'refuse') V.toast(`${e.ld.n}は一騎打ちを避けた`);
      break;
    }
    case 'split': { const v = B.split(bt, us[0]); if (v) { V.select([us[0].id, v.id]); V.toast('隊を分けた'); } break; }
    case 'climb': {
      for (const u of us.filter(x => x.cls === 'inf')) {
        const w = U.minBy(bt.walls.filter(w => w.kind === 'wall' && w.side !== 0 && w.captured < 0), w => U.dist(w.x, w.y, u.x, u.y) * (w.tower ? 0.5 : 1));
        if (w) B.command(bt, u, { type: 'climb', wall: w.id });
      }
      break;
    }
    case 'ram': for (const u of us.filter(x => x.t === 'ram')) { const g = U.minBy(bt.walls.filter(w => w.kind === 'gate' && !w.broken && w.side !== 0), w => U.dist(w.x, w.y, u.x, u.y)); if (g) B.command(bt, u, { type: 'ramgate', wall: g.id }); } break;
    case 'wall': for (const u of us.filter(x => x.cls === 'rng')) { const w = U.minBy(bt.walls.filter(w => w.kind === 'wall' && w.side === 0 && w.def == null), w => U.dist(w.x, w.y, u.x, u.y)); if (w) { B.setOrder(bt, u, { type: 'hold' }); B.putOnWall(bt, u, w); } } break;
    case 'dlg': {
      if (us.some(u => u.delegate)) { for (const u of us) B.delegate(bt, u, null); V.toast('自ら指揮を執る'); break; }
      const deps = bt.deputies || [];
      const gs = bt.sides[0].gunshi;
      const ch = deps.map((d, i) => ({ v: i, label: `${d.n}に任せる`, sub: `統${d.tou} 知${d.chi}${d.good || gs ? '　（自ら判断して戦える）' : '　（未熟：持ち場を守るのみ）'}` }));
      if (!ch.length) ch.push({ v: -1, label: '兵に任せる', sub: '副官がいないため、持ち場を守るだけ' });
      ch.push({ v: null, label: 'やめる' });
      const di = await UI.choose({ title: '委任', body: gs ? `軍師${gs.n}の策に従い、副官が判断して戦う。` : '統率60以上か知力65以上の副官なら、自ら判断して戦える。', choices: ch });
      if (di == null) break;
      const mode = await UI.choose({ title: '方針', choices: [{ v: 'attack', label: '攻勢', sub: '敵を求めて攻める' }, { v: 'defend', label: '守勢', sub: 'その場を守る' }, { v: 'flank', label: '遊撃', sub: '敵の側背を突く（騎兵向き）' }, { v: 'follow', label: '本隊に続く', sub: '主人公の隊を守ってついて来る' }] });
      if (!mode) break;
      const dep = di >= 0 ? deps[di] : null;
      for (const u of us) if (!u.me) B.delegate(bt, u, mode, dep);
      V.toast(us.some(u => u.me) ? '本隊以外を委任した。本隊は自ら率いる' : '委任した');
      break;
    }
    case 'back': for (const u of us) B.command(bt, u, { type: 'retreat' }); break;
    case 'rejoin': { const par = bt.units.find(x => x.parentOfMe); if (par) B.setOrder(bt, us[0], { type: 'rejoin', parent: par.id }); break; }
  }
  V.ui.panelKey = null;
  V.renderPanel();
};
V.useSkillAt = (wx, wy, target) => {
  const bt = V.bt, s = V.ui.skill; V.setMode(null);

  if (s.k === 'ikki' || s.k === 'sogeki' || s.k === 'konran' || s.k === 'hien') ok = target && target.side === 1 ? B.useSkill(bt, u, s.k, { target: target.id }) : false;
  else ok = B.useSkill(bt, u, s.k, { x: wx, y: wy });

};

V.handlePause = async () => {
  const bt = V.bt;
  if (V.ui.modal) return;
  if (bt.paused === 'night') {
    V.ui.modal = true;
    const res = await V.nightUI();
    V.ui.modal = false;
    return;
  }
  if (bt.paused === 'duelOffer') {
    V.ui.modal = true;
    const d = bt.duelOffer; const a = bt.units[d.a], e = bt.units[d.b];
    const ok = await UI.choose({ title: '一騎打ちを挑まれた！', seal: '一騎打ち', body: `${e.ld.n}（武${e.ld.bu}）が「${a.ld.n}、勝負しろ！」と叫んでいる。`, choices: [{ v: 1, label: '受けて立つ' }, { v: 0, label: '取り合わない（士気が下がる）' }] });
    if (ok) { bt.duel = d; bt.paused = 'duel'; V.ui.modal = false; return; }
    for (const c of a.cells) c.mor -= 12;
    bt.duelOffer = null; bt.paused = null; V.ui.modal = false;

  }
  if (bt.paused === 'duel') {
    V.ui.modal = true;
    const d = bt.duel; const a = bt.units[d.a], e = bt.units[d.b];
    const r = await UI.duel({ a: a.ld, b: e.ld, title: `一騎打ち：${a.ld.n} 対 ${e.ld.n}`, battle: true });
    B.duelEnd(bt, d, { winner: r.win ? 'a' : r.draw ? 'draw' : 'b', kill: r.kill, fled: r.fled ? (r.win ? 'b' : 'a') : null });

    return;
  }
};

V.checkChallenge = () => {
  const bt = V.bt;
  if (!bt.pendingChallenge) return;
  const c = bt.pendingChallenge; bt.pendingChallenge = null;
  const a = bt.units[c.a], b = bt.units[c.b];
  if (a && a.me && b) B.challenge(bt, a, b);
  else if (a && b && B.canDuel(bt, a, b)) { bt.duelPairs[B.duelKey(a, b)] = 1; B.autoDuel(bt, a, b); }
};

    ctx.strokeStyle = 'rgba(200,214,226,.35)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const p of wx.parts) { p.y += dt * 1.6 * p.s * sp; p.x += dt * 0.15 * wdx * sp; if (p.y > 1) { p.y -= 1; p.x = Math.random(); } if (p.x > 1) p.x -= 1; if (p.x < 0) p.x += 1; const x = p.x * W, y = p.y * H; ctx.moveTo(x, y); ctx.lineTo(x - 3 * p.s - wdx * 4, y - 13 * p.s); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(40,52,62,.12)'; ctx.fillRect(0, 0, W, H);
  } else if (wx.k === 'snow') {
    ctx.fillStyle = 'rgba(250,250,252,.8)';
    for (const p of wx.parts) { p.y += dt * 0.08 * p.s * sp; p.x += (Math.sin(t * 1.3 + p.p) * 0.02 + wdx * 0.02) * dt * sp; if (p.y > 1) { p.y -= 1; p.x = Math.random(); } if (p.x > 1) p.x -= 1; if (p.x < 0) p.x += 1; ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 1.2 + p.s, 0, 6.28); ctx.fill(); }
    ctx.fillStyle = 'rgba(220,226,236,.08)'; ctx.fillRect(0, 0, W, H);
  } else if (wx.k === 'fog') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(214,218,214,.28)'); g.addColorStop(0.5, 'rgba(214,218,214,.16)'); g.addColorStop(1, 'rgba(214,218,214,.3)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let k = 0; k < 4; k++) { const x = ((t * 8 * (k + 1) + k * 300) % (W + 400)) - 200, y = H * (0.15 + k * 0.22); const rg = ctx.createRadialGradient(x, y, 10, x, y, 200); rg.addColorStop(0, 'rgba(230,232,228,.22)'); rg.addColorStop(1, 'rgba(230,232,228,0)'); ctx.fillStyle = rg; ctx.fillRect(x - 200, y - 200, 400, 400); }
  } else if (wx.k === 'wind') {
    ctx.strokeStyle = 'rgba(214,196,150,.35)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (const p of wx.parts) { p.x += dt * 0.5 * wdx * p.s * sp; p.y += dt * 0.5 * wdy * p.s * sp + Math.sin(t * 2 + p.p) * 0.0006; if (p.x > 1.05) p.x -= 1.1; if (p.x < -0.05) p.x += 1.1; if (p.y > 1.05) p.y -= 1.1; if (p.y < -0.05) p.y += 1.1; const x = p.x * W, y = p.y * H; ctx.moveTo(x, y); ctx.lineTo(x - wdx * 16 * p.s, y - wdy * 16 * p.s); }
    ctx.stroke();
  } else if (wx.k === 'cloud') {
    ctx.fillStyle = 'rgba(40,46,52,.07)'; ctx.fillRect(0, 0, W, H);
  }
};

UI.drawTitleMap = (cv) => {
  // 画面いっぱいに中原の地形を薄く敷く（地図の絵は全体マップと同じタイルを使う）
  let vw = 1, vh = 1, dpr = 1;
  const fit = () => { const r = cv.getBoundingClientRect(); vw = Math.max(1, r.width); vh = Math.max(1, r.height); dpr = 1; cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr); };
  const g = cv.getContext('2d');
  const fade = () => {
    // 上下を闇に溶かす
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'destination-out';
    const lg = g.createLinearGradient(0, 0, 0, cv.height);
    lg.addColorStop(0, 'rgba(0,0,0,.55)'); lg.addColorStop(0.18, 'rgba(0,0,0,0)'); lg.addColorStop(0.55, 'rgba(0,0,0,0)'); lg.addColorStop(0.85, 'rgba(0,0,0,.92)'); lg.addColorStop(1, 'rgba(0,0,0,1)');
    g.fillStyle = lg; g.fillRect(0, 0, cv.width, cv.height);
    g.globalCompositeOperation = 'source-over';
  };
  const paint = () => {
    if (!document.body.contains(cv)) { MAP.subs.delete(paint); window.removeEventListener('resize', onResize); return; }
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    const s = Math.max(vw / 720, vh / 560);
    const cam = { x: 560, y: 350, s };
    if (MAP.ready && MAP.world) {
      MAP.world.draw(g, cam, vw, vh, dpr);
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'color'; g.fillStyle = '#7a5a2a'; g.fillRect(0, 0, cv.width, cv.height);
      g.globalCompositeOperation = 'multiply'; g.fillStyle = '#8c7c66'; g.fillRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'source-over';
      g.setTransform(s * dpr, 0, 0, s * dpr, (vw / 2 - cam.x * s) * dpr, (vh / 2 - cam.y * s) * dpr);
      g.fillStyle = '#e8c36a';
      for (const p of D.PROVINCES) { g.beginPath(); g.arc(p.x, p.y, p.cap ? 4.5 : 2.6, 0, 6.28); g.fill(); }
      fade();
      cv.classList.add('real');
      return;
    }
    g.setTransform(s * dpr, 0, 0, s * dpr, (vw / 2 - cam.x * s) * dpr, (vh / 2 - cam.y * s) * dpr);
    g.strokeStyle = '#c9a14a'; g.lineWidth = 2;
    for (const rv of D.MAPDECO.rivers) { g.beginPath(); rv.p.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); }
    g.fillStyle = '#c9a14a';
    for (const p of D.PROVINCES) { g.beginPath(); g.arc(p.x, p.y, p.cap ? 6 : 3.5, 0, 6.28); g.fill(); }
    g.strokeStyle = 'rgba(201,161,74,.6)'; g.lineWidth = 1;
    for (const [a, b] of D.EDGES) { const A = S.P[a], Bp = S.P[b]; g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(Bp.x, Bp.y); g.stroke(); }
    fade();
  };
  const onResize = () => { fit(); paint(); };
  window.addEventListener('resize', onResize);
  fit();
  MAP.subs.add(paint);
  paint();
  MAP.init().then(() => paint()).catch(() => {});
};
UI.help = () => UI.info({

`1. 国と立場（伍長〜君主、里典〜丞相）を選び、主人公の能力を決める。
2. 毎月「任務状」の数だけ行動できる。立場ごとにできることが違う。

4. 合戦はリアルタイム。部隊をタップして選び、地面で移動、敵で攻撃。

6. 自国が天下を統一すれば終幕。

// 木と小さな集落（決まった格子から置くので、タイルの境目でずれない）
MAP.flora = (g, L, x0, y0, x1, y1) => {
  const K = MAP.COL;
  const cell = L >= 16 ? 0.5 : 0.8;
  const crown = new Path2D(), hi = new Path2D(), con = new Path2D();
  for (let r = Math.floor(y0 / cell) - 1; r <= Math.ceil(y1 / cell); r++) for (let c = Math.floor(x0 / cell) - 1; c <= Math.ceil(x1 / cell); c++) {
    const h1 = GEO.hash(c, r, 21), h2 = GEO.hash(c, r, 22), h3 = GEO.hash(c, r, 23);
    const x = (c + 0.15 + h1 * 0.7) * cell, y = (r + 0.15 + h2 * 0.7) * cell;
    if (GEO.water(x, y)) continue;
    const e = GEO.elev(x, y);
    const m = GEO.sample(GEO.M, x, y), st = GEO.sample(GEO.STEP, x, y) / 255, lo = GEO.sample(GEO.LOES, x, y) / 255, sd = GEO.sample(GEO.SAND, x, y) / 255;
    if (sd > 0.6) continue;
    const fo = GEO.forestOf(m, e, GEO.fnoise(x, y), st, lo, sd);
    if (fo < 0.04) continue;
    const tn = GEO.vn(x * 1.9 + 5.3, y * 1.9 + 1.7);
    const cov = GEO.smoothstep(-0.1, 0.12, fo * 1.15 - tn * 0.75 - 0.08) * (0.75 + 0.25 * fo);
    if (h3 > cov * 0.92) continue;
    const rr = cell * (0.3 + h1 * 0.14);
    if (e > 0.5 && h2 < 0.65) { con.moveTo(x, y - rr * 1.5); con.lineTo(x + rr * 0.85, y + rr * 0.6); con.lineTo(x - rr * 0.85, y + rr * 0.6); con.closePath(); }
    else { crown.moveTo(x + rr, y); crown.arc(x, y, rr, 0, 6.2832); hi.moveTo(x - rr * 0.2 + rr * 0.45, y - rr * 0.3); hi.arc(x - rr * 0.2, y - rr * 0.3, rr * 0.45, 0, 6.2832); }
  }
  g.fillStyle = K.tree; g.fill(crown); g.fill(con);
  g.fillStyle = K.treeHi; g.fill(hi);
  // 集落（田畑の多い所にぽつぽつ）
  const hc = 3.4, P = new Path2D();
  for (let r = Math.floor(y0 / hc) - 1; r <= Math.ceil(y1 / hc); r++) for (let c = Math.floor(x0 / hc) - 1; c <= Math.ceil(x1 / hc); c++) {
    const h1 = GEO.hash(c, r, 31), h2 = GEO.hash(c, r, 32), h3 = GEO.hash(c, r, 33);
    const x = (c + 0.2 + h1 * 0.6) * hc, y = (r + 0.2 + h2 * 0.6) * hc;
    if (GEO.water(x, y)) continue;
    const cv = GEO.cover(x, y);
    const pop = GEO.sample(GEO.popField, x, y);
    if (h3 > cv.farm * Math.min(1, 0.3 + pop) * 0.5) continue;
    const n = 2 + Math.floor(h1 * 3), ang = h2 * 3;
    for (let k = 0; k < n; k++) {
      const a = GEO.hash(c * 7 + k, r, 34) * 6.2832, d = 0.15 + GEO.hash(c, r * 7 + k, 35) * 0.45;
      MAP.house(P, x + Math.cos(a) * d, y + Math.sin(a) * d, 0.3, 0.21, ang + (GEO.hash(c, r, 36 + k) - 0.5) * 0.4);
    }
  }
  g.fillStyle = K.house; g.fill(P); g.strokeStyle = K.roof; g.lineWidth = Math.max(0.04, 0.7 / L); g.stroke(P);
};
// 海の波
MAP.waves = (g, L, x0, y0, x1, y1) => {
  const cell = 1.6, P = new Path2D();
  for (let r = Math.floor(y0 / cell) - 1; r <= Math.ceil(y1 / cell); r++) for (let c = Math.floor(x0 / cell) - 1; c <= Math.ceil(x1 / cell); c++) {
    const x = (c + GEO.hash(c, r, 51)) * cell, y = (r + GEO.hash(c, r, 52)) * cell;
    if (GEO.water(x, y) !== 1) continue;
    const sd = GEO.sdist(x, y); if (sd > 9 || GEO.hash(c, r, 53) > 0.55) continue;
    const w = 0.35 + GEO.hash(c, r, 54) * 0.3;
    P.moveTo(x - w, y); P.quadraticCurveTo(x - w / 2, y - w * 0.45, x, y); P.quadraticCurveTo(x + w / 2, y - w * 0.45, x + w, y);

/* ---------- 線の間引き（拡大率ごと） ---------- */
MAP.lodFor = (dev) => { const need = 0.6 / dev; for (let k = 0; k < MAP.LOD_T.length; k++) if (MAP.LOD_T[k] <= need) return k; return MAP.LOD_T.length - 1; };
MAP.provPath = (pi, lod) => {
  const c = MAP._pp[lod]; if (c[pi]) return c[pi];
  const P = new Path2D(); let bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const ring of GEO.provRings[pi] || []) {
    const r = GEO.simplify(ring, MAP.LOD_T[lod]); MAP.pathFlat(P, r, false, true);
    const b = GEO.bboxOf(r); bb = [Math.min(bb[0], b[0]), Math.min(bb[1], b[1]), Math.max(bb[2], b[2]), Math.max(bb[3], b[3])];
  }

};
MAP.borderPts = (bi, lod) => { const c = MAP._bp[lod]; if (c[bi]) return c[bi]; const p = GEO.simplify(GEO.borders[bi].pts, MAP.LOD_T[lod]); return (c[bi] = { p, bb: GEO.bboxOf(p) }); };
MAP.landPath = (lod) => {
  if (MAP._land[lod]) return MAP._land[lod];
  const P = new Path2D();
  P.rect(-10, -10, 1020, 740);
  MAP.pathFlat(P, GEO.simplify(GEO.coast, MAP.LOD_T[lod] * 0.5), false); P.lineTo(1000, 720); P.lineTo(1010, 730); P.lineTo(1010, 82); P.closePath();
  for (const c of MAP.C.isles) MAP.pathFlat(P, c.p, false, true);
  for (const l of GEO.lakes) MAP.pathFlat(P, GEO.simplify(l.poly, MAP.LOD_T[lod] * 0.5), false, true);

/* ---------- 文字の置き場（重なりを避ける） ---------- */
MAP.Labels = function () { this.r = []; };
MAP.Labels.prototype.fits = function (x0, y0, x1, y1) { for (const r of this.r) if (x0 < r[2] && x1 > r[0] && y0 < r[3] && y1 > r[1]) return false; return true; };
MAP.Labels.prototype.add = function (x0, y0, x1, y1) { this.r.push([x0, y0, x1, y1]); };
// 一文字ずつ間をあけて書く
MAP.spaced = (g, text, x, y, sp, halo) => {
  const ch = [...text], w = ch.map(c => g.measureText(c).width), tot = w.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  let cx = x - tot / 2;
  ch.forEach((c, i) => { if (halo) g.strokeText(c, cx + w[i] / 2, y); g.fillText(c, cx + w[i] / 2, y); cx += w[i] + sp; });

};

/* ---------- 月を進める ---------- */
UI.endTurn = async () => {
  if (UI._busy) return;
  const me = G.me;
  if (me.ap > 0) {
    const ok = await UI.choose({ title: '月を進める', body: `任務状がまだ${me.ap}枚残っている。`, choices: [{ v: 1, label: '月を進める' }, { v: 0, label: 'まだ行動する' }] });
    if (!ok) return;
  }
  UI._busy = true;
  const btn = U.$('#endturn'); btn.disabled = true;
  const logBefore = G.log.length ? G.log[0] : null;
  try {
    await W.endMonth();
  } catch (e) { console.error(e); UI.toast('エラー：' + e.message); }
  UI._busy = false; btn.disabled = false;
  if (G.over) { await SAVE.auto(); return UI.ending(); }
  await SAVE.auto();
  // 月報
  const newLogs = [];
  for (const l of G.log) { if (l === logBefore) break; newLogs.push(l); }
  const lines = (G.report || []).concat(newLogs.slice(0, 14).map(l => (l.k === 'big' ? '◆' : l.k === 'bad' ? '▼' : l.k === 'good' ? '△' : '・') + l.s));
  if (G.offers.length) lines.push(`◆戦の報せが${G.offers.length}件ある（行動→軍務「戦場へ」）`);
  if (G.me.tasks.length) lines.push(`遂行中の任務：${G.me.tasks.map(t => t.desc).join('／')}`);
  await UI.info({ title: `${S.dateStr()} 月報`, body: lines.join('\n') || '特に変わったことはない。' });
  UI.refresh();
};

    if (ready) {
      const unitKm = 2, target = 90 / s * unitKm, pow = Math.pow(10, Math.floor(Math.log10(target))), nice = [1, 2, 5, 10].map(k => k * pow).filter(v => v <= target).pop() || pow;
      const wpx = nice / unitKm * s, x = 14, y = vh - 92;
      g.strokeStyle = '#231c13'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x, y); g.lineTo(x + wpx, y); g.lineTo(x + wpx, y - 4); g.stroke();
      g.font = `11px ${BODY}`; g.fillStyle = '#231c13'; g.textAlign = 'left'; g.strokeStyle = 'rgba(238,228,198,.85)'; g.lineWidth = 3;
      const tx = `${nice >= 1 ? nice : nice.toFixed(1)}km`; g.strokeText(tx, x + wpx + 6, y - 2); g.fillText(tx, x + wpx + 6, y - 2);
    }
  },
  bind() {
    const cv = this.cv; const ptrs = new Map(); let pinch = null, drag = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.onpointerdown = (e) => { cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ptrs.set(e.pointerId, { x, y, sx: x, sy: y, moved: false }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: this.cam.s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, camx: this.cam.x, camy: this.cam.y }; } else drag = { x, y, camx: this.cam.x, camy: this.cam.y }; };
